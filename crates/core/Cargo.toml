[package]
name = "p2pcore"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[[bin]]
name = "search-bench"
path = "src/bin/search-bench/main.rs"
required-features = ["bench"]

[[bin]]
name = "year-bench"
path = "src/bin/year-bench.rs"
required-features = ["bench"]

[features]
# Benchmark binaries; app, Android and test builds skip them. `cargo build --release --features bench --bin search-bench`.
bench = []

[dependencies]
proto.workspace = true
audio.workspace = true
video = { path = "../video", default-features = false, features = ["net"] }
identity.workspace = true
cryptography.workspace = true
zeroize.workspace = true
opusic-sys = "0.7.5"
sha2.workspace = true
parking_lot = "0.12"
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
iroh = "1.3"
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
hex = "0.4"
bs58 = "0.5"
loro = "1.13.9"
blake3 = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
storage.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
uniffi = { version = "0.32", features = ["cli"] }
bytes = "1"
n0-future = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2"
jni = { version = "0.21", default-features = false }

[dev-dependencies]
proto = { workspace = true, features = ["test-support"] }
