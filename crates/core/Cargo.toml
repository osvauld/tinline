[package]
name = "p2pcore"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[[bin]]
name = "search-bench"
path = "src/bin/search-bench/main.rs"
required-features = ["bench"]

[[bin]]
name = "year-bench"
path = "src/bin/year-bench.rs"
required-features = ["bench"]

[features]
# Debug-only entry points (`video_bench`: codec benchmark that opens a caller-supplied file).
# Android debug builds pass it (android/app/build.gradle.kts); release builds must not.
# `proto/test-support`: `Node::forge_block_notice_for_test` calls proto's forge.
dev-tools = ["video/sim", "proto/test-support"]
# Benchmark binaries; app, Android and test builds skip them. `cargo build --release --features bench --bin search-bench`.
# They drive the synthetic peers, so they need `dev-tools`.
bench = ["dev-tools"]

[dependencies]
proto.workspace = true
audio.workspace = true
video = { path = "../video", default-features = false, features = ["net"] }
identity.workspace = true
cryptography.workspace = true
zeroize.workspace = true
sha2.workspace = true
parking_lot = "0.12"
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
iroh = "1.3"
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
hex = "0.4"
bs58 = "0.5"
loro = "1.13.9"
blake3 = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
storage.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
uniffi = { version = "0.32", features = ["cli"] }
bytes = "1"
n0-future = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# tests/video_calls.rs feeds a synthetic camera (`video::Pattern`).
video = { path = "../video", default-features = false, features = ["net", "sim"] }
proto = { workspace = true, features = ["test-support"] }
# Integration tests use the synthetic peers and test signers (`dev-tools`).
p2pcore = { path = ".", features = ["dev-tools"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2"
jni = { version = "0.21", default-features = false }
