[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "p2p-desktop"
path = "src/main.rs"

[dependencies]
p2pcore = { path = "../core" }
# Shared UI logic (names, call words, time words, emoji, link/block copy).
present = { path = "../present" }
# The BIP39 English word list for the restore grid (checks and suggestions); identity already uses it.
bip39.workspace = true
# Frame conversion (camera formats -> I420, I420 -> RGBA); p2pcore already links it.
video = { path = "../video", default-features = false, features = ["sim"] }
audio.workspace = true
serde.workspace = true
serde_json.workspace = true
iced = { version = "0.14", features = ["tokio", "canvas", "image", "advanced"] }
png = "0.18"
# Icons are rasterised here (no text, so no system font scan; see ui.rs).
resvg = { version = "0.48", default-features = false }
usvg = { version = "0.48", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
open = "5"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
cpal = "0.18"
webrtc-audio-processing = { version = "2.1", features = ["bundled"] }
qrcode = { version = "0.14", default-features = false }
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# OS keyring: keyring-core plus one store per OS (what keyring 4 recommends for apps).
keyring-core = "1"
notify-rust = "4"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

zeroize = "1"
# Camera start timings in the call log (the core's subscriber prints them; RUST_LOG).
tracing = "0.1"
rtrb = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# libvpx VP8: decodes phones' hardware VP8; encodes VP8 for peers that decode it in hardware (docs/design/video-hw-vp8.md).
p2pcore = { path = "../core", features = ["vp8"] }
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
# V4L2 camera capture: pure Rust (no bindgen/libv4l), 0BSD.
linuxvideo = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
# Developer video tuning (Settings → Video, readout in About this call), release builds too while we
# tune codecs; `--no-default-features` builds without it.
default = ["video-tuning"]
video-tuning = []
# Test knobs (P2P_AUTO_ANSWER, P2P_PASSPHRASE, ...) and the TICKET/STATS stderr lines the e2e scripts
# parse. Never enable in a release build.
test-hooks = []
