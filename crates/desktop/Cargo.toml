[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "p2p-desktop"
path = "src/main.rs"

[dependencies]
p2pcore = { path = "../core" }
audio.workspace = true
serde.workspace = true
serde_json.workspace = true
iced = { version = "0.14", features = ["tokio", "canvas", "svg"] }
png = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
cpal = "0.18"
webrtc-audio-processing = { version = "2.1", features = ["bundled"] }
qrcode = { version = "0.14", default-features = false }
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify-rust = "4"
tray-icon = { version = "0.21", default-features = false }

zeroize = "1"
rtrb = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
# Test knobs (P2P_AUTO_ANSWER, P2P_PASSPHRASE, ...) and the TICKET/STATS stderr lines the e2e scripts
# parse. Never enable in a release build.
test-hooks = []
