[package]
name = "group-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The group runtime: the group endpoint, host and member sessions, replication, invitations, chat requests, invite codes, presence, images, member receipts and group calls; built on node-runtime's NodeCtx; no UniFFI"

[features]
# Test helpers for p2pcore's tests and `dev-tools`: synthetic groups, durability fixtures, test knobs.
testkit = ["group-core/dev-tools", "group-core/testkit", "receipts-core/testkit", "proto/test-support", "node-runtime/testkit"]

[dependencies]
proto.workspace = true
identity.workspace = true
cryptography.workspace = true
storage.workspace = true
crdt.workspace = true
chat-core.workspace = true
group-core.workspace = true
receipts-core.workspace = true
transfer.workspace = true
gcall-core.workspace = true
gcall-net.workspace = true
node-runtime.workspace = true
search-ix.workspace = true
search-core.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot = "0.12"
iroh = "1.3"
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
loro = "1.13.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
hex = "0.4"
bytes = "1"
n0-future = "0.3"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }

[dev-dependencies]
# `AccountDirs` for the bare node context the durability tests run on.
account-model.workspace = true
proto = { workspace = true, features = ["test-support"] }
receipts-core = { workspace = true, features = ["testkit"] }
group-core = { workspace = true, features = ["testkit"] }
