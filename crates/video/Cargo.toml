[package]
name = "video"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
# "asm" needs nasm on x86 hosts (and when cross-building for the x86_64 emulator).
rav1e = { version = "0.8", default-features = false, features = ["threading", "asm"] }
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16", "asm"] }
# (bitdepth_16 only because rav1d 1.1 links 16bpc asm symbols even without it.)

[build-dependencies]
cc = "1"
pkg-config = "0.3"
