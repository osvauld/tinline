[package]
name = "video"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["rav1e"]
# rav1e only for comparison benchmarks/tests; the app builds without it.
rav1e = ["dep:rav1e"]
# iroh transport (crate::net); same dependency versions as crates/core.
net = ["dep:iroh", "dep:tokio", "dep:bytes"]

# libvpx VP8 decoder and encoder (`vpx::Vp8Decoder`/`Vp8Encoder`, csrc/vpx_dec.c, vpx_enc.c): the desktop enables it, Android
# decodes VP8 with MediaCodec. Static from scripts/build_libvpx.py (`VPX_DIR`), else the system
# libvpx (pkg-config vpx) on dev hosts.
vp8 = []

# Simulated link, y4m reader, codec bench, synthetic `Pattern` camera and `psnr_y`: dev/test
# tooling, kept out of release libraries (unit tests always have it).
sim = []

[dependencies]
thiserror.workspace = true
libc = "0.2"
iroh = { version = "1.3", optional = true }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"], optional = true }
bytes = { version = "1", optional = true }
# "asm" needs nasm on x86 hosts (and when cross-building for the x86_64 emulator).
rav1e = { version = "0.8", default-features = false, features = ["threading", "asm"], optional = true }
# Git tag, not crates.io: the published 1.1.0 lacks src/arm/asm-offsets.h (ARM asm build fails).
rav1d = { git = "https://github.com/memorysafety/rav1d", tag = "v1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16", "asm"] }
# (bitdepth_16 only because rav1d 1.1 links 16bpc asm symbols even without it.)
# Shared libraries containing rav1d need -Wl,-Bsymbolic (see crates/core/build.rs).

[dev-dependencies]
# Congestion controller choice in the net scenario tests (same version iroh 1.3 uses).
noq-proto = { version = "1.3", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
