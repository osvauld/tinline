[package]
name = "sync-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The own-device runtime: device linking (tinline/link/1) and own-device sync (tinline/self/3) of the account, chat and group docs; built on node-runtime's NodeCtx over chat-runtime and group-runtime; no UniFFI"

[features]
# Test hooks for p2pcore's tests and `dev-tools`.
testkit = ["group-runtime/testkit", "chat-runtime/testkit", "node-runtime/testkit"]

[dependencies]
proto.workspace = true
identity.workspace = true
cryptography.workspace = true
crdt.workspace = true
account-model.workspace = true
node-runtime.workspace = true
chat-runtime.workspace = true
group-runtime.workspace = true
serde.workspace = true
parking_lot = "0.12"
iroh = "1.3"
loro = "1.13.9"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
