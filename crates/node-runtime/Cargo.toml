[package]
name = "node-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The node's base runtime: account session, the private endpoint, the 1:1 call, the contacts cluster (block, caps, device lists, contact requests) and private endpoint rotation; engines above it plug in through NodeHooks; no UniFFI"

[features]
# Synthetic-peer and test hooks for p2pcore's `dev-tools` and unit tests.
testkit = ["account-model/testkit", "proto/test-support"]

[dependencies]
proto.workspace = true
identity.workspace = true
cryptography.workspace = true
account-model.workspace = true
group-core.workspace = true
chat-core.workspace = true
receipts-core.workspace = true
crdt.workspace = true
storage.workspace = true
transfer.workspace = true
audio.workspace = true
call-video.workspace = true
zeroize.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot = "0.12"
iroh = "1.3"
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
bytes = "1"
hex = "0.4"
n0-future = "0.3"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }

[dev-dependencies]
# The block tests forge a notice (`proto::forge_block_notice_for_test`).
proto = { workspace = true, features = ["test-support"] }
