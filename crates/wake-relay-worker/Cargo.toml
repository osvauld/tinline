[package]
name = "wake-relay-worker"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "The push wake relay as a Cloudflare Worker (docs/push.md); logic lives in wake-relay-core"

# Built for wasm32 with worker-build, so it stays out of the main workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wake-relay-core = { path = "../wake-relay-core" }
worker = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto", "SubtleCrypto", "CryptoKey", "WorkerGlobalScope"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
# aes-gcm pulls getrandom in; on Workers it must use crypto.getRandomValues.
getrandom = { version = "0.4", features = ["wasm_js"] }
