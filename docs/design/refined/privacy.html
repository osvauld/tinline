<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Privacy, address changes and blocking · Tinline design</title>
<style>
:root{--bg:#F5F6F3;--sf:#FFFFFF;--sf2:#ECEFEB;--ink:#17201D;--ink2:#4D5853;--ln:#D3D9D4;--ln2:#7C8A83;--pr:#0B6B5B;--onpr:#FFFFFF;--prc:#CDEBE3;--onprc:#06352D;--er:#B3261E;--erc:#F9DEDC;--oner:#410E0B;--rlc:#E1E4F7;--onrlc:#2F3A75;--wn:#FCEFD2;--onwn:#5C3B00;--gold:#C98A1E;--focus:#2F3A75;--shadow:0 8px 28px rgba(15,21,19,.12)}
:root[data-theme=dark]{--bg:#0F1513;--sf:#18211E;--sf2:#212C28;--ink:#E7EDE9;--ink2:#A9B6AF;--ln:#33413B;--ln2:#7F8E87;--pr:#5FCBB3;--onpr:#04201A;--prc:#12433A;--onprc:#BDEFE2;--er:#F2B8B5;--erc:#4A1E1B;--oner:#FBDAD8;--rlc:#2B3160;--onrlc:#D6DBFF;--wn:#3B2E10;--onwn:#F6DDA6;--gold:#E3B04B;--focus:#B9C2FF;--shadow:0 8px 28px rgba(0,0,0,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1513;--sf:#18211E;--sf2:#212C28;--ink:#E7EDE9;--ink2:#A9B6AF;--ln:#33413B;--ln2:#7F8E87;--pr:#5FCBB3;--onpr:#04201A;--prc:#12433A;--onprc:#BDEFE2;--er:#F2B8B5;--erc:#4A1E1B;--oner:#FBDAD8;--rlc:#2B3160;--onrlc:#D6DBFF;--wn:#3B2E10;--onwn:#F6DDA6;--gold:#E3B04B;--focus:#B9C2FF;--shadow:0 8px 28px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html{color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--pr)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 64px}
header.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:8px 0 4px}
.back{display:inline-flex;align-items:center;min-height:44px;gap:6px;text-decoration:none;font-weight:600}
.back:hover{text-decoration:underline}
.tbtn{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--ln2);background:var(--sf);display:inline-flex;align-items:center;gap:8px;font-weight:600}
.tbtn[aria-pressed=true]{background:var(--pr);color:var(--onpr);border-color:var(--pr)}
h1{font-size:28px;line-height:1.2;font-weight:700;margin-top:8px}
.note{display:inline-block;margin-top:8px;font-size:13px;color:var(--ink2);background:var(--rlc);color:var(--onrlc);border-radius:999px;padding:4px 12px}
.lead{color:var(--ink2);margin-top:12px;max-width:68ch}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:20px 0 16px;padding:4px;background:var(--sf2);border-radius:24px}
.tabs button{min-height:44px;padding:6px 10px;border-radius:20px;border:0;background:transparent;font-weight:600;line-height:1.25;text-align:center;overflow-wrap:anywhere;color:var(--ink2)}
@media (min-width:640px){.tabs{border-radius:999px}.tabs button{border-radius:999px;padding:6px 18px}}
.tabs button[aria-selected=true]{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.grid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.grid{grid-template-columns:minmax(0,1fr) 320px;align-items:start}.sim{position:sticky;top:16px}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.card h2{font-size:20px;line-height:1.25}
.card h3{font-size:15px;color:var(--ink2);font-weight:600;letter-spacing:.02em}
.muted{color:var(--ink2)}
.small{font-size:14px;line-height:1.45}
.xs{font-size:13px;line-height:1.4}
.row{display:flex;align-items:center;gap:12px;min-height:44px}
.row .grow{flex:1;min-width:0}
.kv{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kv b{font-weight:600;text-align:right}
.btn{min-height:44px;padding:0 20px;border-radius:999px;border:0;background:var(--pr);color:var(--onpr);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ol{background:transparent;color:var(--pr);border:1px solid var(--ln2)}
.btn.tx{background:transparent;color:var(--pr)}
.btn.dn{background:var(--er);color:var(--onpr)}
.btn.ol.dn{background:transparent;color:var(--er);border-color:var(--er)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;background:var(--rlc);color:var(--onrlc)}
.pill{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--ink2)}
.pill.ok{background:var(--prc);color:var(--onprc)}.pill.wn{background:var(--wn);color:var(--onwn)}.pill.er{background:var(--erc);color:var(--oner)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--gold);color:var(--onwn);background:var(--wn);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle}
.banner{display:flex;gap:12px;border-radius:20px;padding:16px;margin-bottom:16px;align-items:flex-start}
.banner.wn{background:var(--wn);color:var(--onwn)}.banner.er{background:var(--erc);color:var(--oner)}.banner.in{background:var(--rlc);color:var(--onrlc)}.banner.ok{background:var(--prc);color:var(--onprc)}
.banner .body{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.banner b{font-size:16px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{position:relative;flex:1 1 90px}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:999px;border:1px solid var(--ln2);font-weight:600;padding:0 12px}
.seg input:checked+span{background:var(--pr);color:var(--onpr);border-color:var(--pr)}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.sw{width:56px;min-height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.sw i{width:48px;height:28px;border-radius:999px;background:var(--ln2);position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true] i{background:var(--pr)}.sw[aria-checked=true] i::after{transform:translateX(20px)}
.list{display:flex;flex-direction:column;gap:4px}
.item{width:100%;text-align:left;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px;border-radius:16px;border:1px solid transparent;background:transparent}
.item:hover{background:var(--sf2)}
.item[aria-current=true]{background:var(--sf2);border-color:var(--ln2)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--sf2);color:var(--ink2);border:1px solid var(--ln2)}
.dot.done{background:var(--pr);color:var(--onpr);border-color:var(--pr)}
.dot .ic{width:16px;height:16px}
.phone{border:1px solid var(--ln);border-radius:28px;overflow:hidden;background:var(--bg);max-width:400px;width:100%}
.phone .pbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln);background:var(--sf)}
.phone .msgs{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
.msg{max-width:85%;border-radius:18px;padding:8px 12px;font-size:15px;line-height:21px}
.msg.in{background:var(--sf);border:1px solid var(--ln);align-self:flex-start;border-bottom-left-radius:6px}
.msg.out{background:var(--prc);color:var(--onprc);align-self:flex-end;border-bottom-right-radius:6px}
.tick{font-size:12px;margin-top:2px;text-align:right}
.sys{align-self:center;font-size:12px;background:var(--sf2);color:var(--ink2);border-radius:999px;padding:4px 12px;text-align:center}
.composer{padding:12px 16px;border-top:1px solid var(--ln);background:var(--sf);font-size:14px;color:var(--ink2);text-align:center}
.sim{border:1px dashed var(--ln2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.sim h2{font-size:16px}
.sim fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.sim legend{font-weight:600;font-size:14px;padding:0 0 4px}
.rad{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;cursor:pointer}
.rad input{width:20px;height:20px;accent-color:var(--pr);margin:0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;font-size:15px}
details.simd>summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);max-width:min(520px,calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);font-size:15px;z-index:20;transition:opacity .2s}
.toast[hidden]{display:none}
dialog{border:0;border-radius:24px;padding:0;max-width:min(480px,calc(100vw - 24px));width:100%;background:var(--sf);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(15,21,19,.55)}
.dlg{padding:24px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 48px);overflow:auto}
.dlg h2{font-size:22px}
.li{display:flex;gap:12px;align-items:flex-start;color:var(--ink2);font-size:15px;line-height:22px}
.li .ic{margin-top:1px;width:20px;height:20px}
.li b{color:var(--ink)}
.grp{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase;margin-top:4px}
.qr{width:180px;height:180px;background:#fff;border-radius:12px;padding:10px;align-self:center;border:1px solid var(--ln)}
.divider{height:1px;background:var(--ln);border:0;margin:4px 0;width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

<body>
<div class="wrap">
<header class="top">
<a class="back" href="./index.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Home</a>
<button type="button" class="tbtn" id="theme" aria-pressed="false">Dark mode</button>
</header>
<h1>Privacy, address changes and blocking</h1>
<span class="note">Interactive design · simulated data</span>
<p class="lead">Nothing here changes a real address, block, contact or message. Items marked <span class="tag" style="margin-left:0">Proposed</span> are design ideas that are not yet agreed protocol behaviour.</p>

<div class="tabs" role="tablist" aria-label="Sections" id="tabs">
<button type="button" role="tab" id="tab-address" aria-controls="panel" data-act="tab" data-v="address">Address changes</button>
<button type="button" role="tab" id="tab-people" aria-controls="panel" data-act="tab" data-v="people">People and blocking</button>
<button type="button" role="tab" id="tab-lost" aria-controls="panel" data-act="tab" data-v="lost">Can’t reach someone</button>
</div>

<div class="grid">
<main id="panel" role="tabpanel" tabindex="-1" aria-live="off"></main>
<aside class="sim" aria-label="Simulation controls">
<details class="simd" id="simd" open>
<summary>Simulation controls</summary>
<div id="sim" style="display:flex;flex-direction:column;gap:12px;margin-top:8px"></div>
</details>
</aside>
</div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="sr" role="status" aria-live="polite" aria-atomic="true" id="live"></div>
<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg" id="dlgbody"></div></dialog>

<script>
(function(){
'use strict';
var HOUR=3600e3, DAY=24*HOUR, FLOOR=HOUR;
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var ME='Meera';

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var P={
 msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
 call:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
 nocall:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92zM2 2l20 20"/>',
 refresh:'<path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/>',
 block:'<circle cx="12" cy="12" r="9"/><path d="M18.4 5.6 5.6 18.4"/>',
 warn:'<path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 group:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/>',
 device:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',
 shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
 hist:'<path d="M4 4h16v16H4zM4 9h16"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
 bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/>'
};
function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+P[n]+'</svg>'}

/* ---------- simulated state ---------- */
var NOW0=new Date(2026,9,10,15,20).getTime();
var LAST0=new Date(2026,9,9,3,12).getTime();
var S;
function fresh(keepPeople){
 var people=keepPeople?S.people:[
  {id:'priya',name:'Priya N',ini:'PN',how:'From Weekend hike',verified:true,call:false,status:'active',groups:['Weekend hike']},
  {id:'arjun',name:'Arjun Oommen',ini:'AO',how:'Added by QR',verified:false,call:true,status:'active',groups:['Weekend hike']},
  {id:'leo',name:'Leo B',ini:'LB',how:'From a chat request',verified:false,call:false,status:'active',groups:[]},
  {id:'sam',name:'Sam Rao',ini:'SR',how:'Added by QR',verified:true,call:true,status:'active',groups:[]}
 ];
 return people;
}
function init(){
 S={tab:'address',sel:'priya',interval:3,now:NOW0,last:LAST0,next:LAST0+3*DAY,gen:7,failed:false,retryFails:0,scenario:'normal',
  pendingOthers:0,laptopOffline:false,sharedSam:false,hostOnline:true,sam:'lost',dlg:null,opener:null,people:null,syncNote:{}};
 S.people=fresh(false);
}
init();
function person(id){return S.people.filter(function(p){return p.id===id})[0]}

/* ---------- time helpers ---------- */
function pad(n){return (n<10?'0':'')+n}
function fmt(t){var d=new Date(t);return MONTHS[d.getMonth()]+' '+d.getDate()+', '+pad(d.getHours())+':'+pad(d.getMinutes())}
function rel(t){
 var d=t-S.now,a=Math.abs(d),h=Math.round(a/HOUR),dd=Math.round(a/DAY);
 var s;
 if(a<HOUR)s='under an hour';else if(a<48*HOUR)s=h+(h===1?' hour':' hours');else s=dd+' days';
 return d>=0?'in '+s:s+' ago';
}
function overdue(){return S.now>S.next&&!S.failed}

/* ---------- address-change model ---------- */
function attempt(){
 if(S.retryFails>0){S.retryFails--;S.failed=true;return false}
 S.now=Math.max(S.now,S.next);
 S.last=S.now;S.next=S.now+S.interval*DAY;S.gen++;S.failed=false;
 S.people.forEach(function(p){if(p.status==='blocked'&&p.block&&!p.block.retired){p.block.retired=true;p.block.retiredAt=S.now}});
 S.pendingOthers=S.scenario==='offline'?2:S.pendingOthers;
 return true;
}
function setInterval_(d){
 var old=S.interval;S.interval=d;
 if(overdue()||S.failed)return;
 var cand=S.last+d*DAY;
 if(d<old)cand=Math.min(cand,S.next);
 S.next=Math.max(cand,S.now+FLOOR);
}
function counts(){
 var named=S.people.filter(function(p){return p.status==='active'});
 var total=8+named.length;
 var waiting=S.pendingOthers+(S.sam==='recovered'?0:(person('sam').status==='active'?1:0));
 return {total:total,told:total-waiting,waiting:waiting};
}

/* ---------- toast + live ---------- */
var toastT;
function say(t){
 var el=document.getElementById('toast');el.textContent=t;el.hidden=false;
 document.getElementById('live').textContent='';
 setTimeout(function(){document.getElementById('live').textContent=t},30);
 clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true},6000);
}

/* ---------- views ---------- */
function banner(kind,icon,title,body,actions){
 return '<div class="banner '+kind+'" role="group" aria-label="'+esc(title)+'">'+ic(icon)+'<div class="body"><b>'+esc(title)+'</b><span class="small">'+body+'</span>'+(actions?'<div class="btns">'+actions+'</div>':'')+'</div></div>';
}
function viewAddress(){
 var c=counts(),h='';
 if(S.failed){
  h+=banner('er','warn','Address change didn’t finish','Your phone couldn’t start its new address. The current one keeps working for a short while, then stops, and contacts can’t reach you until this succeeds. The app keeps trying. <span class="tag">Proposed</span> How long the current address lasts, and whether it stays on during that time, is still an open decision.','<button type="button" class="btn" data-act="retry">Try again now</button>');
 }else if(overdue()){
  h+=banner('wn','clock','Your address change is overdue','The phone was asleep or off past its change time. It changes once as soon as it wakes, not several times, then the schedule starts again. Until then the old address is still in use.','<button type="button" class="btn" data-act="wake">Simulate waking the phone</button>');
 }else if(c.waiting>0){
  h+=banner('in','info',c.waiting+' contact'+(c.waiting>1?'s':'')+' haven’t got your address yet','They were offline. They get it as soon as you or they next come online. Nothing to do. If both of you changed address while apart, see “Can’t reach someone”.');
 }
 var sel=function(v,l){return '<label><input type="radio" name="iv" data-act="interval" data-v="'+v+'"'+(S.interval===v?' checked':'')+'><span>'+l+'</span></label>'};
 h+='<section class="card" aria-labelledby="h-ac"><h2 id="h-ac" tabindex="-1">Address changes</h2>'+
  '<p class="muted">Your phone changes its network address on a schedule, whether or not anyone is blocked. Contacts and group hosts are told automatically, so chats carry on. Old addresses stop working.</p>'+
  '<div class="banner in" style="margin:0">'+ic('shield')+'<div class="body small"><b>What this does and doesn’t do</b>It makes old addresses useless. It doesn’t hide you from people you’re talking to, and your account stays the same. Anyone you’ve allowed could pass a current address on, so blocking still matters.</div></div>'+
  '<div role="radiogroup" aria-labelledby="iv-l"><div id="iv-l" class="small" style="font-weight:600;margin-bottom:8px">Change my address every <span class="tag">Proposed values</span></div><div class="seg">'+sel(1,'Day')+sel(3,'3 days')+sel(7,'Week')+'</div></div>'+
  '<p class="xs muted">Counted from the last change, so saving again can’t keep pushing it back. Choosing a shorter time can only bring the next change forward. Default and limits are not decided. Shorter means a little more battery and network use, not measured yet.</p></section>';
 h+='<section class="card" aria-labelledby="h-st"><h2 id="h-st" tabindex="-1">Status on this phone</h2>'+
  '<div class="kv"><span>Last change</span><b>'+fmt(S.last)+'</b></div>'+

 if(d.type==='qr'){

function trow(n,ok,t){return '<div class="row" style="border-bottom:1px solid var(--ln)"><div class="grow">'+esc(n)+'<div class="xs muted">'+t+'</div></div><span class="pill '+(ok?'ok':'wn')+'">'+(ok?'Told':'Waiting')+'</span></div>'}
function li(i,t){return '<div class="li">'+ic(i)+'<span>'+t+'</span></div>'}

/* ---------- render ---------- */
function render(){
 var fk=activeKey();
 ['address','people','lost'].forEach(function(t){var b=document.getElementById('tab-'+t);b.setAttribute('aria-selected',S.tab===t);b.tabIndex=S.tab===t?0:-1});
 document.getElementById('panel').setAttribute('aria-labelledby','tab-'+S.tab);
 document.getElementById('panel').innerHTML=S.tab==='address'?viewAddress():(S.tab==='people'?viewPeople():viewLost());
 document.getElementById('sim').innerHTML=viewSim();
 document.getElementById('dlgbody').innerHTML=dialogHTML();
 var th=document.getElementById('theme');th.setAttribute('aria-pressed',isDark());
 restore(fk);
 if(fk&&!document.getElementById('dlg').open){var a=document.activeElement;if(!a||a===document.body)fallbackFocus()}
}
function fallbackFocus(){var h=document.querySelector(S.tab==='address'?'#h-st':'#h-dt,#panel h2');if(h)h.focus()}
function keyOf(el){return el&&el.dataset&&el.dataset.act?el.dataset.act+'|'+(el.dataset.id||'')+'|'+(el.dataset.v||''):null}
function activeKey(){return keyOf(document.activeElement)}
function restore(k){
 if(!k)return;
 var els=document.querySelectorAll('[data-act]');
 for(var i=0;i<els.length;i++){if(keyOf(els[i])===k){var open=document.getElementById('dlg').open;if(open&&!document.getElementById('dlg').contains(els[i])){continue}els[i].focus();return}}
}
function openDlg(d,opener){
 S.dlg=d;S.opener=opener;render();
 var dl=document.getElementById('dlg');if(!dl.open)dl.showModal();
 var f=dl.querySelector('h2');
 var first=dl.querySelector('.btn.tx,.btn');
 if(f){f.tabIndex=-1;f.focus()}else if(first)first.focus();
}
function closeDlg(){var dl=document.getElementById('dlg');if(dl.open)dl.close()}
document.getElementById('dlg').addEventListener('close',function(){
 var k=S.opener;S.dlg=null;render();
 if(k){restore(k)}
 var a=document.activeElement;
 if(!a||a===document.body){var h=document.querySelector('#h-dt,#panel h2');if(h)h.focus()}
});
document.getElementById('dlg').addEventListener('click',function(e){if(e.target===this)closeDlg()});

/* ---------- actions ---------- */
var A={
 tab:function(e){S.tab=e.v;render();var t=document.getElementById('tab-'+S.tab);t.focus()},
 interval:function(e){setInterval_(+e.v);say('Every '+(S.interval===1?'day':S.interval===7?'week':S.interval+' days')+'. '+(S.failed?'The pending change is still being retried.':overdue()?'The overdue change still happens once when the phone wakes.':'Next change '+fmt(S.next)+'.'));render()},
 scenario:function(e){
  var v=e.v,k=S;init();S.people=k.people;S.tab=k.tab;S.sel=k.sel;S.sam=k.sam;S.sharedSam=k.sharedSam;S.hostOnline=k.hostOnline;S.laptopOffline=k.laptopOffline;S.syncNote=k.syncNote;S.scenario=v;
  if(v==='asleep'){S.now=S.next+Math.round(2.5*DAY)}
  if(v==='failed'){S.now=S.next;S.retryFails=2;attempt()}
  if(v==='offline'){S.pendingOthers=2}
  say({normal:'Back to normal: on schedule.',asleep:'Simulated: the phone slept past its change time.',failed:'Simulated: the address change failed.',offline:'Simulated: 2 contacts are offline.'}[v]);render();
 },
 advance:function(){
  S.now=Math.max(S.now,S.next);
  var ok=attempt();
  say(ok?'Address changed on '+fmt(S.now)+'. Contacts told: '+counts().told+' of '+counts().total+'.':'Simulated: the change failed and will be retried.');render();
 },
 wake:function(){var ok=attempt();say(ok?'One change done now. Next one '+fmt(S.next)+'.':'Still couldn’t change the address. Will retry.');render()},
 retry:function(){var ok=attempt();say(ok?'Address changed. Contacts are being told.':'Still couldn’t finish. Your current address is still in use for now. Trying again later.');render()},
 online:function(){S.pendingOthers=0;say('Offline contacts got the new address.');render()},
 laptop:function(){S.laptopOffline=!S.laptopOffline;if(!S.laptopOffline)S.syncNote={};say(S.laptopOffline?'Simulated: laptop is offline.':'Simulated: laptop is online.');render()},
 shared:function(){S.sharedSam=!S.sharedSam;S.hostOnline=true;if(S.sam==='recovered')S.sam='lost';say(S.sharedSam?'You and Sam now share Weekend hike.':'You and Sam share no group.');render()},
 reset:function(){init();say('Everything is back to the start.');render()},
 select:function(e){S.sel=e.id;render();var h=document.getElementById('h-dt');if(h&&window.matchMedia('(max-width:999px)').matches){h.focus()}},
 call:function(e){
  var p=person(e.id);p.call=!p.call;
  say(p.call?'Calls on for '+p.name+'. They’re sent a call permission (simulated).':'Calls off for '+p.name+' at once on this phone.'+(S.laptopOffline?' Your laptop applies it when it’s back online.':' All your devices follow.'));render();
 },
 'block-open':function(e,el){openDlg({type:'block',id:e.id},keyOf(el))},
 'block-do':function(e){
  var p=person(e.id);p.status='blocked';p.block={at:S.now,retired:false};
  if(S.laptopOffline)S.syncNote[p.id]=true;
  closeDlgThen(function(){say('Blocked '+p.name+'. They’re told. Your address stays as it is until its next scheduled change.'+(S.laptopOffline?' Your laptop applies the block when it’s online.':''))});
 },
 'unblock-open':function(e,el){openDlg({type:'unblock',id:e.id},keyOf(el))},
 'unblock-do':function(e){var p=person(e.id);p.status='reconnect';p.block=null;delete S.syncNote[p.id];closeDlgThen(function(){say('Unblocked '+p.name+'. They’re told. Reconnect by QR to chat again.')})},
 'qr-open':function(e,el){openDlg({type:'qr',id:e.id,mode:e.v},keyOf(el))},
 reconnect:function(e){
  var p=person(e.id);
  if(p.id==='sam'){S.sam='recovered'}else{p.status='active';p.call=true}
  closeDlgThen(function(){say('Simulated: reconnected with '+p.name+'. History is kept.')});
 },
 'told-open':function(e,el){openDlg({type:'told'},keyOf(el))},
 close:function(){closeDlg()},
 'host-pass':function(){S.sam='recovered';say('Simulated: the host passed Sam’s address on. Your message is on its way.');render()},
 'host-off':function(){S.hostOnline=false;say('Simulated: the group host is offline.');render()},
 'host-on':function(){S.hostOnline=true;say('Simulated: the host is back. Looking for Sam through it.');render()}
};
function closeDlgThen(fn){
 var dl=document.getElementById('dlg');
 S.opener=null;
 if(dl.open)dl.close();
 fn();
}
document.addEventListener('click',function(ev){
 var el=ev.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;
 var f=A[el.dataset.act];if(f)f({id:el.dataset.id,v:el.dataset.v},el);
});
document.addEventListener('change',function(ev){
 var el=ev.target;if(el.tagName!=='INPUT'||!el.dataset.act)return;
 A[el.dataset.act]({id:el.dataset.id,v:el.dataset.v},el);
});
document.getElementById('tabs').addEventListener('keydown',function(ev){
 var order=['address','people','lost'],i=order.indexOf(S.tab);
 if(ev.key==='ArrowRight')i=(i+1)%3;else if(ev.key==='ArrowLeft')i=(i+2)%3;else if(ev.key==='Home')i=0;else if(ev.key==='End')i=2;else return;
 ev.preventDefault();S.tab=order[i];render();document.getElementById('tab-'+S.tab).focus();
});

/* ---------- theme ---------- */
function isDark(){
 var t=document.documentElement.getAttribute('data-theme');
 if(t)return t==='dark';
 return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
(function(){try{var t=localStorage.getItem('tinline-design-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}})();
document.getElementById('theme').addEventListener('click',function(){
 var n=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);
 try{localStorage.setItem('tinline-design-theme',n)}catch(e){}
 this.setAttribute('aria-pressed',isDark());
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){document.getElementById('theme').setAttribute('aria-pressed',isDark())});
if(window.matchMedia('(max-width:999px)').matches)document.getElementById('simd').removeAttribute('open');
render();
})();
</script>
</body>
</html>
