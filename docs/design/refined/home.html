const convUrl=(id,extra='')=>(EMBED[id]==='group'?'groups.html?group=':'chat.html?chat=')+encodeURIComponent(id)+extra;
const TABS=[['chats','Chats','chat'],['groups','Groups','groups'],['calls','Calls','phone'],['contacts','Contacts','contacts']];
const PEOPLE=[{id:'arjun',name:'Arjun Oommen',ini:'AO',preview:'I have the landlord’s numbers now',time:'12:41',unread:2,status:'Available for calls'},{id:'hike',name:'Weekend hike',preview:'Priya: Can someone give me a lift?',time:'12:38',unread:3,group:true,status:'8 members'},{id:'dev',name:'Dev Patel',ini:'DP',preview:'Lunch Thursday?',time:'11:05',unread:0,draft:true,status:'Available for calls'},{id:'sana',name:'Sana Rao',ini:'SR',preview:'Sent the draft to your laptop too',time:'08:20',unread:0,status:'Last seen earlier today'},{id:'family',name:'Family',preview:'Amma: Lunch is at 1 on Sunday',time:'Yesterday',unread:4,muted:true,group:true,status:'6 members'},{id:'meera',name:'Meera Nair',ini:'MN',preview:'Running 10 minutes late, sorry',time:'Yesterday',unread:0,queued:true,status:'Offline'}];
const CALLS=[{...PEOPLE[0],preview:'Missed voice call',time:'12:30',missed:true},{...PEOPLE[3],preview:'Outgoing · 8 min',time:'Yesterday'},{...PEOPLE[2],preview:'Incoming · 3 min',time:'Yesterday'}];
const qs=new URLSearchParams(location.search),pre=qs.get('chat')||qs.get('group');
const S={tab:'chats',filter:'All',query:'',selected:PEOPLE.some(p=>p.id===pre)?pre:null,offline:false,empty:false,pausedUntil:0,paused:false,loading:false,failed:false,theme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light',reduce:matchMedia('(prefers-reduced-motion:reduce)').matches};
let trigger=null,toastTimer,loadTimer,loadVersion=0,launchTimer,launchExit,launchFocus=null,pausedTimer;
$$('.t-avatar.me').forEach(e=>e.classList.add(hue('Maya Krishnan')));
function say(text){$('#live').textContent=text;$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
function nav(){const unread=S.empty?0:PEOPLE.filter(p=>!p.muted).reduce((a,p)=>a+p.unread,0);for(const target of ['#desktop-nav','#mobile-nav'])$(target).innerHTML=TABS.map(([id,label,ic])=>{const badge=id==='chats'&&unread?`<span class="t-badge" aria-hidden="true">${unread}</span>`:'';return `<button data-tab="${id}" ${S.tab===id?'aria-current="page"':''}>${target==='#mobile-nav'?'<span class="icon">'+icon(ic)+badge+'</span>':icon(ic)}<span>${label}</span>${target==='#desktop-nav'?badge:''}${badge?`<span class="sr">, ${unread} unread</span>`:''}</button>`}).join('')}
function status(){const st=S.offline?'offline':S.paused?'paused':'available';$$('.presence').forEach(e=>e.dataset.state=st);$$('[data-presence]').forEach(e=>e.textContent=S.offline?'Offline':S.paused?'Calls paused':'Available');const b=$('#status-banner');b.hidden=!S.offline&&!S.paused;b.innerHTML=S.offline?`<div class="banner">${icon('wifi')}<div><p><strong>You’re offline</strong> · Messages wait on this device.</p><button data-action="connection">Details</button></div></div>`:S.paused?`<div class="banner">${icon('phone')}<div><p><strong>Calls are paused</strong> · ${S.pausedUntil?'Until '+new Date(S.pausedUntil).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Until you turn them back on'}. Messages still arrive.</p><button data-action="resume">Resume calls</button></div></div>`:''}
function avatar(p){return p.group?`<span class="t-avatar grp" aria-hidden="true">${icon('groups')}</span>`:`<span class="t-avatar ${hue(p.name)}" aria-hidden="true">${esc(p.ini)}</span>`}
function visibleRows(){let rows=S.empty?[]:S.tab==='calls'?CALLS:S.tab==='groups'?PEOPLE.filter(p=>p.group):S.tab==='contacts'?PEOPLE.filter(p=>!p.group):PEOPLE;return rows.filter(p=>(S.filter!=='Unread'||p.unread)&&(S.filter!=='Groups'||p.group)&&(S.filter!=='Missed'||p.missed)&&p.name.toLowerCase().includes(S.query.toLowerCase()))}
function emptyState(ic,title,text,action,label){return `<div class="empty">${icon(ic)}<h2>${title}</h2><p>${text}</p>${action?`<button class="btn secondary" data-action="${action}">${label}</button>`:''}</div>`}
function rowLabel(p){return p.name+(S.tab==='calls'?', '+p.preview+', '+p.time:S.tab==='contacts'?'':(p.muted?', muted':'')+(p.unread?', '+p.unread+' unread':'')+(p.draft?', draft':p.queued?', waiting to send':''))}
function renderList(animate=false){const l=$('#list');l.setAttribute('aria-busy',String(S.loading));l.classList.toggle('enter',animate&&!S.reduce);if(S.loading){l.innerHTML=`<span class="sr">Loading ${S.tab}</span>`+Array.from({length:5},()=>'<div class="loading" aria-hidden="true"><span class="bone av"></span><div class="bone-lines"><div class="bone line"></div><div class="bone line short"></div></div></div>').join('');return}if(S.failed){l.innerHTML=emptyState('wifi','Couldn’t load '+S.tab,'Nothing was removed from this device.','retry-load','Try again');return}const rows=visibleRows();if(!rows.length){l.innerHTML=S.query?emptyState('search-icon','No matches','Nothing matches “'+esc(S.query)+'”.','clear','Clear search'):S.empty?emptyState('contacts','Your line is ready','Add someone with their ticket or QR.','add','Add a contact'):S.filter==='Unread'?emptyState('chat','All caught up','New messages appear here.','all','Show all'):S.filter==='Missed'?emptyState('phone','No missed calls','Missed calls appear here.','all','Show all'):emptyState('chat','Nothing here yet','New activity appears here.');return}
const sel=!isMobile()&&S.tab!=='calls';let prefix=S.tab==='groups'?`<button class="row" data-action="invite"><span class="t-avatar grp" aria-hidden="true">${icon('plus')}</span><span class="copy"><span class="name">Invitation to Trail runners</span><span class="subline"><span class="preview">From Sam · 6 members</span></span></span>${icon('arrow')}</button><div class="section-label">Your groups</div>`:'';
l.innerHTML=prefix+rows.map((p,i)=>{const on=sel&&p.id===S.selected,fresh=p.unread&&!p.muted&&S.tab==='chats'||p.unread&&!p.muted&&S.tab==='groups';const lead=S.tab==='contacts'?esc(p.status):S.tab==='calls'?`<span class="${p.missed?'missed':''}">${esc(p.preview)}</span>`:(p.draft?'<span class="draft">Draft:</span> ':p.queued?`<span class="waiting">${icon('clock','mini')}Waiting ·</span> `:'')+esc(p.preview);const badge=p.unread&&S.tab!=='calls'&&S.tab!=='contacts'?`<span class="t-badge${p.muted?' muted':''}" aria-hidden="true">${p.unread}</span>`:'';const when=S.tab==='contacts'?'':`<span class="when">${p.muted&&S.tab!=='calls'?icon('bell-off','mute'):''}<span class="time${fresh?' fresh':''}">${p.time}</span></span>`;return `<button class="row${on?' selected':''}" data-person="${p.id}" style="--order:${i}"${on?' aria-current="true"':''} aria-label="${esc(rowLabel(p))}">${avatar(p)}<span class="copy"><span class="name-line"><span class="name">${esc(p.name)}</span>${when}</span><span class="subline"><span class="preview">${lead}</span>${badge}</span></span></button>`}).join('')}
function syncFrame(){try{const d=$('#convo').contentDocument?.documentElement,r=document.documentElement;if(!d)return;if(r.dataset.theme)d.dataset.theme=r.dataset.theme;if(r.dataset.motion)d.dataset.motion=r.dataset.motion}catch{}}
function detail(){const f=$('#convo'),p=S.empty?null:PEOPLE.find(p=>p.id===S.selected),kind=p&&EMBED[p.id];if(!kind||isMobile()){f.hidden=true;if(f.dataset.id){f.dataset.id='';f.src='about:blank'}$('#detail-empty').hidden=false;$('#detail-title').textContent=p?p.name:S.tab==='groups'?'Choose a group':S.tab==='contacts'?'Choose a contact':'Choose a chat';$('#detail-copy').textContent=p?'Nothing to show yet.':'Messages stay on your devices.';return}
$('#detail-empty').hidden=true;f.hidden=false;f.title=(p.group?'Group conversation: ':'Conversation with ')+p.name;if(f.dataset.id!==p.id){f.dataset.id=p.id;f.classList.add('loading');f.src=convUrl(p.id,'&embed=1')}}
$('#convo').addEventListener('load',e=>{e.target.classList.remove('loading');syncFrame()});
function render(animate=false){nav();status();const title=TABS.find(t=>t[0]===S.tab)[1];$('#page-title').textContent=title;$('#search').placeholder='Search '+S.tab;$('label[for=search]').textContent='Search '+S.tab;$('#new').setAttribute('aria-label',S.tab==='calls'?'New call':S.tab==='groups'?'New group':S.tab==='contacts'?'Add contact':'New conversation');const fs=S.tab==='chats'?['All','Unread','Groups']:S.tab==='calls'?['All','Missed']:[];$('#filters').hidden=!fs.length;$('#filters').innerHTML=fs.map(f=>`<button class="t-chip" data-filter="${f}" aria-pressed="${S.filter===f}">${f}</button>`).join('');$('#clear-search').hidden=!S.query;renderList(animate);detail()}
function switchTab(tab){clearTimeout(loadTimer);loadVersion++;S.loading=false;S.failed=false;S.tab=tab;S.filter='All';S.query='';$('#search').value='';render(true);$(`${isMobile()?'#mobile-nav':'#desktop-nav'} [data-tab="${tab}"]`)?.focus({preventScroll:true});$('#list').scrollTop=0;history.replaceState(null,'',location.search+'#'+tab)}
function open(title,html){if(!$('#dialog').open)trigger=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;$('#dialog').showModal()}
function close(){if(!$('#dialog').open)return;$('#dialog').close();if(trigger?.isConnected)trigger.focus({preventScroll:true})}
$('#close-dialog').onclick=close;$('#dialog').addEventListener('cancel',e=>{e.preventDefault();close()});$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientY<r.top||e.clientY>r.bottom||e.clientX<r.left||e.clientX>r.right)close()}});
const link=(href,ic,label,cls='')=>`<a class="setting-link ${cls}" href="${href}">${icon(ic)}<span>${label}</span>${icon('arrow')}</a>`;
function settings(){open('Your account',`<div class="who"><span class="t-avatar ${hue('Maya Krishnan')}">MK</span><div><strong>Maya Krishnan</strong><br><span class="small muted">This phone</span></div></div><div class="list-group">${link('devices.html','device','Accounts & linked devices')}${link('privacy.html','shield','Privacy & address changes')}${link('calls.html','phone','Sounds & calls')}<button class="setting-link" role="switch" aria-checked="${S.theme==='dark'}" data-action="theme"><span>Dark theme</span><i class="switch" aria-hidden="true"></i></button><button class="setting-link" role="switch" aria-checked="${S.reduce}" data-action="motion"><span>Reduce motion</span><i class="switch" aria-hidden="true"></i></button><button class="setting-link quiet" data-action="preview">${icon('sliders')}<span>Preview states</span>${icon('arrow')}</button>${link('review.html','grid','All design studies','quiet')}</div>`)}
function availability(){open('Your availability',`<p>Pause incoming calls. Messages keep arriving.</p><form id="availability-form"><label class="option"><input type="radio" name="availability" value="on" ${!S.paused?'checked':''}>Available for calls</label><label class="option"><input type="radio" name="availability" value="hour">Pause for 1 hour</label><label class="option"><input type="radio" name="availability" value="manual" ${S.paused?'checked':''}>Pause until I turn it back on</label>${S.offline?'<p class="small muted">You’re offline, so calls can’t reach you either way.</p>':''}<div class="dialog-actions"><button type="button" class="btn secondary" data-action="close">Cancel</button><button class="btn" type="submit">Save</button></div></form>`)}
function preview(){open('Preview states',`<label class="option"><input id="offline" type="checkbox" ${S.offline?'checked':''}>Offline</label><label class="option"><input id="empty" type="checkbox" ${S.empty?'checked':''}>No contacts yet</label><div class="preview-actions"><button class="btn secondary" data-action="load">Slow load</button><button class="btn secondary" data-action="load-error">Load failure</button><button class="btn secondary" data-action="opening">Replay opening</button></div>`)}
function add(){open('Add a contact',`<p>Ask them for their Tinline ticket. There’s no public directory.</p><form id="add-form"><label class="field">Contact ticket<input id="ticket" autocomplete="off" spellcheck="false" placeholder="TINLINE-ARJUN" aria-describedby="ticket-error"></label><div id="ticket-error" class="error" role="alert"></div><div class="dialog-actions"><button type="button" class="btn secondary" data-action="close">Cancel</button><button class="btn" type="submit">Check ticket</button></div></form>`)}
function callSheet(p){open(p.name,`<div class="who">${avatar(p)}<div><strong>${esc(p.name)}</strong><br><span class="small ${p.missed?'missed':'muted'}">${esc(p.preview)} · ${p.time}</span></div></div><div class="dialog-actions"><button class="btn secondary" data-action="message" data-id="${p.id}">${icon('chat')}Message</button><a class="btn" href="calls.html">${icon('phone')}Call</a></div>`)}
function showConversation(id){if(isMobile()){location.href=convUrl(id,'&from=home');return}S.selected=id;const p=PEOPLE.find(p=>p.id===id);if(p)p.unread=0;nav();renderList();$(`#list [data-person="${id}"]`)?.focus({preventScroll:true});detail()}
function selectPerson(id){const p=(S.tab==='calls'?CALLS:PEOPLE).find(p=>p.id===id);if(!p)return;if(S.tab==='calls')callSheet(p);else showConversation(id)}
function load(fail=false){close();clearTimeout(toastTimer);$('#toast').hidden=true;clearTimeout(loadTimer);const v=++loadVersion;S.loading=true;S.failed=false;renderList();$('#live').textContent='Loading '+S.tab;$('#page-title').tabIndex=-1;$('#page-title').focus({preventScroll:true});loadTimer=setTimeout(()=>{if(v!==loadVersion)return;S.loading=false;S.failed=fail;renderList(!fail);say(fail?'Couldn’t load '+S.tab+'.':'Your '+S.tab+' are ready.')},fail?1600:950)}
function endLaunch(){clearTimeout(launchTimer);clearTimeout(launchExit);$('#app').inert=false;$('#mobile-nav').inert=false;const hadFocus=$('#launch').contains(document.activeElement);$('#launch').classList.add('leaving');launchExit=setTimeout(()=>{$('#launch').hidden=true;$('#launch').classList.remove('leaving')},S.reduce?0:160);if(hadFocus&&launchFocus?.isConnected)launchFocus.focus({preventScroll:true})}
function startLaunch(replay=false){if(S.reduce||matchMedia('(prefers-reduced-motion:reduce)').matches){if(replay)say('Opening skipped: reduce motion is on.');return}if(!replay){try{if(sessionStorage.getItem('tinline-home-opened'))return;sessionStorage.setItem('tinline-home-opened','1')}catch{}}clearTimeout(launchExit);launchFocus=document.activeElement;$('#launch').hidden=false;$('#app').inert=true;$('#mobile-nav').inert=true;launchTimer=setTimeout(endLaunch,650)}
$('#skip-launch').onclick=endLaunch;$('#launch').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();endLaunch()}});
function handleAction(action,b){switch(action){case 'close':close();break;case 'settings':settings();break;case 'availability':availability();break;case 'resume':S.paused=false;S.pausedUntil=0;clearTimeout(pausedTimer);status();say('Calls resumed.');$('#new').focus();break;case 'connection':open('You’re offline',`<p>Your availability is unchanged. Messages you write wait on this device until you reconnect.</p><div class="dialog-actions"><button class="btn" data-action="go-online">Try again</button></div>`);break;case 'go-online':close();S.offline=false;status();$('#new').focus();say('Back online.');break;case 'preview':preview();break;case 'theme':S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;b.setAttribute('aria-checked',String(S.theme==='dark'));syncFrame();break;case 'motion':S.reduce=!S.reduce;document.documentElement.dataset.motion=S.reduce?'reduce':'full';b.setAttribute('aria-checked',String(S.reduce));syncFrame();break;case 'add':add();break;case 'clear':S.query='';$('#search').value='';$('#clear-search').hidden=true;renderList();$('#search').focus();break;case 'all':S.filter='All';render();$('#filters button')?.focus();break;case 'load':load();break;case 'load-error':load(true);break;case 'retry-load':load();break;case 'opening':close();startLaunch(true);break;case 'message':close();showConversation(b.dataset.id);break;case 'invite':open('Trail runners',`<p>Sam invited you to join 6 people. Group hosts can read what’s shared in the group.</p><div class="dialog-actions"><button class="btn secondary" data-action="close">Not now</button><a class="btn" href="groups.html">Review invitation</a></div>`);break}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab)switchTab(b.dataset.tab);else if(b.dataset.filter){S.filter=b.dataset.filter;render();$(`[data-filter="${S.filter}"]`)?.focus()}else if(b.dataset.person)selectPerson(b.dataset.person);else if(b.dataset.action)handleAction(b.dataset.action,b)});
$('#new').onclick=()=>{if(S.tab==='groups')open('Start a group',`<p>Name it, invite people, then choose a host. Hosts can read what’s shared.</p><div class="dialog-actions"><button class="btn secondary" data-action="close">Cancel</button><a class="btn" href="groups.html">Continue</a></div>`);else if(S.tab==='calls')open('Start a call',`<div class="list-group">${PEOPLE.filter(p=>!p.group).map(p=>`<a class="setting-link" href="calls.html">${avatar(p)}<span>${esc(p.name)}</span>${icon('phone')}</a>`).join('')}</div>`);else add()};
$('#search').addEventListener('input',e=>{S.query=e.target.value;$('#clear-search').hidden=!S.query;renderList();$('#live').textContent=visibleRows().length+' results'});$('#clear-search').onclick=()=>handleAction('clear');
$('#dialog-body').addEventListener('change',e=>{if(e.target.id==='offline'){S.offline=e.target.checked;status()}if(e.target.id==='empty'){S.empty=e.target.checked;render()}});
$('#dialog-body').addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='availability-form'){const value=new FormData(e.target).get('availability');S.paused=value!=='on';S.pausedUntil=value==='hour'?Date.now()+3600000:0;clearTimeout(pausedTimer);if(S.pausedUntil)pausedTimer=setTimeout(()=>{S.paused=false;S.pausedUntil=0;status();say('Your pause has ended. Calls can reach you again.')},3600000);close();status();say(S.paused?'Calls paused. Messages still arrive.':'Available for calls.')}if(e.target.id==='add-form'){const value=$('#ticket').value.trim().toUpperCase();if(value==='EXPIRED'){$('#ticket-error').textContent='This ticket has expired. Ask for a new one.';$('#ticket').setAttribute('aria-invalid','true');$('#ticket').focus()}else if(value!=='TINLINE-ARJUN'){$('#ticket-error').textContent='That ticket isn’t recognised. Check it and try again.';$('#ticket').setAttribute('aria-invalid','true');$('#ticket').focus()}else{$('#dialog-title').textContent='Add Arjun?';$('#dialog-body').innerHTML=`<div class="who"><span class="t-avatar ${hue('Arjun Oommen')}">AO</span><div><strong>Arjun Oommen</strong><br><span class="small muted">Ticket checked</span></div></div><p class="small muted">Ticket contacts can message and call you. You can change this later.</p><div class="dialog-actions"><button class="btn secondary" data-action="add">Back</button><button class="btn" id="confirm-contact">Add contact</button></div>`;$('#confirm-contact').focus();$('#confirm-contact').onclick=()=>{S.empty=false;close();S.tab='contacts';S.query='';S.filter='All';$('#search').value='';render();$('#new').focus();say('Arjun added to contacts.')}}}});
matchMedia(MOBILE).addEventListener('change',()=>{renderList();detail()});
window.addEventListener('pagehide',()=>{clearTimeout(loadTimer);clearTimeout(launchTimer);clearTimeout(launchExit);clearTimeout(toastTimer);$('#launch').hidden=true;$('#app').inert=false;$('#mobile-nav').inert=false});window.addEventListener('pageshow',e=>{if(e.persisted&&S.loading){S.loading=false;S.failed=false;renderList();}if(S.pausedUntil&&Date.now()>=S.pausedUntil){S.paused=false;S.pausedUntil=0;status()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!$('#launch').hidden){endLaunch();$('#launch').hidden=true}if(!document.hidden&&S.pausedUntil&&Date.now()>=S.pausedUntil){S.paused=false;S.pausedUntil=0;status()}});
const hash=location.hash.slice(1);if(TABS.some(t=>t[0]===hash))S.tab=hash;render();startLaunch();
</script><noscript><p>This interactive design needs JavaScript. <a href="../AndroidHome.dc.html">View the original home board</a>.</p></noscript></body></html>
