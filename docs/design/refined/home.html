const CALLS=[{...PEOPLE[0],preview:'Missed voice call',time:'12:30',missed:true},{...PEOPLE[2],preview:'Outgoing · 8 min',time:'Yesterday'},{...PEOPLE[3],preview:'Incoming · 3 min',time:'Yesterday'}];
const S={tab:'chats',filter:'All',query:'',selected:'arjun',offline:false,empty:false,pausedUntil:0,paused:false,loading:false,failed:false,ticketStep:'entry',theme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light',reduce:matchMedia('(prefers-reduced-motion:reduce)').matches};
let trigger=null,toastTimer,loadTimer,loadVersion=0,launchTimer,launchExit,launchFocus=null,pausedTimer;
function say(text){$('#live').textContent=text;$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
function nav(){for(const target of ['#desktop-nav','#mobile-nav'])$(target).innerHTML=TABS.map(([id,label,ic])=>`<button data-tab="${id}" ${S.tab===id?'aria-current="page"':''}>${target==='#mobile-nav'?'<span class="icon">'+icon(ic)+'</span>':icon(ic)}<span>${label}</span>${id==='chats'&&!S.empty?'<span class="count" aria-label="5 unread messages">5</span>':''}</button>`).join('')}
function status(){const text=S.offline?'Offline':S.paused?'Paused':'Available';$$('[data-presence]').forEach(e=>e.textContent=text);const b=$('#status-banner');b.hidden=!S.offline&&!S.paused;b.innerHTML=S.offline?`<div class="banner">${icon('wifi')}<div><p><strong>You’re offline</strong><br>Messages wait on this device. Incoming calls can’t reach you.</p><button data-action="connection">Connection details</button></div></div>`:S.paused?`<div class="banner">${icon('phone')}<div><p><strong>Calls are paused</strong><br>${S.pausedUntil?'Until '+new Date(S.pausedUntil).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Until you turn them back on'}. Messages can still arrive.</p><button data-action="resume">Resume calls</button></div></div>`:''}
function avatar(p){return `<span class="avatar ${p.group?'group':''}">${p.group?icon('groups'):esc(p.ini)}</span>`}
function visibleRows(){let rows=S.empty?[]:S.tab==='calls'?CALLS:S.tab==='groups'?PEOPLE.filter(p=>p.group):S.tab==='contacts'?PEOPLE.filter(p=>!p.group):PEOPLE;return rows.filter(p=>(S.filter!=='Unread'||p.unread)&&(S.filter!=='Groups'||p.group)&&(S.filter!=='Missed'||p.missed)&&p.name.toLowerCase().includes(S.query.toLowerCase()))}
function renderList(animate=false){const l=$('#list');l.setAttribute('aria-busy',String(S.loading));l.classList.toggle('enter',animate&&!S.reduce);if(S.loading){l.innerHTML=`<span class="sr">Loading conversations</span>`+Array.from({length:5},()=>'<div class="loading" aria-hidden="true"><span class="bone av"></span><div class="bone-lines"><div class="bone line"></div><div class="bone line short"></div></div></div>').join('');return}if(S.failed){l.innerHTML=`<div class="empty"><span class="empty-icon">${icon('wifi')}</span><h2>Couldn’t load this list</h2><p>Your saved conversations haven’t been removed. Try again when you’re ready.</p><button class="btn" data-action="retry-load">Try again</button></div>`;return}const rows=visibleRows();if(!rows.length){const title=S.query?'No matches':S.empty?'Your line is ready':S.filter==='Unread'?'All caught up':S.filter==='Missed'?'No missed calls':'Nothing here yet';l.innerHTML=`<div class="empty"><span class="empty-icon">${icon(S.empty?'contacts':'chat')}</span><h2>${title}</h2><p>${S.query?'No results for “'+esc(S.query)+'”. Search only finds people already in your list.':S.empty?'Add someone with their ticket or QR. There’s no public directory.':'When something new arrives, you’ll find it here.'}</p><button class="btn secondary" data-action="${S.query?'clear':S.empty?'add':'all'}">${S.query?'Clear search':S.empty?'Add a contact':'Show all'}</button></div>`;return}
let prefix=S.tab==='groups'?`<button class="row" data-action="invite"><span class="avatar group">${icon('plus')}</span><span class="copy"><span class="name">One invitation waiting</span><span class="preview" style="display:block">Trail runners · invited by Sam</span></span>${icon('arrow')}</button><div class="section-label">Your groups</div>`:S.tab==='calls'?'<div class="section-label">Recent calls</div>':'';
l.innerHTML=prefix+rows.map((p,i)=>`<button class="row ${p.id===S.selected?'selected':''}" data-person="${p.id}" style="--order:${i}" aria-label="${esc(p.name+(S.tab==='calls'?', '+p.preview:S.tab==='contacts'?', '+p.status:', '+(p.unread?p.unread+' unread messages':p.draft?'draft':p.queued?'waiting to send':'open preview')))}">${avatar(p)}<span class="copy"><span class="name-line"><span class="name">${esc(p.name)}</span><span class="time">${S.tab==='contacts'?'':p.time}</span></span><span class="subline"><span class="preview">${S.tab==='contacts'?esc(p.status):S.tab==='calls'?`<span class="${p.missed?'missed':''}">${esc(p.preview)}</span>`:(p.draft?'<strong>Draft: </strong>':p.queued?'<strong>Waiting · </strong>':'')+esc(p.preview)}</span>${p.unread&&S.tab!=='calls'&&S.tab!=='contacts'?'<span class="count">'+p.unread+'</span>':''}</span></span></button>`).join('')}
function detail(){const p=PEOPLE.find(p=>p.id===S.selected);const d=$('#detail');if(S.empty||!p||S.tab==='contacts'||S.tab==='calls'){d.innerHTML=`<div class="detail-body welcome-detail"><svg class="large-mark"><use href="#mark"/></svg><h2>Your people. Your line.</h2><p>${S.tab==='calls'?'Call history, with a clear distinction between missed and answered calls. Choose an entry to explore the call preview.':S.tab==='contacts'?'No usernames to find. No directory to browse. Just the people you’ve chosen to connect with.':'A quiet space for your conversations.'}</p><a class="btn secondary" href="${S.tab==='calls'?'calls.html':'chat.html'}">${S.tab==='calls'?'Open call preview':'Explore a conversation'}</a><p class="small">Separate interactive study · simulated data</p></div>`;return}
d.innerHTML=`<div class="detail-top">${avatar(p)}<div class="copy"><h2>${esc(p.name)}</h2><p>${esc(p.status)}</p></div><button class="ib" data-action="${p.group?'group-info':'person-info'}" aria-label="${p.group?'Group':'Contact'} details">${icon(p.group?'groups':'contacts')}</button></div><div class="detail-body"><p class="date">Today</p><div class="bubble">${p.group?'Saturday, 7 at the trailhead. Bring rain jackets.':'Are we still on for this evening?'}<small>12:32</small></div><div class="bubble out">${p.group?'I’ll bring the map.':'Of course. See you there.'}<small>12:35 · Delivered</small></div><div class="bubble">${esc(p.preview)}<small>${p.time}</small></div></div><div class="detail-footer"><a class="btn" href="${p.group?'groups.html?group='+encodeURIComponent(p.id):'chat.html?chat='+encodeURIComponent(p.id)+'&amp;from=home'}">${icon(p.group?'groups':'chat')}Open ${p.group?'group study':'conversation'}</a><p>${p.group?'Opens the interactive groups study.':'Continue with '+esc(p.name)+' in the interactive conversation. Simulated messages only.'}</p><a class="btn secondary" href="mobile.html?screen=${p.group?'groups':'chat'}&amp;${p.group?'group':'chat'}=${encodeURIComponent(p.id)}">Mobile preview ↗</a></div>`}
function render(animate=false){nav();status();const title=TABS.find(t=>t[0]===S.tab)[1];$('#page-title').textContent=title;$('#search').placeholder='Search '+S.tab;$('label[for=search]').textContent='Search '+S.tab;$('#new').setAttribute('aria-label',S.tab==='calls'?'New call':S.tab==='groups'?'New group':S.tab==='contacts'?'Add contact':'New conversation');const fs=S.tab==='chats'?['All','Unread','Groups']:S.tab==='calls'?['All','Missed']:[];$('#filters').hidden=!fs.length;$('#filters').innerHTML=fs.map(f=>`<button class="chip" data-filter="${f}" aria-pressed="${S.filter===f}">${f}</button>`).join('');$('#clear-search').hidden=!S.query;renderList(animate);detail()}
function switchTab(tab){clearTimeout(loadTimer);loadVersion++;S.loading=false;S.failed=false;S.tab=tab;S.filter='All';S.query='';$('#search').value='';S.selected=tab==='groups'?'hike':'arjun';render(true);const dest=$(`${matchMedia('(max-width:760px)').matches?'#mobile-nav':'#desktop-nav'} [data-tab="${tab}"]`);dest?.focus({preventScroll:true});$('#list').scrollTop=0;history.replaceState(null,'','#'+tab)}
function open(title,html){if(!$('#dialog').open)trigger=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;$('#dialog').showModal()}
function close(){if(!$('#dialog').open)return;$('#dialog').close();if(trigger?.isConnected)trigger.focus({preventScroll:true})}
$('#close-dialog').onclick=close;$('#dialog').addEventListener('cancel',e=>{e.preventDefault();close()});$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientY<r.top||e.clientY>r.bottom||e.clientX<r.left||e.clientX>r.right)close()}});
function settings(){open('Your account',`<div style="display:flex;align-items:center;gap:12px;margin:8px 0 18px"><span class="avatar me">MK</span><div><strong>Maya Krishnan</strong><br><span class="small muted">This phone · simulated account</span></div></div><a class="setting-link" href="devices.html">${icon('device')}<span>Accounts & linked devices</span>${icon('arrow')}</a><a class="setting-link" href="privacy.html">${icon('shield')}<span>Privacy & address changes</span>${icon('arrow')}</a><a class="setting-link" href="calls.html">${icon('phone')}<span>Sounds & calling preview</span>${icon('arrow')}</a><div class="switchline"><span>Dark theme</span><button role="switch" aria-checked="${S.theme==='dark'}" data-action="theme">${S.theme==='dark'?'On':'Off'}</button></div><div class="switchline"><span>Reduce motion</span><button role="switch" aria-checked="${S.reduce}" data-action="motion">${S.reduce?'On':'Off'}</button></div><a class="setting-link" href="review.html">${icon('chat')}<span>All design studies</span>${icon('arrow')}</a><p class="small">These preferences change this design preview only. No account or system setting is changed.</p>`)}
function availability(){open('Your availability',`<p>Pause incoming calls without muting your conversations. People aren’t told why a call couldn’t reach you.</p><form id="availability-form"><label class="option"><input type="radio" name="availability" value="on" ${!S.paused?'checked':''}>Available for calls</label><label class="option"><input type="radio" name="availability" value="hour">Pause for 1 hour</label><label class="option"><input type="radio" name="availability" value="manual" ${S.paused?'checked':''}>Pause until I turn it back on</label><div class="hintbox">Availability isn’t a sound setting. Your phone’s silent mode and notification permissions still apply.${S.offline?' You’re also offline; being available won’t restore your connection.':''}</div><div class="dialog-actions"><button type="button" class="btn secondary" data-action="close">Cancel</button><button class="btn" type="submit">Save</button></div></form>`)}
function preview(){open('Preview states',`<p>Design controls—not part of the shipped home screen. Try loading, motion and connection edges.</p><label class="option"><input id="offline" type="checkbox" ${S.offline?'checked':''}>Offline</label><label class="option"><input id="empty" type="checkbox" ${S.empty?'checked':''}>No contacts yet</label><div class="link-row"><button class="btn secondary" data-action="load">Slow load</button><button class="btn secondary" data-action="load-error">Load failure</button><button class="btn secondary" data-action="opening">Replay opening</button></div><p class="small">Normal navigation is immediate. Only these loading simulations add a delay. Opening is silent, skippable and shown once per browser session.</p><a class="setting-link" href="review.html"><span>Design studies & screenshot review</span>${icon('arrow')}</a>`)}
function add(){S.ticketStep='entry';open('Add a contact',`<p>Ask someone for their Tinline ticket. There’s no public directory and no contact-book upload.</p><form id="add-form"><label class="field">Contact ticket<input id="ticket" autocomplete="off" spellcheck="false" placeholder="Paste their ticket" aria-describedby="ticket-hint ticket-error"></label><p id="ticket-hint" class="small">Preview only: use <b>TINLINE-ARJUN</b>. Use <b>EXPIRED</b> to try the recovery state. No camera or clipboard is accessed.</p><div id="ticket-error" class="error" role="alert"></div><div class="dialog-actions"><button type="button" class="btn secondary" data-action="close">Cancel</button><button class="btn" type="submit">Check ticket</button></div></form>`)}
function selectPerson(id){S.selected=id;const p=PEOPLE.find(p=>p.id===id);if(!p)return;if(!p.group&&S.tab==='chats'&&matchMedia('(max-width:760px)').matches){location.href='chat.html?chat='+encodeURIComponent(id)+'&from=home';return}renderList();$('#list [data-person="'+id+'"]').focus({preventScroll:true});detail();if(matchMedia('(max-width:760px)').matches||S.tab==='calls'||S.tab==='contacts')open(p.name,`${avatar(p)}<p>${esc(p.status)}</p><div class="hintbox">${p.group?'Group hosts can read what is shared in the group. Private chat with a member requires a separate request.':'Open this person’s conversation to reply, send a message or try an attachment. Messages and call outcomes are simulated.'}</div><div class="dialog-actions"><a class="btn secondary" href="${p.group?'groups.html?group='+encodeURIComponent(p.id):'chat.html?chat='+encodeURIComponent(p.id)+'&amp;from=home'}">${p.group?'Open groups study':'Open conversation'}</a>${!p.group?'<a class="btn" href="calls.html">Call preview</a>':''}</div>`)}
function load(fail=false){close();clearTimeout(toastTimer);$('#toast').hidden=true;clearTimeout(loadTimer);const v=++loadVersion;S.loading=true;S.failed=false;renderList();$('#live').textContent='Loading '+S.tab;$('#page-title').tabIndex=-1;$('#page-title').focus({preventScroll:true});loadTimer=setTimeout(()=>{if(v!==loadVersion)return;S.loading=false;S.failed=fail;renderList(!fail);say(fail?'Couldn’t load this list. Try again.':'Your '+S.tab+' are ready.')},fail?1600:950)}
function endLaunch(){clearTimeout(launchTimer);clearTimeout(launchExit);$('#app').inert=false;$('#mobile-nav').inert=false;const hadFocus=$('#launch').contains(document.activeElement);$('#launch').classList.add('leaving');launchExit=setTimeout(()=>{$('#launch').hidden=true;$('#launch').classList.remove('leaving')},S.reduce?0:160);if(hadFocus&&launchFocus?.isConnected)launchFocus.focus({preventScroll:true})}
function startLaunch(replay=false){if(S.reduce||matchMedia('(prefers-reduced-motion:reduce)').matches){if(replay)say('Opening skipped because reduced motion is enabled.');return}if(!replay){try{if(sessionStorage.getItem('tinline-home-opened'))return;sessionStorage.setItem('tinline-home-opened','1')}catch{}}clearTimeout(launchExit);launchFocus=document.activeElement;$('#launch').hidden=false;$('#app').inert=true;$('#mobile-nav').inert=true;launchTimer=setTimeout(endLaunch,650)}
$('#skip-launch').onclick=endLaunch;$('#launch').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();endLaunch()}});
function handleAction(action){switch(action){case 'close':close();break;case 'settings':settings();break;case 'availability':availability();break;case 'resume':S.paused=false;S.pausedUntil=0;clearTimeout(pausedTimer);status();say('Calls resumed in the preview.');$('#new').focus();break;case 'connection':open('Offline, not unavailable',`<p>Your availability preference is unchanged. Calls need a connection; messages you write can wait on this device.</p><div class="hintbox">This is a simulated connection state. No system setting is changed.</div><div class="dialog-actions"><button class="btn" data-action="go-online">Simulate reconnecting</button></div>`);break;case 'go-online':close();S.offline=false;status();$('#new').focus();say('Back online in the preview.');break;case 'preview':preview();break;case 'theme':S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;{const b=$('[data-action=theme]');b.setAttribute('aria-checked',String(S.theme==='dark'));b.textContent=S.theme==='dark'?'On':'Off'}break;case 'motion':S.reduce=!S.reduce;document.documentElement.dataset.motion=S.reduce?'reduce':'full';{const b=$('[data-action=motion]');b.setAttribute('aria-checked',String(S.reduce));b.textContent=S.reduce?'On':'Off'}break;case 'add':add();break;case 'clear':S.query='';$('#search').value='';$('#clear-search').hidden=true;renderList();$('#search').focus();break;case 'all':S.filter='All';render();$('#filters button')?.focus();break;case 'load':load();break;case 'load-error':load(true);break;case 'retry-load':load();break;case 'opening':close();startLaunch(true);break;case 'invite':open('Invitation to Trail runners',`<p>Sam invited you to join 6 people in Trail runners.</p><div class="hintbox">Members see your name and shared messages. Hosts can read the group’s content. Joining doesn’t grant anyone permission to call or start a private chat.</div><div class="dialog-actions"><button class="btn secondary" data-action="close">Not now</button><a class="btn" href="groups.html">Review in groups study</a></div>`);break;case 'person-info':case 'group-info':{const p=PEOPLE.find(p=>p.id===S.selected);open(p.name,`<p>${esc(p.status)}</p><div class="hintbox">${p.group?'Group hosts can read shared content. Members don’t receive each other’s network addresses.':'Message and call permissions are separate. Blocking is visible and keeps your chat history.'}</div><div class="dialog-actions"><a class="btn" href="${p.group?'groups.html':'privacy.html'}">${p.group?'Group details study':'Privacy & permissions study'}</a></div>`)}break}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab)switchTab(b.dataset.tab);else if(b.dataset.filter){S.filter=b.dataset.filter;render();$(`[data-filter="${S.filter}"]`)?.focus()}else if(b.dataset.person)selectPerson(b.dataset.person);else if(b.dataset.action)handleAction(b.dataset.action)});
$('#new').onclick=()=>{if(S.tab==='groups')open('Start a group',`<p>Choose a name, invite people, then arrange hosting. A group needs a reachable host to deliver messages.</p><div class="hintbox">Group hosts can read the content. Hosting works best on a device that stays on.</div><div class="dialog-actions"><button class="btn secondary" data-action="close">Cancel</button><a class="btn" href="groups.html">Create in groups study</a></div>`);else if(S.tab==='calls')open('Start a call',`<p>The call study lets you try outgoing calls, incoming ringing, permissions and failures. It never places a real call.</p><a class="btn" href="calls.html">Open call preview</a>`);else add()};
$('#search').addEventListener('input',e=>{S.query=e.target.value;$('#clear-search').hidden=!S.query;renderList();$('#live').textContent=visibleRows().length+' results'});$('#clear-search').onclick=()=>handleAction('clear');
$('#dialog-body').addEventListener('change',e=>{if(e.target.id==='offline'){S.offline=e.target.checked;status()}if(e.target.id==='empty'){S.empty=e.target.checked;render()}});
$('#dialog-body').addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='availability-form'){const value=new FormData(e.target).get('availability');S.paused=value!=='on';S.pausedUntil=value==='hour'?Date.now()+3600000:0;clearTimeout(pausedTimer);if(S.pausedUntil)pausedTimer=setTimeout(()=>{S.paused=false;S.pausedUntil=0;status();say('Your pause has ended. Calls are available again.')},3600000);close();status();say(S.paused?'Calls paused in this preview. Messages stay on.':'Available for calls in this preview.')}if(e.target.id==='add-form'){const value=$('#ticket').value.trim().toUpperCase();if(value==='EXPIRED'){$('#ticket-error').textContent='This ticket has expired. Ask for a new one, then replace it here.';$('#ticket').setAttribute('aria-invalid','true');$('#ticket').focus()}else if(value!=='TINLINE-ARJUN'){$('#ticket-error').textContent='That ticket isn’t recognised. For this preview, enter TINLINE-ARJUN.';$('#ticket').setAttribute('aria-invalid','true');$('#ticket').focus()}else{$('#dialog-title').textContent='Connect with Arjun?';$('#dialog-body').innerHTML=`<span class="avatar">AO</span><p><strong>Arjun Oommen</strong><br>Simulated ticket checked</p><div class="hintbox">Ticket contacts can message and call you. You can change those permissions later. Confirm the person before adding them.</div><div class="dialog-actions"><button class="btn secondary" data-action="add">Back</button><button class="btn" id="confirm-contact">Add contact</button></div>`;$('#confirm-contact').focus();$('#confirm-contact').onclick=()=>{S.empty=false;close();S.tab='contacts';S.query='';S.filter='All';$('#search').value='';render();$('#new').focus();say('Arjun is in your contacts in this preview. Nothing was sent.')}}}});
window.addEventListener('pagehide',()=>{clearTimeout(loadTimer);clearTimeout(launchTimer);clearTimeout(launchExit);clearTimeout(toastTimer);$('#launch').hidden=true;$('#app').inert=false;$('#mobile-nav').inert=false});window.addEventListener('pageshow',e=>{if(e.persisted&&S.loading){S.loading=false;S.failed=false;renderList();}if(S.pausedUntil&&Date.now()>=S.pausedUntil){S.paused=false;S.pausedUntil=0;status()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!$('#launch').hidden){endLaunch();$('#launch').hidden=true}if(!document.hidden&&S.pausedUntil&&Date.now()>=S.pausedUntil){S.paused=false;S.pausedUntil=0;status()}});
const hash=location.hash.slice(1);if(TABS.some(t=>t[0]===hash))S.tab=hash;if(S.tab==='groups')S.selected='hike';render();startLaunch();
</script><noscript><p>This interactive design needs JavaScript. <a href="../AndroidHome.dc.html">View the original home board</a>.</p></noscript></body></html>
