<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tinline · Mobile chat preview</title><style>
:root{color-scheme:light;--bg:#e8ece7;--sf:#f5f6f3;--ink:#17201d;--muted:#4d5853;--line:#cbd4cd;--pr:#0b6b5b}*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 28px;background:var(--sf);border-bottom:1px solid var(--line);min-height:72px}h1{font-size:17px;margin:0}a{color:var(--pr);text-underline-offset:4px;min-height:44px;display:inline-flex;align-items:center}nav{display:flex;gap:18px;align-items:center}label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}select{font:inherit;color:var(--ink);min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sf)}a:focus-visible,select:focus-visible{outline:3px solid var(--pr);outline-offset:4px}.title{display:flex;align-items:center;gap:22px}.sub{font-size:12px;color:var(--muted)}main{display:flex;justify-content:center;padding:22px 12px 12px}.phone{border:7px solid #283a32;border-radius:32px;overflow:hidden;background:var(--sf);box-shadow:0 2px 5px #17201d15,0 16px 44px #17201d20;max-width:100%}iframe{display:block;border:0;width:390px;max-width:100%;height:min(844px,calc(100dvh - 158px));background:var(--sf)}footer{font-size:12px;color:var(--muted);text-align:center;padding:0 12px 12px}@media(max-width:600px){header{padding:8px 14px;min-height:60px;gap:8px}.title{gap:12px}.sub,label{display:none}h1{font-size:14px}nav{gap:12px;font-size:12px}main{padding:0}.phone{border:0;border-radius:0;width:100%;box-shadow:none}iframe{width:100%!important;height:calc(100dvh - 61px)}footer{display:none}}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#080e0b;--sf:#161d1b;--ink:#e6ece9;--muted:#a6b2ad;--line:#33403b;--pr:#6fd3bd}.phone{border-color:#33443b;box-shadow:0 16px 48px #0008}}
</style></head><body><header><div class="title"><a href="home.html">← Home</a><div><h1 id="preview-title">Mobile chat</h1><span class="sub">Interactive phone viewport · not a screenshot</span></div></div><nav aria-label="Preview controls"><label>Width<select id="width" aria-label="Phone preview width"><option value="390">390 px</option><option value="320">320 px</option></select></label><a id="desktop" href="chat.html?chat=arjun">Desktop layout ↗</a></nav></header><main><div class="phone"><iframe id="phone" title="Interactive mobile chat conversation" src="about:blank"></iframe></div></main><footer>Try replying, attaching a file, or opening the message menu. <span id="dimensions"></span></footer><script>
const params=new URLSearchParams(location.search),screen=params.get('screen')==='groups'?'groups':'chat',key=screen==='groups'?'group':'chat',ids=screen==='groups'?['hike','family','book']:['arjun','meera','dev','sana'];const id=ids.includes(params.get(key))?params.get(key):ids[0];const frame=document.querySelector('#phone');frame.src=screen+'.html?'+key+'='+encodeURIComponent(id)+'&preview=mobile';document.querySelector('#desktop').href=screen+'.html?'+key+'='+encodeURIComponent(id);if(matchMedia('(max-width:600px)').matches)document.querySelector('#desktop').textContent='Full page ↗';document.querySelector('#preview-title').textContent=screen==='groups'?'Mobile group chat':'Mobile chat';document.title='Tinline · '+document.querySelector('#preview-title').textContent;document.querySelector('#width').onchange=e=>{frame.style.width=e.target.value+'px'};new ResizeObserver(()=>{document.querySelector('#dimensions').textContent=frame.clientWidth+' × '+frame.clientHeight+' CSS pixels.'}).observe(frame);
</script></body></html>
