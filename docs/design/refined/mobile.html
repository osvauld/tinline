<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tinline · Mobile chat</title><link rel="stylesheet" href="tokens.css"><style>
*{box-sizing:border-box}body{margin:0;font:var(--fs-sub)/1.5 system-ui,sans-serif;background:var(--bg);color:var(--muted)}a{color:var(--accent-ink);text-decoration:none;text-underline-offset:4px}a:hover{text-decoration:underline}a:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:2px 12px 2px 20px}.crumb{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}.crumb a,.tools a{min-height:44px;display:inline-flex;align-items:center}h1{font:inherit;margin:0;overflow:hidden;text-overflow:ellipsis}.tools{display:flex;align-items:center;gap:6px}select{font:inherit;color:var(--muted);min-height:36px;padding:0 6px;border:0;border-radius:10px;background:transparent;cursor:pointer}select:hover{background:var(--surface-2);color:var(--ink)}.ib{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:inline-grid;place-items:center;cursor:pointer}.ib:hover{background:var(--surface-2);color:var(--ink)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
main{display:flex;justify-content:center;padding:4px 12px 24px}.phone{border:7px solid #283a32;border-radius:32px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow-pop);max-width:100%}iframe{display:block;border:0;width:390px;max-width:100%;height:min(844px,calc(100dvh - 90px));background:var(--surface)}
.moon{display:none}:root[data-theme=dark] .moon{display:block}:root[data-theme=dark] .sun{display:none}:root[data-theme=dark] .phone{border-color:#33443b}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .moon{display:block}:root:not([data-theme=light]) .sun{display:none}:root:not([data-theme=light]) .phone{border-color:#33443b}}
@media(max-width:600px){.bar{padding:0 8px 0 12px}.width{display:none}main{padding:0}.phone{border:0;border-radius:0;width:100%;box-shadow:none}iframe{width:100%!important;height:calc(100dvh - 48px)}}
</style></head><body><header class="bar"><div class="crumb"><a href="home.html">← Home</a><span aria-hidden="true">·</span><h1 id="preview-title">Mobile chat</h1></div><div class="tools"><label class="width"><span class="sr">Phone width</span><select id="width"><option value="390">390 px</option><option value="320">320 px</option></select></label><a id="desktop" href="chat.html?chat=arjun">Desktop layout ↗</a><button class="ib" id="theme" aria-label="Switch to dark theme"><svg class="sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button></div></header><main><div class="phone"><iframe id="phone" title="Mobile conversation" src="about:blank"></iframe></div></main><script>
const params=new URLSearchParams(location.search),screen=['groups','home'].includes(params.get('screen'))?params.get('screen'):'chat',key=screen==='groups'?'group':'chat',ids=screen==='groups'?['hike','family','book']:['arjun','meera','dev','sana'];const id=ids.includes(params.get(key))?params.get(key):ids[0];const frame=document.querySelector('#phone'),root=document.documentElement,themeBtn=document.querySelector('#theme');frame.src=screen==='home'?'home.html':screen+'.html?'+key+'='+encodeURIComponent(id)+'&embed=1';frame.title=screen==='home'?'Mobile home':'Mobile conversation';document.querySelector('#desktop').href=screen==='home'?'home.html':screen+'.html?'+key+'='+encodeURIComponent(id);if(matchMedia('(max-width:600px)').matches)document.querySelector('#desktop').textContent='Full page ↗';document.querySelector('#preview-title').textContent=screen==='home'?'Phone preview · Home':screen==='groups'?'Mobile group chat':'Mobile chat';document.title='Tinline · '+document.querySelector('#preview-title').textContent;document.querySelector('#width').onchange=e=>{frame.style.width=e.target.value+'px'};
const dark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
function sync(){themeBtn.setAttribute('aria-label',dark()?'Switch to light theme':'Switch to dark theme');try{const d=frame.contentDocument?.documentElement;if(d&&root.dataset.theme)d.dataset.theme=root.dataset.theme}catch{}}
themeBtn.onclick=()=>{root.dataset.theme=dark()?'light':'dark';sync()};frame.addEventListener('load',sync);sync();
</script></body></html>
