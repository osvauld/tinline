<html lang="en">
<head>

<title>Tinline · Groups (refined prototype)</title>

  if(/^(light|dark)$/.test(q.get('theme')||''))r.dataset.theme=q.get('theme');if(q.get('motion')==='reduce')r.dataset.motion='reduce'}</script>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs-body)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink);text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{display:inline-flex;flex:none}.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* harness chrome (study page only) */
.page{max-width:1280px;margin:0 auto;padding:0 12px 12px}
.hbar{display:flex;align-items:center;gap:2px;height:48px;font-size:var(--fs-sub);color:var(--muted)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:6px;white-space:nowrap}
.crumb a{display:inline-flex;align-items:center;min-height:36px;font-weight:600}
.plink{color:var(--accent-ink);font-weight:600;border-radius:8px;padding:6px 4px;margin-right:6px}
@media (max-width:859px){.plink{display:none}}
.hb{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:inline-grid;place-items:center;padding:0;flex:none}
.hb .ic svg{width:18px;height:18px}
.hb:hover,.hb[aria-expanded=true]{background:var(--surface-2);color:var(--ink)}
.sim{position:fixed;z-index:30;top:52px;right:max(12px,calc((100vw - 1280px)/2 + 12px));width:min(340px,calc(100vw - 24px));max-height:calc(100dvh - 64px);overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-ctl);box-shadow:var(--shadow-pop);padding:8px 8px 14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.simhead{display:flex;align-items:center}.simhead h2{flex:1;margin:0;font-size:15px}.simhead h2:focus{outline:none}
.simnote{margin:0 8px 4px 0;font-size:13px;color:var(--muted);line-height:1.45}
#simBody{display:flex;flex-direction:column;gap:6px;padding-right:8px}
#simBody .btn{justify-content:flex-start;text-align:left;width:100%}
.sw{display:flex;align-items:center;gap:12px;min-height:44px}.sw input{width:20px;height:20px;accent-color:var(--accent);flex:none}
/* Quiet mode: the same role=switch control as calls.html (label left, track right) */
.qsw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:44px;border:0;background:transparent;padding:0;color:var(--ink);font:inherit;font-size:14px;font-weight:600;text-align:left}
.qsw i{flex:none;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background-color 120ms ease}
.qsw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .2);transition:transform 120ms ease}
.qsw[aria-checked=true] i{background:var(--accent)}.qsw[aria-checked=true] i::after{transform:translateX(16px)}
.embed .hbar,.embed .sim{display:none!important}
.embed .page{padding:0;max-width:none}
.embed .app{height:100dvh;min-height:0;border:0;border-radius:0}
/* buttons */
.btn{min-height:44px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ol{background:transparent;color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.tx{background:transparent;color:var(--accent-ink);padding:0 14px}
.btn.dg{background:var(--danger);color:var(--on-danger)}
.btn.tx.dg,.btn.ol.dg{background:transparent;color:var(--danger)}
.btn.sm{font-size:14px;padding:0 14px}
.btn[disabled]{opacity:.38;cursor:default}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:inline-grid;place-items:center;padding:0;flex:none}
.lnk{min-height:44px;border:0;background:transparent;color:var(--accent-ink);font-weight:600;font-size:14px;padding:0 12px;border-radius:10px;flex:none}
@media (hover:hover){.ib:hover,.btn.tx:hover,.btn.ol:hover,.lnk:hover{background:var(--surface-2)}}
/* app frame */
.app{position:relative;display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;height:calc(100dvh - 60px);min-height:520px}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;grid-row:2}
/* in-page call: ongoing-call strip + overlay (visual simulation; cues from call-audio.js, group roster from call-state.js) */
#callStrip{grid-row:1;grid-column:1/-1} /* the strip is the shared .t-callbar from call-state.js */
.callov{position:absolute;inset:0;z-index:20;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:8px 8px calc(40px + env(safe-area-inset-bottom,0px));animation:pop .16s ease-out}
.callov:focus{outline:none}
.callov .cmin{align-self:flex-start;color:var(--ink)}
.callov .cbody{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:0 16px}
.callov .gav,.callov .t-avatar.big{width:96px;height:96px;margin-bottom:12px}.callov .t-avatar.big{font-size:32px}.callov .gav .ic svg{width:44px;height:44px;stroke-width:1.5}
.callov h2{font-size:24px;font-weight:600;margin:0}
.callov .cst{font-size:var(--fs-sub);color:var(--muted)}
.callov .ctime{font-size:15px;font-variant-numeric:tabular-nums;min-width:5ch;color:var(--ink)}
.cctl{display:flex;align-items:flex-end;gap:40px}
.cctl label{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.cbtn{border:0;border-radius:50%;display:grid;place-items:center;padding:0}
.cbtn.mute{width:56px;height:56px;background:var(--surface-2);color:var(--ink)}
.cbtn.mute[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.cbtn.end{width:64px;height:64px;background:var(--danger-btn);color:var(--on-danger-btn)}
.cbtn.end .ic svg{transform:rotate(135deg)}
.chead #callBtn.live{color:var(--accent-ink)}
.app[data-view=list] .conv,.app[data-view=conv] .list{display:none}
.list{background:var(--surface);position:relative}
.conv{background:var(--canvas);position:relative}
@media (max-width:899px){.app[data-view=conv]{position:fixed;inset:0;z-index:10;width:100%;height:100dvh;min-height:0;border:0;border-radius:0}}
@media (min-width:900px){.app{grid-template-columns:360px 1fr}.app .list,.app .conv{display:flex!important}.list{border-right:1px solid var(--line)}.backbtn{display:none!important}}
.app.solo{grid-template-columns:1fr}.app.solo .list,.app.solo .backbtn{display:none!important}.app.solo .chead{padding-left:12px}
/* list pane */
.lhead{display:flex;align-items:center;gap:8px;padding:12px 14px 4px 20px;min-height:58px}
.lhead h2{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0;flex:1}
#newBtn{position:absolute;z-index:2;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border:0;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;padding:0;box-shadow:var(--shadow-pop)}
@media (min-width:900px){#newBtn{position:static;width:36px;height:36px;background:var(--accent-soft);color:var(--accent-ink);box-shadow:none}#newBtn .ic svg{width:20px;height:20px}}
.search{margin:4px 16px 6px;position:relative}
.search>.ic{position:absolute;left:12px;top:10px;color:var(--muted);pointer-events:none}.search>.ic svg{width:20px;height:20px}
.search input{width:100%;height:40px;border-radius:20px;border:1px solid transparent;background:var(--surface-2);padding:0 40px 0 40px;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search input:focus-visible{outline:none;border-color:var(--accent);background:var(--surface)}
.search .ib{position:absolute;right:0;top:-2px;color:var(--muted)}
.scroll{overflow:auto;flex:1;min-height:0;padding-bottom:96px}
@media (min-width:900px){.scroll{padding-bottom:16px}}
.sec{font-size:var(--fs-meta);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 20px 4px;margin:0}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:8px 16px;border:0;background:transparent;text-align:left;color:var(--ink)}
@media (hover:hover){button.row:hover{background:var(--surface-2)}}
@media (min-width:900px){.row.on{background:var(--surface-2)}}
.tx1{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nm{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{display:block;font-size:var(--fs-sub);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;align-self:flex-start;padding-top:4px;min-height:40px}
.tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row.unread .tm{color:var(--accent-ink);font-weight:600}
.row.gone .nm{color:var(--muted);font-weight:500}
.av{width:44px;height:44px;font-size:15px}.av.lg{width:56px;height:56px;font-size:19px}.av.sm{width:36px;height:36px;font-size:13px}
.gav{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;background:var(--surface-2);color:var(--accent-ink)}
.gav .ic svg{width:21px;height:21px}
.gav.off{color:var(--muted)}
.qrow{min-height:56px}
.qrow .chev{color:var(--muted);transition:transform .12s ease-out}.qrow .chev svg{width:18px;height:18px}
.qrow[aria-expanded=true] .chev{transform:rotate(180deg)}
.qitems .row{min-height:60px;padding-left:24px}
.qitems .av,.qitems .gav{width:36px;height:36px;font-size:13px}.qitems .gav .ic svg{width:18px;height:18px}
.qitems{border-bottom:1px solid var(--hairline)}
.empty{margin:auto;padding:24px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted)}
.empty h3{margin:0;color:var(--ink);font-size:16px;font-weight:600}.empty p{margin:0 0 10px;font-size:14px;max-width:30ch}
.placeholder{flex:1;display:flex}
@media (max-width:899px){.placeholder{display:none}}
/* conversation */
.chead{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 12px;min-height:60px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
@media (max-width:899px){.chead{padding-left:2px}}
.chead .gav,.chead .av{width:36px;height:36px;font-size:13px}.chead .gav .ic svg{width:18px;height:18px}
.chead .ttl{flex:1;min-width:0;margin-left:8px}
.chead h2{font-size:var(--fs-title);font-weight:600;margin:0;line-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chead h2:focus{outline:none}
.chead .st{font-size:var(--fs-sub);color:var(--muted);line-height:18px}
.chead #memBtn,.chead #callBtn{color:var(--muted)}
.chead #callBtn .ic svg{width:20px;height:20px}
.chead #callBtn[aria-disabled=true]{opacity:.38;cursor:default;background:transparent}
.strip{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 4px 0 16px;background:var(--warn-bg);color:var(--warn-ink);font-size:var(--fs-sub);flex:none}
.strip span{flex:1;min-width:0}
.strip button{min-height:40px;border:0;background:transparent;color:inherit;font-weight:700;font-size:var(--fs-sub);padding:0 12px;border-radius:8px}
.strip button:hover{background:rgb(0 0 0 / .06)}
.msgs{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:6px 16px 12px;background:var(--canvas);overscroll-behavior:contain}
@media (min-width:900px){.msgs{padding:8px 28px 16px}}
.msgs>*{flex-shrink:0}
.day{align-self:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--hairline);color:var(--muted);font-size:var(--fs-meta);font-weight:600;line-height:16px;padding:3px 10px;border-radius:999px;margin:10px 0}
.sys{align-self:center;text-align:center;font-size:12px;line-height:17px;color:var(--muted);margin:6px 0;max-width:86%}
.brow{display:flex;align-items:center;gap:6px;margin-top:2px}
.brow.f{margin-top:10px}
:is(.day,.sys)+.brow.f{margin-top:4px}
.brow.out{justify-content:flex-end}
.bub{max-width:min(78%,560px);padding:7px 12px;font-size:var(--fs-body);line-height:var(--lh-body);border-radius:var(--r-bub);overflow-wrap:anywhere;white-space:pre-wrap;display:flow-root;-webkit-touch-callout:none;transition:transform .12s ease-out}
.bub:focus{outline:none}.bub:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bub.in{background:var(--bub-in);color:var(--bub-in-ink);border:1px solid var(--bub-in-line);padding:6px 11px}
.bub.out{background:var(--bub-out);color:var(--bub-out-ink)}
.bub.out.g-first{border-bottom-right-radius:var(--r-bub-tight)}
.bub.out.g-mid{border-top-right-radius:var(--r-bub-tight);border-bottom-right-radius:var(--r-bub-tight)}
.bub.out.g-last{border-top-right-radius:var(--r-bub-tight)}
.bub.in.g-first{border-bottom-left-radius:var(--r-bub-tight)}
.bub.in.g-mid{border-top-left-radius:var(--r-bub-tight);border-bottom-left-radius:var(--r-bub-tight)}
.bub.in.g-last{border-top-left-radius:var(--r-bub-tight)}
.meta{float:right;margin:10px -2px -2px 10px;font-size:var(--fs-meta);line-height:1;font-variant-numeric:tabular-nums;display:inline-flex;gap:3px;align-items:center;user-select:none;white-space:nowrap}
.bub.in .meta{color:var(--bub-meta-in)}.bub.out .meta{color:var(--bub-meta-out)}
.tick{display:inline-grid;place-items:center;width:12px;height:12px}.tick svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tick.pend svg{width:11px;height:11px;stroke-width:2}
.who{display:block;font-size:13px;font-weight:700;line-height:18px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rq{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--accent);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:5px 10px 6px;margin:2px 0 6px;font-size:13px;line-height:18px;white-space:normal}
.rq b{display:block;font-size:12px}.rq span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.late{display:block;font-size:12px;line-height:17px;font-style:italic;color:var(--bub-meta-in);margin-top:2px}
.bub.flash{box-shadow:0 0 0 2px var(--accent)}
.bub.pressed{transform:scale(.97)}
.bub.rise{animation:rise .12s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
/* message menu trigger: visually hidden, focusable; a hover chevron only on fine pointers ≥860px */
.mo{flex:none;width:24px;height:24px;border:0;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--surface);color:var(--muted);box-shadow:0 1px 2px rgb(9 23 17 / .16)}
.mo .ic svg{width:16px;height:16px;stroke-width:2.2}
.mo:not(:focus-visible){position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);box-shadow:none}
@media (hover:hover) and (pointer:fine) and (min-width:860px){
  .mo:not(:focus-visible){position:static;width:24px;height:24px;overflow:visible;clip:auto;box-shadow:0 1px 2px rgb(9 23 17 / .16);opacity:0;transition:opacity .12s ease-out}
  .brow:hover .mo,.brow:focus-within .mo{opacity:1}
  .mo:hover{color:var(--ink)}}
.tobot{position:sticky;bottom:4px;align-self:flex-end;margin-top:-36px;width:36px;height:36px;border:0;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-pop);display:grid;place-items:center;padding:0}
.tobot .ic svg{width:18px;height:18px}
.tobot .t-badge{position:absolute;top:-7px;right:-5px}
/* composer */
.comp{padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--canvas);flex:none}
@media (min-width:900px){.comp{padding:8px 24px 14px}}
.cin{display:flex;gap:6px;align-items:flex-end}
.cin textarea{flex:1;min-width:0;min-height:44px;max-height:140px;resize:none;border-radius:var(--r-field);border:1px solid var(--hairline);background:var(--surface);padding:10px 16px;line-height:22px;font-size:var(--fs-body)}
.cin textarea::placeholder{color:var(--muted)}
.cin textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--press-wash)}
.cin .att{color:var(--muted)}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;padding:0;flex:none}
.send .ic svg{width:20px;height:20px;margin:1px 2px 0 0}
.send:disabled{opacity:.38;cursor:default;box-shadow:none}
.reply{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-left:3px solid var(--accent);border-radius:10px;padding:4px 2px 4px 12px;margin:0 50px 8px;font-size:var(--fs-sub);line-height:18px}
.reply .tt{flex:1;min-width:0}.reply b,.reply .tt span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reply b{color:var(--accent-ink)}.reply .tt span{color:var(--muted)}
.reply .ib{width:40px;height:40px;color:var(--muted)}.reply .ib svg{width:18px;height:18px}
.callnote{display:flex;align-items:center;justify-content:center;gap:2px;font-size:var(--fs-sub);color:var(--muted);background:var(--canvas);padding:4px 12px 0;flex-wrap:wrap}
.closed{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;background:var(--surface);border-top:1px solid var(--line);flex:none;font-size:var(--fs-sub);color:var(--muted);text-align:center}
/* dialogs, sheets, menus */
dialog{border:0;padding:0;border-radius:var(--r-sheet);background:var(--surface);color:var(--ink);width:min(480px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:var(--shadow-sheet);overflow:hidden}
dialog::backdrop{background:rgb(10 16 14 / .5)}

.dlg{min-height:0;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg h2{font-size:19px;font-weight:650;margin:0}.dlg h2:focus{outline:none}
.dlg p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.5}
.dlg .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.dhead{display:flex;align-items:center;gap:4px;margin:-6px -8px 0 0}.dhead h2{flex:1}
.dhead .ib{color:var(--muted)}
@media (max-width:699px){dialog.dsheet{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:var(--r-sheet) var(--r-sheet) 0 0;max-height:90dvh}dialog.dsheet .dlg{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
@media (min-width:900px){dialog.ddrawer{margin:0 0 0 auto;height:100dvh;max-height:none;width:400px;border-radius:var(--r-sheet) 0 0 var(--r-sheet)}}
dialog.dmenu{margin:auto auto 0;width:min(560px,100vw);max-width:100vw;border-radius:var(--r-sheet) var(--r-sheet) 0 0}
dialog.dmenu .dlg{padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));gap:0}
.notch{width:28px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 8px;flex:none}
.mprev{margin:0 20px 6px;padding:0 0 10px;border-bottom:1px solid var(--hairline);font-size:14px;line-height:20px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
dialog.dpop{margin:0;inset:auto;width:212px;border-radius:14px;box-shadow:var(--shadow-pop);border:1px solid var(--hairline)}
dialog.dpop::backdrop{background:transparent}
dialog.dpop .dlg{padding:6px 0;gap:0}
.mi{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;border:0;background:transparent;text-align:left;padding:0 20px;font-size:15px;color:var(--ink)}

function leaveGroup(g){
  const sole=g.hosts.length===1&&g.hosts[0].self;
  confirmDlg({title:'Leave “'+g.name+'”?',text:['You stop receiving messages and the group sees that you left. The chat stays on this phone, read-only.',sole?'Your desktop is the only host. Nobody can host this group until another member does.':'To come back, an admin has to invite you again.'],confirm:'Leave group',danger:true,onYes:()=>{
    g.status='left';g.msgs.push({sys:1,text:'You left the group'});mem?.api.close();renderAll();say('You left '+g.name+'.');}})}
function showRemoval(g){
  dialog('dsheet',api=>{api.set(h('div',{class:'dhead'},h('h2',null,'Why you were removed'),closeBtn(api)),
    h('div',null,g.flaggers.map(f=>h('div',{class:'mrow'},avatar(f[0],'sm'),h('span',null,h('span',{class:'nm'},f[1]),h('span',{class:'sub'},'Flagged '+f[2]))))),
    h('p',null,'Three admins flagged you. You keep the messages already here; the hosts refuse anything new and change address on Sep 30.'),
    h('p',null,'To rejoin, an admin has to invite you again.'),h('div',{class:'acts'},h('button',{class:'btn tx',type:'button',autofocus:'',onclick:api.close},'Close')))})}

/* ---------- simulation drawer (harness only) ---------- */
const CHAT=['Weather looks clear now.','Parking is free before 8.','I can bring a spare jacket.','Who has the first-aid kit?'];
function renderSim(){
  const B=$('#simBody');B.replaceChildren();
  B.append(h('label',{class:'sw'},h('input',{type:'checkbox',checked:S.hostsOffline?'':null,onchange:e=>{S.hostsOffline=e.target.checked;const g=conv('hike');if(!g)return;
    if(!S.hostsOffline)flush(g);else{g.msgs.push({sys:1,text:'Both host desktops went offline'});renderConv();renderList();say('Weekend hike hosts are now offline')}}}),'Weekend hike: host desktops offline'));
  const qs=h('button',{class:'qsw',type:'button',role:'switch',id:'swQuiet','aria-checked':String(TinAudio.quiet()),onclick:()=>{const q=!TinAudio.quiet();TinAudio.setQuiet(q);say(q?'Quiet mode on. Call sounds are off.':'Quiet mode off. Call sounds play.')}},h('span',null,'Quiet mode'),h('i',{'aria-hidden':'true'}));
  B.append(qs);
  B.append(h('label',{class:'sw'},h('input',{type:'checkbox',checked:S.empty?'':null,onchange:e=>{const on=e.target.checked;S=seed();S.open={};S.hostsOffline=false;if(on){S.empty=true;S.groups=[];S.invites=[];S.reqIn=[];S.reqOut=[];S.privates=[]}renderAll();say(on?'Empty account':'Sample data restored')}}),'Start with an empty account'));
  if(conv('hike')&&!closed(conv('hike')))B.append(h('button',{class:'btn ol sm',type:'button',onclick:()=>{const g=conv('hike');incoming(g,{id:'s'+S.uid++,from:'sam',text:CHAT[S.chat++%CHAT.length],t:clock()});say('Sam sent a message')}},'Simulate: Sam sends a message'));
  S.events.forEach(ev=>B.append(h('button',{class:'btn ol sm',type:'button',onclick:()=>{S.events=S.events.filter(x=>x.id!==ev.id&&!(ev.req&&x.req===ev.req));ev.run();renderAll();refreshMembers()}},'Simulate: '+ev.label)));
  B.append(h('button',{class:'btn tx sm',type:'button',onclick:()=>{S=fresh();renderAll();say('Prototype reset')}},'Reset prototype'))}
function setSim(open){const el=$('#sim');el.hidden=!open;$('#simBtn').setAttribute('aria-expanded',String(open));if(open)$('#simTitle').focus()}
$('#simBtn').append(ic('sliders'));$('#simClose').append(ic('close'));
$('#simBtn').addEventListener('click',()=>setSim($('#sim').hidden));
$('#simClose').addEventListener('click',()=>{setSim(false);$('#simBtn').focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sim').hidden&&!$('dialog[open]')){const inside=$('#sim').contains(document.activeElement)||document.activeElement===document.body;setSim(false);if(inside)$('#simBtn').focus()}});

/* ---------- theme ---------- */
const mq=matchMedia('(prefers-color-scheme: dark)');
function dark(){const t=document.documentElement.dataset.theme;return t?t==='dark':mq.matches}
function syncTheme(){const b=$('#theme');b.setAttribute('aria-pressed',String(dark()));b.setAttribute('aria-label','Dark theme');b.title=dark()?'Switch to light theme':'Switch to dark theme';b.replaceChildren(ic(dark()?'sun':'moon'))}
$('#theme').addEventListener('click',()=>{document.documentElement.dataset.theme=dark()?'light':'dark';syncTheme()});
mq.addEventListener('change',syncTheme);syncTheme();
renderAll();
if(CALL){if(QS.get('call')==='open')openCall();else renderCall()}   // a call that is already live (maybe started in chat.html)
if(QS.has('call')){QS.delete('call');history.replaceState(history.state,'',location.pathname+(QS.toString()?'?'+QS:'')+location.hash)}
</script>
</body>
