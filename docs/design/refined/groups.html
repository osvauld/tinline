<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tinline · Groups (refined prototype)</title>
<style>
:root{--cv:#F4F1EB;--sw:#FBF9F5;--bi:#FFFFFF;--bo:#D5EADF;--onbo:#0E2B24;--s1:#4452A8;--s2:#A1481C;--s3:#0B6B5B;--s4:#8A3A86;--s5:#1F6A99;--s6:#766000;--s7:#B0345A;--bg:#F5F6F3;--sf:#FFFFFF;--sf2:#ECEFEB;--sf3:#DDE2DD;--ink:#17201D;--ink2:#4D5853;--ln:#D3D9D4;--ln2:#76827B;--pr:#0B6B5B;--onpr:#FFFFFF;--prc:#CDEBE3;--onprc:#06352D;--th:#C98A1E;--er:#B3261E;--erb:#B3261E;--erc:#F9DEDC;--oner:#410E0B;--rl:#4B5AA8;--rlc:#E1E4F7;--onrlc:#2F3A75;--wn:#FCEFD2;--onwn:#5C3B00;--c1:#4B5AA8;--c2:#8A5A00;--c3:#0B6B5B;--shadow:0 8px 30px rgba(15,21,19,.14);--scrim:rgba(15,21,19,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--cv:#141311;--sw:#1B1A17;--bi:#24221E;--bo:#1F4A40;--onbo:#DDF2EA;--s1:#A9B4F0;--s2:#F0A27A;--s3:#7ADBC3;--s4:#E0A3DC;--s5:#8CC7EE;--s6:#D9C46A;--s7:#F29DB4;--bg:#0F1513;--sf:#18211E;--sf2:#212C28;--sf3:#2D3A35;--ink:#E9EFEB;--ink2:#A9B5AF;--ln:#2F3B36;--ln2:#7D8B84;--pr:#5CC9AF;--onpr:#04241D;--prc:#174A40;--onprc:#CDEBE3;--er:#F2B8B5;--erb:#B3261E;--erc:#4A1F1C;--oner:#F9DEDC;--rl:#A9B4F0;--rlc:#2B3260;--onrlc:#DCE0FA;--wn:#3B2F12;--onwn:#F7E2B0;--c1:#A9B4F0;--c2:#E8C16A;--c3:#7ADBC3;--shadow:0 8px 30px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6)}}
:root[data-theme=dark]{--cv:#141311;--sw:#1B1A17;--bi:#24221E;--bo:#1F4A40;--onbo:#DDF2EA;--s1:#A9B4F0;--s2:#F0A27A;--s3:#7ADBC3;--s4:#E0A3DC;--s5:#8CC7EE;--s6:#D9C46A;--s7:#F29DB4;--bg:#0F1513;--sf:#18211E;--sf2:#212C28;--sf3:#2D3A35;--ink:#E9EFEB;--ink2:#A9B5AF;--ln:#2F3B36;--ln2:#7D8B84;--pr:#5CC9AF;--onpr:#04241D;--prc:#174A40;--onprc:#CDEBE3;--er:#F2B8B5;--erb:#B3261E;--erc:#4A1F1C;--oner:#F9DEDC;--rl:#A9B4F0;--rlc:#2B3260;--onrlc:#DCE0FA;--wn:#3B2F12;--onwn:#F7E2B0;--c1:#A9B4F0;--c2:#E8C16A;--c3:#7ADBC3;--shadow:0 8px 30px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6)}
*{box-sizing:border-box}
html{color-scheme:light dark}
:root[data-theme=dark]{color-scheme:dark}:root[data-theme=light]{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.page{max-width:1280px;margin:0 auto;padding:0 12px 24px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:8px 0}
.top a.back{display:inline-flex;align-items:center;min-height:44px;color:var(--pr);font-weight:600;text-decoration:none;padding-right:8px}
.top a.back:hover{text-decoration:underline}
.top h1{font-size:20px;margin:0;flex:1;min-width:120px}
.top .note{flex-basis:100%;margin:0;font-size:13px;color:var(--ink2);order:5}
.btn{min-height:44px;border-radius:999px;border:0;background:var(--pr);color:var(--onpr);font-weight:600;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ol{background:transparent;color:var(--pr);border:1px solid var(--ln2)}
.btn.tx{background:transparent;color:var(--pr);padding:0 14px}
.btn.dg{background:var(--erb);color:#fff}
.btn.tx.dg{background:transparent;color:var(--er)}
.btn.ol.dg{background:transparent;color:var(--er)}
.btn.sm{font-size:14px;padding:0 14px}
.btn[disabled]{opacity:.55;cursor:default}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.ib:hover,.btn.tx:hover,.row:hover{background:color-mix(in srgb,var(--pr) 9%,transparent)}
.ic{display:inline-flex;flex:none}.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:1fr;background:var(--sf);border:1px solid var(--ln);border-radius:20px;overflow:hidden;height:calc(100dvh - 140px);min-height:540px}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.app[data-view=list] .conv,.app[data-view=conv] .list{display:none}
.list{background:var(--bg)}
.conv{background:var(--cv)}
@media (max-width:899px){.app[data-view=conv]{position:fixed;inset:0;z-index:10;width:100%;height:100dvh;min-height:0;border:0;border-radius:0;padding-bottom:env(safe-area-inset-bottom)}.app[data-view=conv] .conv{min-height:0}}
@media (min-width:900px){.app{grid-template-columns:380px 1fr;height:calc(100dvh - 120px)}.app .list,.app .conv{display:flex!important}.list{border-right:1px solid var(--ln)}.backbtn{display:none!important}}
.lhead{display:flex;align-items:center;gap:8px;padding:12px 12px 4px 20px}
.lhead h2{font-size:26px;margin:0;flex:1}
.search{margin:4px 16px 8px;position:relative}
.search input{width:100%;height:48px;border-radius:24px;border:1px solid var(--ln);background:var(--sf);padding:0 44px 0 16px}
.search button{position:absolute;right:2px;top:2px}
.scroll{overflow:auto;flex:1;min-height:0;padding-bottom:16px}
.sec{font-size:12.5px;font-weight:700;letter-spacing:.05em;color:var(--ink2);padding:16px 20px 6px;text-transform:uppercase;margin:0}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:8px 16px 8px 20px;border:0;background:transparent;text-align:left}
.row.on{background:var(--prc)}
.row .tx1{flex:1;min-width:0}.nm{font-weight:600;display:block}.sub{display:block;font-size:14px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{font-size:12px;color:var(--ink2)}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--pr);color:var(--onpr);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.av,.gav{display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;width:44px;height:44px;border-radius:50%;font-size:15px;background:var(--rlc);color:var(--onrlc)}
.gav{border-radius:16px;background:var(--prc);color:var(--onprc)}
.av.lg{width:56px;height:56px;font-size:19px}.av.sm{width:36px;height:36px;font-size:13px}
.t-wn{background:var(--wn);color:var(--onwn)}.t-pr{background:var(--prc);color:var(--onprc)}.t-sf{background:var(--sf2);color:var(--ink2)}
.muted .nm{color:var(--ink2)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;margin:4px 16px 8px;display:flex;flex-direction:column;gap:10px}
.card .hd{display:flex;gap:12px;align-items:center}
.card .t{font-weight:700;font-size:17px}.hint{font-size:13.5px;color:var(--ink2);line-height:1.4}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.quote{background:var(--sf2);border-radius:14px;padding:8px 12px;font-size:15px;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--ink2)}
.pill.own{background:var(--wn);color:var(--onwn)}.pill.adm{background:var(--rlc);color:var(--onrlc)}.pill.hst{background:var(--prc);color:var(--onprc)}.pill.er{background:var(--erc);color:var(--oner)}
.empty{margin:24px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink2)}
.empty .big{width:72px;height:72px;border-radius:24px;background:var(--prc);color:var(--onprc);display:flex;align-items:center;justify-content:center}
.empty .big .ic svg{width:34px;height:34px}.empty h3{margin:0;color:var(--ink);font-size:18px}.empty p{margin:0;max-width:34ch;font-size:14.5px}
/* conversation */
.chead{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 4px;border-bottom:1px solid color-mix(in srgb,var(--ink) 9%,transparent);background:var(--sw);flex:none}
.chead .ttl{flex:1;min-width:0}.chead h2{font-size:18px;margin:0;line-height:1.25}.chead h2:focus{outline:none}
.chead .st{font-size:13px;color:var(--ink2)}.chead .st.warn{color:var(--c2);font-weight:600}
#bannerHost{flex:none;max-height:40dvh;overflow:auto}
.banner{margin:8px 12px 0;border-radius:16px;padding:12px 14px;background:var(--wn);color:var(--onwn);font-size:14px;display:flex;flex-direction:column;gap:8px}
.banner.er{background:var(--erc);color:var(--oner)}
.banner .btn.ol{color:inherit;border-color:currentColor;align-self:flex-start}
.msgs{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px;padding:10px 12px 10px;background:var(--cv);overscroll-behavior:contain}
.msgs > *{flex-shrink:0}
.brow{display:flex;max-width:100%;position:relative}.brow.in{padding-right:44px}.brow.out{padding-left:44px}
.brow{width:fit-content;max-width:min(580px,100%)}.brow.f{margin-top:9px}.brow.f:first-child{margin-top:0}
.brow.in{align-self:flex-start}.brow.out{align-self:flex-end}
.msg{max-width:100%;border-radius:18px;padding:7px 12px 6px;font-size:15px;line-height:21px;position:relative;overflow-wrap:anywhere;display:flow-root;box-shadow:0 1px 1px rgb(60 45 20 / .06),0 1px 3px rgb(60 45 20 / .05);-webkit-touch-callout:none}
.msg.in{background:var(--bi);color:var(--ink)}
.msg.out{background:var(--bo);color:var(--onbo)}
.brow.in:not(.f) .msg{border-top-left-radius:6px}.brow.out:not(.f) .msg{border-top-right-radius:6px}
.brow.in .msg{border-bottom-left-radius:6px}.brow.out .msg{border-bottom-right-radius:6px}
.msg.queued{background:transparent;box-shadow:none;border:1.5px dashed var(--ln2);color:var(--ink);padding:5.5px 10.5px 4.5px}
.msg.flash{outline:3px solid var(--pr)}
.who{font-size:12.5px;font-weight:700;line-height:17px;margin-bottom:1px;letter-spacing:.005em}
.meta{float:right;display:inline-flex;align-items:center;gap:3px;font-size:11px;line-height:14px;margin:6px 0 -1px 12px;opacity:.72;white-space:nowrap}
.meta .ic svg{width:13px;height:13px}
.meta.wide{float:none;display:flex;justify-content:flex-end;white-space:normal;text-align:right;margin:3px 0 0;opacity:.85}
.late{display:block;clear:both;font-size:11.5px;font-style:italic;opacity:.8;margin-top:2px}
.mo{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;padding:0;opacity:.7}
.mo .ic svg{width:18px;height:18px;stroke-width:3}
.brow.in .mo{right:0}.brow.out .mo{left:0}
.mo:hover{opacity:1}
@media (hover:hover) and (pointer:fine){.brow.in{padding-right:40px}.brow.out{padding-left:40px}.mo{width:32px;height:32px;margin-top:-16px;opacity:0}.brow.in .mo{right:2px}.brow.out .mo{left:2px}.mo .ic svg{width:16px}.brow:hover .mo,.brow:focus-within .mo,.mo:focus-visible{opacity:1}.mo:hover{background:color-mix(in srgb,var(--ink) 9%,transparent)}}
.rq{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--qc,var(--pr));background:color-mix(in srgb,currentColor 7%,transparent);border-radius:6px 10px 10px 6px;padding:3px 8px;margin:1px 0 4px;font-size:13px;line-height:18px}
.rq b{display:block;font-size:12px;color:var(--qc,inherit)}.rq span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sys{align-self:center;font-size:12px;line-height:16px;color:var(--ink2);padding:10px 20px 6px;text-align:center;max-width:92%}
.comp{padding:6px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--cv);flex:none}
.comp .reply{display:flex;align-items:center;gap:8px;background:var(--bi);border-left:3px solid var(--pr);border-radius:8px 14px 14px 8px;padding:1px 2px 1px 10px;margin:0 2px 6px;font-size:13px;box-shadow:0 1px 2px rgb(60 45 20 / .08)}
.comp .reply span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp .reply .ib{width:40px;height:40px}
.cin{display:flex;gap:8px;align-items:flex-end}
.cin textarea{flex:1;min-width:0;min-height:46px;max-height:140px;resize:none;border-radius:23px;border:1px solid var(--ln);background:var(--bi);padding:11px 16px;line-height:22px;box-shadow:0 1px 2px rgb(60 45 20 / .05)}
.cin .ib.send{background:var(--pr);color:var(--onpr);width:46px;height:46px}
@media (max-width:359px){.chead .mt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.chead .btn.tx{padding:0;width:44px}.chead .st{font-size:12px}}
dialog.dact{width:min(360px,calc(100vw - 24px))}
.dact .quote{max-height:4.6em;overflow:hidden;font-size:14px;color:var(--ink2)}
.dact .mi{min-height:52px}
.closed{padding:12px 16px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;background:var(--sf);border-top:1px solid var(--ln);flex:none;align-items:center}
.chip{align-self:center;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:6px 6px 6px 14px;font-size:14px}
.placeholder{flex:1;display:flex;align-items:center;justify-content:center}
@media (max-width:899px){.placeholder{display:none}}
/* dialogs */
dialog{border:0;padding:0;border-radius:20px;background:var(--sf);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:var(--shadow);overflow:hidden}
dialog::backdrop{background:var(--scrim)}
dialog[open]{display:flex;flex-direction:column}
.dlg{min-height:0;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg h2{font-size:21px;margin:0}.dlg h2:focus{outline:none}
.dlg p{margin:0;font-size:15px;color:var(--ink2);line-height:1.45}
.dlg .acts{justify-content:flex-end;margin-top:4px}
.dhead{display:flex;align-items:center;gap:4px}.dhead h2{flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--ink2)}
.field input{height:52px;border-radius:12px;border:1px solid var(--ln2);background:var(--bg);padding:0 16px}
.field input[aria-invalid=true]{border:2px solid var(--er)}
.err{color:var(--er);font-size:13.5px;font-weight:600;min-height:0}
.pick{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 4px;cursor:pointer;border-radius:12px}
.pick:hover{background:var(--sf2)}.pick input{width:22px;height:22px;accent-color:var(--pr);flex:none}
.pick .av{width:36px;height:36px;font-size:13px}
.meter{display:flex;gap:6px}.meter i{flex:1;height:8px;border-radius:4px;background:var(--sf3)}.meter i.on{background:var(--er)}
.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 8px;border:0;background:transparent;border-radius:14px;text-align:left}
.mrow:hover{background:var(--sf2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ln2);flex:none;margin:0 7px}.dot.on{background:var(--pr)}
.mi{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:14px}
.mi:hover{background:var(--sf2)}.mi.dg{color:var(--er)}.mi .sub{white-space:normal}
.mi[aria-disabled=true]{opacity:.6}
@media (max-width:639px){dialog.dsheet{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:24px 24px 0 0;max-height:90dvh}}
@media (min-width:900px){dialog.ddrawer{margin:0 0 0 auto;height:100dvh;max-height:none;width:400px;border-radius:20px 0 0 20px}}
dialog[open]{animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
/* toast + sim */
.toast{position:fixed;margin:0;inset:auto auto 20px 50%;border:0;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:16px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:8px;max-width:min(520px,calc(100vw - 24px));font-size:14.5px;box-shadow:var(--shadow);animation:pop .16s ease-out}
.toast button{min-height:44px;border:0;background:transparent;color:var(--bg);font-weight:700;text-decoration:underline;padding:0 10px}
details.sim{margin-top:12px;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:0 16px}
details.sim summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details.sim .in{padding:0 0 16px;display:flex;flex-direction:column;gap:10px}
.sw{display:flex;align-items:center;gap:12px;min-height:44px}.sw input{width:22px;height:22px;accent-color:var(--pr)}
/* compact waiting folds */
.wait{display:flex;align-items:center;gap:8px;margin:0 16px 4px;min-height:44px;padding:0 14px;border:0;border-radius:14px;background:var(--wn);color:var(--onwn);font-size:14px;font-weight:600;text-align:left;width:calc(100% - 32px)}
.fold{margin:8px 16px 0;border:1px solid var(--ln);border-radius:16px;background:var(--sf);overflow:hidden}
.fold summary{min-height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:600;font-size:15px;cursor:pointer;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);margin-left:auto;margin-right:4px;transition:transform .12s}
.fold[open] summary::after{transform:rotate(-135deg)}
.fold .row{min-height:60px;padding:6px 8px 6px 14px;border-top:1px solid var(--ln)}
.fold .row .gav,.fold .row .av{width:40px;height:40px}
.fold .hint.pad{padding:8px 16px 12px;margin:0;border-top:1px solid var(--ln)}
.dlg .facts{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:var(--ink2)}
.dlg .facts b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (forced-colors:active){.msg{border:1px solid CanvasText}.mo{opacity:1}}
</style>

<body>
<div class="page">
<header class="top">
  <a class="back" href="./index.html">← Home</a>
  <h1>Groups</h1>
  <button class="btn ol sm" id="theme" type="button" aria-pressed="false">Dark mode</button>
  <p class="note">Interactive design · simulated data. Nothing is sent anywhere; replies from other people are triggered under “Simulation”.</p>
</header>
<main>
  <div class="app" id="app" data-view="list">
    <section class="pane list" id="listPane" aria-label="Groups and requests"></section>
    <section class="pane conv" id="convPane" aria-label="Conversation"></section>
  </div>
  <details class="sim" id="sim"><summary>Simulation</summary><div class="in" id="simBody"></div></details>
</main>
</div>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<div id="toastHost"></div>

function drawMember(pid){

  const p=P[pid],me=pid==='me',admin=isAdmin(g),f=(g.flags[pid]||[]).length;
  const priv=S.privates.find(x=>x.person===pid),out=S.reqOut.find(r=>r.to===pid&&r.state==='waiting'),blocked=S.blocked?.[pid];
  const mi=(icn,label,sub,fn,cls)=>h('button',{class:'mi '+(cls||''),type:'button',onclick:fn},ic(icn),h('span',{style:'flex:1'},label,sub?h('span',{class:'sub',style:cls==='dg'?'color:var(--er)':''},sub):null));
  const kids=[h('div',{class:'dhead'},h('button',{class:'ib',type:'button','aria-label':'Back to members',onclick:()=>{mem.back=pid;mem.pid=null;drawMembers()}},ic('back')),h('h2',null,me?'You':p.n),h('button',{class:'ib',type:'button','aria-label':'Close members',onclick:api.close},ic('close'))),
    h('div',{style:'display:flex;gap:12px;align-items:center'},avatar(pid,'lg'),h('div',null,h('div',{class:'hint'},'Member since '+m.since+(m.by?' · invited by '+m.by:'')),h('div',{style:'display:flex;gap:6px;margin-top:4px;flex-wrap:wrap'},m.roles.length?m.roles.map(r=>h('span',{class:'pill '+({owner:'own',admin:'adm',host:'hst'}[r])},r[0].toUpperCase()+r.slice(1))):h('span',{class:'pill'},'Member'),blocked?h('span',{class:'pill er'},'Blocked by you'):null)))];
  if(me){kids.push(h('p',null,'This is you. Others see your name and messages, never your address.'),
    h('p',{class:'hint'},isAdmin(g)?'You are an admin: you can flag members for removal.':'You are a member.'));api.set(...kids);return}
  kids.push(h('h3',{class:'sec',style:'padding:6px 0 0'},'In this group'),h('p',null,first(pid)+' sees your name and group messages. '+first(pid)+' never receives your address, and you never receive theirs.'));
  kids.push(h('h3',{class:'sec',style:'padding:6px 0 0'},'Private chat'));
  if(blocked)kids.push(h('p',null,'You blocked '+first(pid)+'. They can’t send private requests or calls. They stay in the group.'),mi('block','Unblock '+first(pid),null,()=>{delete S.blocked[pid];say(first(pid)+' unblocked');drawMembers()}));
  else if(priv)kids.push(mi('chat','Open chat with '+first(pid),priv.calls?'Messages and calls':'Messages only',()=>{api.noRestore=true;api.close();openConv(priv.id)}));
  else if(out)kids.push(h('p',null,'Request sent. Waiting for '+first(pid)+'. They see your name, this group and your note. The host can’t read the note, but can see that a request was made, who asked whom, and when.'),mi('close','Cancel request',null,()=>{S.reqOut=S.reqOut.filter(r=>r!==out);S.events=S.events.filter(e=>e.req!==out.id);renderAll();drawMembers();say('Request cancelled. '+first(pid)+' won’t be told.')}));
  else kids.push(mi('chat','Message privately','Sends '+first(pid)+' a chat request. Calls stay off.',()=>askPrivate(pid,g)));
  if(!blocked)kids.push(mi('block','Block '+first(pid),'Just for you. '+first(pid)+' stays in the group.',()=>confirmDlg({title:'Block '+first(pid)+'?',text:[first(pid)+' is told they’re blocked and can’t ask you for private chats or calls.','They stay in “'+g.name+'” and can still read your group messages. Blocking never removes anyone from a group.'],confirm:'Block '+first(pid),danger:true,onYes:()=>{(S.blocked=S.blocked||{})[pid]=true;drawMembers();say(first(pid)+' blocked. They were told.')}}),'dg'));
  if(admin&&!m.roles.includes('owner')){
    kids.push(h('h3',{class:'sec',style:'padding:6px 0 0'},'Admin'));
    if(!m.roles.includes('admin'))kids.push(mi('shield','Make admin','Admins can flag members for removal.',()=>{m.roles.push('admin');say(first(pid)+' is now an admin');drawMember(pid)}));
    kids.push(mi('flag','Flag to remove',f+' of 3 flags. 3 flags remove '+first(pid)+' from the group.',()=>flagDlg(g,pid),'dg'))}
  api.set(...kids)}
function askPrivate(pid,g){
  dialog('dsheet',api=>{const note=h('input',{id:'note',value:'Hi '+first(pid)+', it’s Asha. Can I ask about the lift?',maxlength:'140'});
    api.set(h('h2',null,'Ask '+first(pid)+' for a private chat'),h('div',{class:'field'},h('label',{for:'note'},'Add a note (optional)'),note),
      h('p',null,first(pid)+' sees your name, “'+g.name+'” and your note. The request goes through the group’s host, sealed to '+first(pid)+': the host can’t read it. The host can see that a request was made, who asked whom and when.'),
      h('p',null,'If '+first(pid)+' accepts, you can message each other directly. Calls stay off until one of you allows them.'),
      h('div',{class:'acts'},h('button',{class:'btn tx',type:'button',onclick:api.close},'Cancel'),h('button',{class:'btn',type:'button',onclick:()=>{
        const r={id:'o'+S.uid++,to:pid,state:'waiting',via:g.name};S.reqOut.unshift(r);
        S.events.push({id:'acc-'+r.id,req:r.id,label:first(pid)+' accepts my private chat request',run:()=>{S.reqOut=S.reqOut.filter(x=>x!==r);const pc={id:'p-'+pid,type:'private',person:pid,calls:false,msgs:[{sys:1,text:first(pid)+' accepted your request from '+g.name},{id:'z'+S.uid++,from:'me',text:note.value||'(no note)',t:clock(),state:'delivered'}]};S.privates.push(pc);say(first(pid)+' accepted. Chat is open, messages only.')}});
        S.events.push({id:'dec-'+r.id,req:r.id,label:first(pid)+' declines',run:()=>{r.state='declined';r.when='today';say(first(pid)+' declined your request')}});
        api.close();say('Request sent to '+first(pid)+' (simulated). They’ll answer from their chats list.');renderAll();refreshMembers()}},'Send request'))); })}
function flagDlg(g,pid){
  const n=(g.flags[pid]||[]).length+1,removing=n>=3;
  confirmDlg({title:removing?'Flag '+first(pid)+' and remove them?':'Flag '+first(pid)+' for removal?',meter:{on:n,label:'Flag '+n+' of 3 after yours'},
    text:[removing?'Yours is flag 3 of 3. '+first(pid)+' is removed right away: new messages are refused and they’re told. Messages written before the removal may still arrive. Only the hosts change address, 2 days later; other members do nothing.':'Yours will be flag '+n+' of 3. At 3 flags '+first(pid)+' is removed right away: new messages are refused and they’re told.','Flags can’t be taken back, and '+first(pid)+' can see who flagged them. Flags from the same admin count separately: three flags can come from one admin.'],
    confirm:removing?'Flag and remove':'Flag',danger:true,onYes:()=>{
      (g.flags[pid]=g.flags[pid]||[]).push('me');
      if(g.flags[pid].length>=3){g.members=g.members.filter(m=>m.id!==pid);g.msgs.push({sys:1,text:first(pid)+' was removed after 3 admin flags'});
        setTimeout(()=>{g.msgs.push({id:'late'+S.uid++,from:pid,text:'Running late, start without me',t:'before removal',late:'Written before '+first(pid)+' was removed'});if(S.cur===g.id)renderMsgs()},900);
        mem.pid=null;renderAll();drawMembers();say(first(pid)+' removed. They were told, and hosts will rotate addresses in 2 days.')}
      else{drawMember(pid);say('Flagged. '+first(pid)+' now has '+g.flags[pid].length+' of 3 flags.')}}})}
function leaveGroup(g){
  const sole=g.hosts.length===1&&g.hosts[0].self;
  confirmDlg({title:'Leave “'+g.name+'”?',text:['You stop receiving messages. The group sees “You left”. The chat stays on this phone, read-only.',sole?'Your desktop is the only host. After you leave, nobody can host this group until another member does.':'To come back, an admin has to invite you again.'],confirm:'Leave group',danger:true,onYes:()=>{
    g.status='left';g.msgs.push({sys:1,text:'You left the group'});mem?.api.close();renderAll();say('You left '+g.name+'.');}})}
function showRemoval(g){
  dialog('dsheet',api=>{api.set(h('div',{class:'dhead'},h('h2',null,'Why you were removed'),h('button',{class:'ib',type:'button','aria-label':'Close',onclick:api.close},ic('close'))),
    h('div',{style:'background:var(--sf2);border-radius:20px;padding:4px 12px'},g.flaggers.map(f=>h('div',{class:'mrow',style:'cursor:default'},avatar(f[0],'sm'),h('span',null,h('span',{class:'nm'},f[1]),h('span',{class:'sub'},'Flagged '+f[2]))))),
    h('p',{class:'hint',style:'display:flex;gap:8px'},ic('shield'),'Each flag is signed by the admin who made it and was checked on this phone. Flags from the same admin count separately.'),
    h('p',null,'You keep the messages already here. The group’s hosts refuse anything new from you now and rotate their addresses on Sep 30, after which this phone can’t reach them at all. Messages you wrote before the removal can still arrive until then. Other members don’t change anything; only the hosts move.'),
    h('p',null,'To rejoin, an admin has to invite you again. You can’t message members privately from here: such requests go through a group host, and they no longer accept you.'),h('div',{class:'acts'},h('button',{class:'btn tx',type:'button',onclick:api.close},'Close')))})}

/* ---------- simulation panel ---------- */
function renderSim(){
  const B=$('#simBody');B.replaceChildren();
  B.append(h('label',{class:'sw'},h('input',{type:'checkbox',checked:S.hostsOffline?'':null,onchange:e=>{S.hostsOffline=e.target.checked;const g=conv('hike');
    if(!S.hostsOffline&&g)flush(g);else{g.msgs.push({sys:1,text:'Both host desktops went offline.'});renderConv();renderList();say('Weekend hike hosts are now offline')}}}),'Weekend hike: host desktops offline'));
  B.append(h('label',{class:'sw'},h('input',{type:'checkbox',checked:S.empty?'':null,onchange:e=>{const on=e.target.checked;S=seed();S.open={};S.hostsOffline=false;if(on){S.empty=true;S.groups=[];S.invites=[];S.reqIn=[];S.reqOut=[];S.privates=[]}renderAll();say(on?'Empty account':'Sample data restored')}}),'Start with an empty account'));
  if(S.events.length){B.append(h('div',{class:'hint'},'Replies from other people (nothing happens until you trigger it):'));
    S.events.forEach(ev=>B.append(h('div',null,h('button',{class:'btn ol sm',type:'button',onclick:()=>{S.events=S.events.filter(x=>x.id!==ev.id&&!(ev.req&&x.req===ev.req));ev.run();renderAll();refreshMembers()}},'Simulate: '+ev.label))))}
  else B.append(h('div',{class:'hint'},'Nothing is waiting for a reply. Invite someone, ask a member for a private chat or ask for a host and their simulated answer appears here.'));
  B.append(h('div',null,h('button',{class:'btn tx sm',type:'button',onclick:()=>{S=fresh();$('#sim').open=true;renderAll();say('Prototype reset')}},'Reset prototype')))}

/* ---------- theme ---------- */
const mq=matchMedia('(prefers-color-scheme: dark)');
function dark(){const t=document.documentElement.dataset.theme;return t?t==='dark':mq.matches}
function syncTheme(){const b=$('#theme');b.setAttribute('aria-pressed',dark());b.textContent=dark()?'Light mode':'Dark mode';b.setAttribute('aria-label',dark()?'Switch to light mode':'Switch to dark mode')}
$('#theme').addEventListener('click',()=>{document.documentElement.dataset.theme=dark()?'light':'dark';syncTheme()});
mq.addEventListener('change',syncTheme);syncTheme();
renderAll();
</script>
