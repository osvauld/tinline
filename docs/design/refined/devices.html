<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Setup and devices · Tinline refined design</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs-body)/var(--lh-body) system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent-ink);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
code{font:500 .92em ui-monospace,SFMono-Regular,Menlo,monospace}
/* harness bar + simulation drawer (shared chrome) */
.hb{display:flex;align-items:center;gap:4px;max-width:1240px;margin:0 auto;padding:4px 10px 4px 16px;min-height:48px}
.hb h1{flex:1;min-width:0;margin:0;display:flex;align-items:center;gap:6px;font-size:var(--fs-sub);font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb h1 a{display:inline-flex;align-items:center;min-height:44px;color:var(--accent-ink);font-weight:600;text-decoration:none}
.hb h1 a:hover{text-decoration:underline}
.hb-ib{position:relative;width:36px;height:36px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--muted);display:inline-grid;place-items:center;padding:0}
.hb-ib::before{content:"";position:absolute;inset:-4px}
.hb-ib:hover{background:var(--surface-2);color:var(--ink)}
.hb-ib[aria-expanded=true]{background:var(--accent-soft);color:var(--accent-ink)}
.hb-ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#simtog.has::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
#theme[aria-pressed=true] .moon,#theme[aria-pressed=false] .sun{display:none}
.scrim{position:fixed;inset:0;background:rgb(10 16 14 / .5);z-index:29}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(400px,100vw);display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-sheet)}
.drawer[hidden],.scrim[hidden]{display:none}
.dr-h{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 10px 6px 20px;border-bottom:1px solid var(--hairline)}
.dr-h h2{flex:1;margin:0;font-size:var(--fs-body);font-weight:600}
.dr-b{flex:1;overflow:auto;padding:16px 20px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}
.dr-note{margin:0;font-size:var(--fs-sub);line-height:19px;color:var(--muted);background:var(--surface-2);border-radius:var(--r-ctl);padding:10px 12px}
.dr-sec h3{margin:0 0 8px;font-size:var(--fs-meta);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dr-sec p{margin:0 0 8px;font-size:var(--fs-sub);line-height:19px;color:var(--muted)}
.dr-sec .row{gap:8px}
.dr-sec .btn{min-height:40px;font-size:14px;padding:0 14px}
.dr-sec:empty{display:none}
.dr-code{font:700 22px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:var(--ink);background:var(--surface-2);border-radius:var(--r-ctl);padding:12px;text-align:center;margin:0 0 8px}
@media(min-width:1100px){body.dr-open{padding-right:400px}.scrim{display:none!important}.drawer{box-shadow:none}}
/* page */
.wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}
nav.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:4px -16px 16px;padding:4px 16px;scroll-padding:0 16px;
 -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 24px),transparent)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs .t-chip{flex:none;white-space:nowrap;cursor:pointer;min-height:36px;position:relative}
nav.tabs .t-chip::before{content:"";position:absolute;inset:-4px 0}
nav.tabs .t-chip[aria-current=page]{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
nav.tabs .t-chip:not([aria-current=page]):hover{background:var(--surface-2)}
@media(min-width:760px){nav.tabs{justify-content:center;-webkit-mask-image:none;mask-image:none}}
main{min-width:0}
/* app frame */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sheet);padding:28px 24px;margin:0 auto 16px;max-width:560px}
.card.narrow{max-width:440px}
.card .card{border-radius:var(--r-ctl);padding:16px;margin:0}
h2{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}h2:focus{outline:none}
h3{font-size:var(--fs-sub);line-height:18px;font-weight:600;margin:0 0 6px;color:var(--muted)}
p{margin:0 0 12px;color:var(--muted);font-size:var(--fs-body)}p.ink{color:var(--ink)}
.small{font-size:var(--fs-sub);line-height:19px;color:var(--muted)}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:0 18px;border-radius:var(--r-ctl);border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:600;font-size:var(--fs-body);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}.btn.pri:hover{filter:brightness(1.06)}
.btn.dng{background:var(--danger);border-color:transparent;color:var(--on-danger)}
.btn.out-dng{color:var(--danger)}
.btn.tx{border-color:transparent;color:var(--accent-ink)}
.btn.sm{padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.f{display:block;padding:0;font-size:14px;font-weight:600;margin:0 0 6px}
input[type=text],input[type=password],textarea{width:100%;min-height:48px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:11px 14px}
input[type=text]:focus,input[type=password]:focus,textarea:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--press-wash)}
textarea{min-height:110px;resize:vertical}
input.bad,textarea.bad{border-color:var(--danger)}
.fhint{font-size:var(--fs-sub);line-height:18px;color:var(--muted);margin-top:6px}
.err{display:flex;gap:8px;color:var(--ink);background:var(--danger-bg);border-radius:var(--r-ctl);padding:10px 12px;font-size:14px;line-height:20px;margin-top:8px}
.err svg{margin-top:0;color:var(--danger)}
.warn{display:flex;gap:10px;background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r-ctl);padding:12px 14px;font-size:14px;line-height:20px}
.warn p,.info p{color:inherit;margin:0;font-size:inherit;line-height:inherit}
.warn svg{margin-top:0}
.note{font-size:var(--fs-sub);line-height:19px;color:var(--muted);margin:16px 0 0}
/* explainer callouts: outside app frames, quiet */
.info{display:flex;gap:10px;background:var(--surface-2);color:var(--muted);border-radius:var(--r-ctl);padding:12px 14px;font-size:var(--fs-sub);line-height:19px;max-width:560px;margin:0 auto 12px}
.info svg{width:18px;height:18px;margin-top:1px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-ctl);padding:12px 14px;background:var(--surface);cursor:pointer;min-height:44px}
.opt:has(input:checked){border-color:transparent;background:var(--accent-soft);color:var(--accent-ink)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt input{margin-top:2px;width:20px;height:20px;accent-color:var(--accent);flex:none}
.opt b{display:block;font-weight:600}.opt span.d{font-size:var(--fs-sub);line-height:19px;color:var(--muted)}.opt:has(input:checked) span.d{color:var(--accent-ink)}
.bigbtn{width:100%;text-align:left;display:flex;gap:14px;align-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-ctl);padding:12px 14px;min-height:64px}
.bigbtn:hover{background:var(--surface-2)}.bigbtn .d{display:block;font-size:var(--fs-sub);line-height:19px;color:var(--muted)}.bigbtn b{display:block;font-weight:600}
.bigbtn>.ico{color:var(--accent-ink);width:22px;height:22px}
.progress{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin:6px 0 20px}.progress i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .18s ease-out}
.words{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.words li{display:flex;gap:6px;align-items:baseline;border:1px solid var(--hairline);border-radius:10px;padding:7px 10px;font:500 15px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);min-height:38px}
.words li span{font-size:11px;color:var(--muted);width:18px;text-align:right;font-variant-numeric:tabular-nums}
.t-chip.sug{cursor:pointer;min-height:36px}
.t-chip.sug:hover{background:var(--surface-2)}
.dia{display:grid;grid-template-columns:1fr 32px 1fr;gap:6px;align-items:stretch;margin:4px 0 16px}
.dev{min-width:0;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:var(--r-ctl);padding:12px;text-align:center;font-size:var(--fs-sub);line-height:18px;color:var(--muted)}
.dev b{display:block;color:var(--ink);font-size:14px;font-weight:600}.dev .ico{width:26px;height:26px;color:var(--muted)}
.dev.me{border-color:transparent;background:var(--accent-soft);color:var(--accent-ink)}.dev.me b{color:var(--accent-ink)}.dev.me .ico{color:var(--accent-ink)}
.dia .arrow{color:var(--muted);text-align:center;align-self:center}
@media (max-width:300px){.dia{grid-template-columns:minmax(0,1fr)}.dia .arrow{transform:rotate(90deg)}}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.steps{margin:0;padding-left:20px;color:var(--ink);font-size:14px;line-height:20px}.steps li{margin:4px 0}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;border-radius:var(--r-ctl);background:var(--bg)}
.qrbox svg.qr{width:min(100%,232px);height:auto;border-radius:12px;display:block}
.code{font:700 clamp(30px,9vw,42px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-align:center;padding:16px 8px;border-radius:var(--r-ctl);background:var(--bg);font-variant-numeric:tabular-nums}
.view{position:relative;background:#0a0e0d;border-radius:var(--r-ctl);aspect-ratio:4/3;max-width:360px;margin:0 auto;display:grid;place-items:center;color:#cfd8d4}
.view i{position:absolute;width:40px;height:40px;border:3px solid #6fd3bd}
.view i:nth-child(1){left:16px;top:16px;border-right:0;border-bottom:0;border-radius:16px 0 0 0}.view i:nth-child(2){right:16px;top:16px;border-left:0;border-bottom:0;border-radius:0 16px 0 0}.view i:nth-child(3){left:16px;bottom:16px;border-right:0;border-top:0;border-radius:0 0 0 16px}.view i:nth-child(4){right:16px;bottom:16px;border-left:0;border-top:0;border-radius:0 0 16px 0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--accent);vertical-align:1px}.dot.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.dlist{list-style:none;margin:0;padding:0}
.dlist li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--hairline);flex-wrap:wrap}.dlist li:first-child{border-top:0}
.dlist .info1{flex:1;min-width:min(180px,100%);overflow-wrap:anywhere}.dlist .info1 b{display:block;font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:0 8px;line-height:18px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:2px}
.ava{width:44px;height:44px;border-radius:50%;background:var(--surface-2);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.t-avatar.av44{width:44px;height:44px;font-size:15px}
.xl li{display:flex;gap:10px;align-items:center;padding:8px 0;list-style:none;font-size:var(--fs-body)}.xl{padding:0;margin:0 0 16px}
.xl .ico{color:var(--muted)}.xl li.done .ico{color:var(--accent-ink)}.xl li.cur{font-weight:600}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.hd>div{flex:1 1 220px;min-width:0}
.hd p{margin:0;font-size:var(--fs-sub);line-height:19px}
/* explainer: decided vs proposed (outside the frame) */
details.notes{max-width:560px;margin:0 auto;border-radius:var(--r-ctl);padding:0 4px}
details.notes summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-size:var(--fs-sub);font-weight:600;color:var(--muted);list-style:none;gap:6px}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .12s ease-out;margin:0 4px}
details.notes[open] summary::before{transform:rotate(45deg)}
details.notes ul{margin:0 0 12px;padding-left:20px;color:var(--muted);font-size:var(--fs-sub);line-height:19px}details.notes li{margin:6px 0}
.tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:1px 6px;margin-right:6px}.tag.est{background:var(--accent-soft);color:var(--accent-ink)}.tag.prop{background:var(--warn-bg);color:var(--warn-ink)}
.status{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(520px,calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:var(--r-ctl);padding:10px 16px;font-size:14px;line-height:20px;box-shadow:var(--shadow-pop);z-index:40;transition:opacity .16s ease-out}
.status.off{opacity:0;pointer-events:none}
/* dialogs: centered >=700px, bottom sheet below */
dialog{border:0;border-radius:var(--r-sheet);background:var(--surface);color:var(--ink);padding:0;width:min(460px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;box-shadow:var(--shadow-sheet)}
dialog::backdrop{background:rgb(10 16 14 / .5)}
dialog .dc{padding:24px}dialog .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
dialog h2{font-size:20px;line-height:26px}
dialog p{font-size:14px;line-height:20px}
dialog ul{padding-left:20px;margin:0 0 12px;color:var(--muted);font-size:14px;line-height:20px}dialog li{margin:6px 0}
dialog li b{color:var(--ink);font-weight:600}
@media(max-width:699px){
 dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:var(--r-sheet) var(--r-sheet) 0 0;max-height:90dvh}
 dialog .dc{padding:12px 20px calc(20px + env(safe-area-inset-bottom))}
 dialog .dc::before{content:"";display:block;width:28px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
 dialog .acts .btn{flex:1 1 auto}
 .card{padding:22px 18px;border-radius:20px}.cols2{grid-template-columns:1fr}
}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
@media (max-width:340px){.wrap{padding:0 10px 48px}nav.tabs{margin:4px -10px 14px;padding:4px 10px}.card{padding:18px 14px}.opt{padding:10px;gap:8px}.bigbtn{padding:10px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
:root[data-motion=reduce] *{animation:none!important}

function clearTimers(){clearInterval(timers.qr);clearInterval(timers.rv);clearInterval(timers.lock)}

/* ---------- dialog (native <dialog>: trapped focus, Esc closes, focus restored) ---------- */
function dlg({title,body,actions,focus,wide}){
 const opener=document.activeElement,fk=opener&&opener.dataset?opener.dataset.fk:'';
 const d=document.createElement('dialog');d.setAttribute('aria-labelledby','dt');
 d.innerHTML=`<div class="dc"><h2 id="dt" style="font-size:21px">${title}</h2><div>${body}</div><div class="acts">${actions.map((a,i)=>`<button type="button" class="btn ${a.cls||''}" data-i="${i}">${a.label}</button>`).join('')}</div></div>`;
 document.body.appendChild(d);
 d.addEventListener('click',e=>{
  if(e.target===d){d.close();return}
  const b=e.target.closest('button[data-i]');if(!b)return;
  const a=actions[+b.dataset.i];
  if(!a.run){d.close();return}
  if(a.run(d)!==false)d.close();
 });
 d.addEventListener('close',()=>{d.remove();let t=opener&&opener.isConnected?opener:(fk?document.querySelector(`[data-fk="${fk}"]`):null);if(t&&!d.dataset.keep)t.focus();else if(document.activeElement===document.body){const h=document.querySelector('#panel h2');if(h)h.focus()}});
 d.showModal();
 const f=focus?d.querySelector(focus):d.querySelector('input,textarea');
 (f||d.querySelector('button[data-i]')).focus();
 return d;
}
function dErr(d,msg,input){let e=d.querySelector('[data-err]');if(!e){e=document.createElement('div');e.dataset.err=1;e.className='err';e.setAttribute('role','alert');(input?input.parentElement:d.querySelector('.acts').parentElement).appendChild(e)}e.textContent=msg;if(input){input.classList.add('bad');input.setAttribute('aria-invalid','true');input.focus()}}
function passField(id,label){return `<div style="margin-top:12px"><label class="f" for="${id}">${label||'Passphrase'}</label><input id="${id}" type="password" autocomplete="off"></div>`}

  <p class="note">With no server, losing every device and your recovery phrase means nobody can bring the account back.</p>`;
 else if(s.step==='name'){const e=s.err||{};
  b=`<h2 tabindex="-1">${s.path==='restore'?'Name this device':'Name your account and device'}</h2><p>Names help you tell your devices apart. Contacts never see device names.</p><div class="stack">

  <div class="row"><button class="btn pri" data-act="s-tolink" data-fk="s-tolink">${s.path==='restore'?'Link from another device to bring contacts and chats':'Link another device'}</button><button class="btn" data-act="s-restart">Start over</button></div>`;
 return `<div class="card narrow">${back}${head}${b}</div>`+notes([

 const lock=u.wait>0;
 return `<div class="card narrow ${u.shake?'shake':''}"><div style="text-align:center;margin-bottom:6px"><svg viewBox="0 0 108 108" width="64" height="64" style="border-radius:18px" aria-hidden="true"><rect width="108" height="108" fill="#0B6B5B"/><rect x="20" y="43" width="20" height="22" rx="4" fill="#F5F6F3"/><rect x="68" y="43" width="20" height="22" rx="4" fill="#F5F6F3"/><path d="M44 54Q54 62 64 54" fill="none" stroke="#E8B04A" stroke-width="3" stroke-linecap="round"/></svg></div>
 <h2 tabindex="-1" style="text-align:center">Welcome back, Maya</h2><p style="text-align:center">Enter your passphrase to open Tinline. Calls can't reach you until you do.</p>
 <form data-form="u-submit" class="stack" novalidate>
  <div><label class="f" for="u-pass">Passphrase</label><div style="position:relative"><input id="u-pass" type="${u.show?'text':'password'}" data-bind="unlock.pass" value="${esc(u.pass)}" autocomplete="off" spellcheck="false" ${lock?'disabled':''} ${u.err?'class="bad" aria-invalid="true" aria-describedby="u-err"':''} style="padding-right:56px">

  ${lock?`<div class="err" role="alert" id="u-err">${ic('clock')}<span>Too many tries. You can try again in <b id="lock-left">${u.wait}</b>s. Nothing was erased, and no number of wrong tries will erase anything.</span></div>`:(u.err?err(u.err,'u-err'):'')}
  <button class="btn pri full" ${lock?'disabled':''}>Unlock</button></form>

/* LINK */
function deviceDiagram(role){

function directions(role,method){

}
function qrSvg(seed,expired){
 const n=25;let x=seed*7919+13;const r=()=>{x=(x*9301+49297)%233280;return x/233280};let s='';
 const fin=(a,b)=>`<rect x="${a}" y="${b}" width="7" height="7" fill="#111"/><rect x="${a+1}" y="${b+1}" width="5" height="5" fill="#fff"/><rect x="${a+2}" y="${b+2}" width="3" height="3" fill="#111"/>`;
 for(let i=0;i<n;i++)for(let j=0;j<n;j++){if((i<8&&j<8)||(i<8&&j>n-9)||(i>n-9&&j<8))continue;if(r()>.52)s+=`<rect x="${j}" y="${i}" width="1" height="1" fill="#111"/>`}
 return `<svg class="qr" viewBox="-2 -2 29 29" shape-rendering="crispEdges" role="img" aria-label="${expired?'Expired simulated QR code':'Simulated QR code, not scannable'}"><rect x="-2" y="-2" width="29" height="29" fill="#fff"/><g ${expired?'opacity=".12"':''}>${s}${fin(0,0)}${fin(18,0)}${fin(0,18)}</g>${expired?'<text x="12.5" y="14" text-anchor="middle" font-size="3.4" font-family="system-ui" font-weight="700" fill="#17201D">Expired</text>':''}</svg>`;
}

   <label class="opt"><input type="radio" name="method" id="method-show" value="show" data-change="l-method" ${l.method==='show'?'checked':''}><span><b>This device shows the QR</b><span class="d">The other device scans it.</span></span></label>
   <label class="opt"><input type="radio" name="method" id="method-scan" value="scan" data-change="l-method" ${l.method==='scan'?'checked':''}><span><b>This device scans</b><span class="d">The other device shows the QR.</span></span></label></div></fieldset>
  ${role==='new'?field('Name for this device','link.label',{hint:'Your existing device will show this name so you can recognise it.',bad:!!l.err&&/name/i.test(l.err)}):''}

  <button class="btn pri">Continue</button></form>`;
 }
 else if(l.step==='qr'&&show){const exp=l.remaining<=0;

  <div class="qrbox">${qrSvg(l.seed,exp)}<div class="small" style="text-align:center">${exp?'Expired':`Valid for <time id="qr-time"><b>${mmss(l.remaining)}</b></time> · one use`}</div>
   <div class="progress" style="width:100%;max-width:250px;margin:0"><i id="qr-bar" style="width:${Math.max(0,l.remaining/3)}%"></i></div></div>
  ${exp?`<div class="stack" style="margin-top:14px"><p>Codes stop working after 5 minutes so a photo of one is useless later. Nothing was shared.</p><button class="btn pri" data-act="l-newqr" data-fk="l-newqr">Show a new QR code</button></div>`:`<div style="margin:14px 0"><p class="ink"><span class="dot pulse"></span>Waiting for the other device to scan…</p>${directions(role,'show')}</div>`}
  <div class="row" style="margin-top:14px"><button class="btn" data-act="l-cancel" data-fk="l-cancel">Cancel</button></div>`;
 }
 else if(l.step==='qr'){const cam=S.sim.cam;
  b=`<h2 tabindex="-1">Scan the QR on the ${role==='existing'?'new device':'existing device'}</h2>`;
  if(cam==='ask')b+=`<p>Tinline needs the camera once to read the QR. Photos aren't taken or kept.</p><div class="view" aria-hidden="true">${ic('camera','style="width:36px;height:36px"')}</div><div class="row" style="margin-top:14px"><button class="btn pri" data-act="l-cam" data-fk="l-cam">${ic('camera')}Allow camera</button><button class="btn" data-act="l-manual" data-fk="l-manual">Enter a code instead</button></div>`;
  else if(cam==='denied')b+=`<div class="warn" role="alert" style="margin-bottom:14px">${ic('alert')}<p><b>Camera access is off.</b> You can still link. Pick one of these:</p></div><div class="stack">
   <button class="bigbtn" data-act="l-flip" data-fk="l-flip">${ic('arrow')}<span><b>Show a QR on this device instead</b><span class="d">The other device scans it.</span></span></button>
   <button class="bigbtn" data-act="l-manual" data-fk="l-manual">${ic('key')}<span><b>Type the link code</b><span class="d">Shown under the QR on the other device.</span></span></button>
   <button class="bigbtn" data-act="l-settings" data-fk="l-settings">${ic('camera')}<span><b>Allow camera in settings</b><span class="d">Opens system settings.</span></span></button></div>`;
  else b+=`<div class="view" role="img" aria-label="Simulated camera view. No camera is used."><i></i><i></i><i></i><i></i></div><p class="small" style="text-align:center;margin-top:10px">Hold steady until the code fills the frame.</p>
   <div class="row" style="justify-content:center"><button class="btn tx" data-act="l-manual" data-fk="l-manual">Enter a code instead</button></div>`;
  if(l.showManual||l.err)b+=`<form data-form="l-code" class="stack" style="margin-top:14px" novalidate><div><label class="f" for="f-link-manual">Link code</label><input id="f-link-manual" type="text" data-bind="link.manual" value="${esc(l.manual)}" autocomplete="off" autocapitalize="characters" spellcheck="false" ${l.err?'class="bad" aria-invalid="true" aria-describedby="l-err"':''}><div class="fhint">Starts with <code>OSVL1-</code>. Type it in; nothing is read from your clipboard.</div></div>${l.err?err(l.err,'l-err'):''}<div class="row"><button class="btn pri">Use code</button></div></form>`;
  b+=`<div class="row" style="margin-top:14px"><button class="btn" data-act="l-cancel" data-fk="l-cancel">Cancel</button></div>`;
 }
 else if(l.step==='verify'){const other=S.sim.codes==='match'?'483 291':'917 204';
  b=`<h2 tabindex="-1">Check the code matches</h2><p>Both screens should show the same 6 digits. This catches someone who photographed the QR and scanned it first.</p>
  <div class="code" role="img" aria-label="Your code: 4, 8, 3, 2, 9, 1">483 291</div>
  ${role==='existing'?`<p class="small" style="margin-top:12px">Request from <b>${lab}</b>. Is that the device in your hand?</p>`:''}
  <div class="row" style="margin-top:14px"><button class="btn pri" data-act="l-match" data-fk="l-match">${role==='existing'?'Codes match':'Codes match, wait for approval'}</button><button class="btn out-dng" data-act="l-nomatch" data-fk="l-nomatch">They don't match</button></div>`;
 }
 else if(l.step==='authorize'){
  b=`<h2 tabindex="-1">Approve ${lab}</h2><div class="warn" style="margin-bottom:14px">${ic('alert')}<p>Approving sends your recovery phrase, your whole identity, to <b>${lab}</b>. It will be able to call, chat and approve more devices as you. This is as serious as showing the phrase itself.</p></div>
  <form data-form="l-approve" class="stack" novalidate><div><label class="f" for="f-link-pass">Your passphrase</label><input id="f-link-pass" type="password" data-bind="link.pass" value="${esc(l.pass)}" autocomplete="off" ${l.err?'class="bad" aria-invalid="true" aria-describedby="l-err"':''}></div>${l.err?err(l.err,'l-err'):''}
  <div class="row"><button class="btn pri">Approve and link</button><button type="button" class="btn" data-act="l-cancel" data-fk="l-cancel">Don't link</button></div></form>`;
 }
 else if(l.step==='waiting'){
  b=`<h2 tabindex="-1">Waiting for approval</h2><p class="ink"><span class="dot pulse"></span>Your existing device is asking you to approve <b>${lab}</b> with your passphrase.</p><p>Nothing has been copied to this device yet. You can stop at any time.</p>
  <div class="row" style="margin-top:14px"><button class="btn" data-act="l-cancel" data-fk="l-cancel">Cancel</button></div>`;
 }
 else if(l.step==='transfer'){
  b=`<h2 tabindex="-1">Linking ${lab}</h2><p>Keep both devices near you and on.</p><ul class="xl" id="xfer" aria-label="Linking progress">${xferList()}</ul><div class="row"><button class="btn" data-act="l-cancel" data-fk="l-cancel">Stop linking</button></div>`;
 }
 else if(l.step==='done'){
  b=`<h2 tabindex="-1">${lab} is linked</h2>
  <p>${role==='existing'?`<b>${lab}</b> now has your account. It starts syncing contacts, chats and call history whenever both devices are online together.`:`This device now has your account. It starts syncing contacts, chats and call history from your existing device.`}</p>
  <p>Contacts stop and start ringing devices as they receive your updated device list. Contacts who are offline catch up when they're next reachable.</p>
  <div class="row"><button class="btn pri" data-act="l-todevices" data-fk="l-todevices">See my devices</button><button class="btn" data-act="l-restart">Link another</button></div>`;
 }
 else{const R=LINKFAIL(l);
  b=`<h2 tabindex="-1">${R.title}</h2><div class="warn" style="margin-bottom:14px">${ic('alert')}<p>${R.body}</p></div><p class="ink">${R.safe}</p><div class="row"><button class="btn pri" data-act="l-retry" data-fk="l-retry">Try again</button><button class="btn" data-act="l-restart">Back to start</button></div>`;
 }
 const wide=l.step==='choose';
 return `<div class="card ${wide?'':'narrow'}">${b}</div>`+notes([
  ['e','The QR is a bearer secret: 5-minute expiry, single use, shown in person. Wrong secret burns it.'],
  ['e','Both screens show a 6-digit code; the existing device must confirm it and then authorise with passphrase or device lock.'],
  ['e','Linking transfers your recovery phrase. A linked device is a full peer of your identity.'],
  ['e','Cancelling before the phrase is sent leaves nothing on the new device. A crash after import leaves a valid account that appears in the list at the next sync.'],
  ['p','The wording, the explicit camera-denied fallbacks (show QR instead, type the code), the "wait for approval" screen on the new device, and the failure copy are proposals.']]);
};
function LINKFAIL(l){
 const sent=l.t>=1;
 const M={
  expired:{title:'That code expired',body:'Codes last 5 minutes and work once, so an old photo of one is useless.',safe:'Nothing was shared.'},
  used:{title:'That code was already used',body:'Each QR works once. If you did not scan it yourself, someone else may have had a look at it.',safe:'Nothing was shared. Make a fresh code and try again.'},
  mismatch:{title:"The codes didn't match",body:"Linking was stopped and that QR is now burned. This can happen when someone photographed the QR and scanned it before you.",safe:'Nothing was shared. If this was unexpected, try again somewhere private.'},
  declined:{title:"Your existing device didn't approve",body:'The request was refused or timed out on the existing device.',safe:'Nothing was copied to this device.'},
  dropped:{title:'Connection lost',body:'Linking did not finish.',safe:sent?'The account may already be on the new device even though it is not in your list yet. It will appear once both devices are online together. If you do not want that device to have your account, unlink it as soon as it shows up.':'Nothing was copied before the connection dropped.'},
  cancelled:{title:'Linking stopped',body:'You stopped linking.',safe:sent?'Your account may already be on the new device. Check Linked devices and unlink it if you did not mean to link it.':'Nothing was copied.'}};
 return M[l.reason]||M.cancelled;
}

/* DEVICES */
V.devices=()=>{
 if(S.removedHere)return `<div class="card narrow"><h2 tabindex="-1">No account on this device</h2><p>Your other devices still have your account and data. To come back, restore from your recovery phrase, or link from one of them.</p><div class="row"><button class="btn pri" data-act="dv-phrase">Restore from phrase</button><button class="btn" data-act="s-link">Link from a device</button></div></div>`;
 const D=S.devices,only=D.length===1;
 return `<div class="card"><div class="hd"><div><h2 tabindex="-1">My devices</h2><p>Names are private to your devices. Contacts never see them.</p></div><button class="btn pri sm" data-act="dv-link" data-fk="dv-link">${ic('plus')}Link a device</button></div>
 <ul class="dlist" aria-label="Linked devices">${D.map(d=>`<li><div class="ava">${ic(d.kind)}</div><div class="info1"><b>${esc(d.name)}${d.here?'<span class="pill">This device</span>':''}</b><span class="small"><span class="dot ${d.online?'':'off'}"></span>${d.online?'Online':'Offline · '+esc(d.seen)}</span>${d.stale?'<div class="small" style="color:var(--warn-ink)">Not seen for a long time. If you no longer have it, unlink it.</div>':''}</div>
  <div class="row"><button class="btn sm" data-act="dv-rename" data-id="${d.id}" data-fk="rn-${d.id}" aria-label="Rename ${esc(d.name)}">Rename</button><button class="btn sm out-dng" data-act="dv-unlink" data-id="${d.id}" data-fk="ul-${d.id}" aria-label="${d.here?'Remove account from this device':'Unlink '+esc(d.name)}">${d.here?'Remove':'Unlink'}</button></div></li>`).join('')}</ul>
 ${only?`<div class="warn" style="margin-top:8px">${ic('info')}<p>This is the only device with your account. Link another to keep a copy of your contacts and chats. Your recovery phrase brings back your identity, but not your chats.</p></div>`:''}</div>
 <div class="info">${ic('shield')}<p>Unlinking stops syncing and ringing. It is not a lock. Anyone with your recovery phrase can still act as you. Only moving to a new identity fully cuts a device off.</p></div>`+notes([
  ['e','Unlink = stop sync and ringing for that device, and contacts stop dialing it. It is not cryptographic revocation.'],
  ['e','Unlinking needs local authorisation (passphrase or device lock). The target is told if reachable; delivery is best effort.'],
  ['e','Labels stay private to your own devices.'],
  ['p','"Not seen for a long time" nudge (30+ days), the offline wording, and the single-device explainer are proposals.'],
  ['p','A cap on linked devices is still an open question (5 proposed, 8 is the current technical limit).']]);
};

/* ACCOUNTS */
V.accounts=()=>{
 const A=S.acct,cur=A.list.find(a=>a.id===A.cur);
 return `<div class="card"><div class="hd"><div><h2 tabindex="-1">Accounts on this device</h2><p>Only one account is online here at a time.</p></div><button class="btn sm" data-act="ac-add" data-fk="ac-add">${ic('plus')}Add account</button></div>
 <ul class="dlist" aria-label="Accounts">${A.list.map(a=>{const on=a.id===A.cur,dr=A.drafts[a.id];return `<li><span class="t-avatar av44 ${hue(a.name)}" aria-hidden="true">${esc(inits(a.name))}</span><div class="info1"><b>${esc(a.name)}${on?'<span class="pill">Active</span>':''}</b><span class="small"><span class="dot ${on?'':'off'}"></span>${on?'Online on this device':'Not online here, so calls won\'t ring this device'}${dr?' · Draft saved':''}</span></div>${on?'':`<button class="btn sm" data-act="ac-switch" data-id="${a.id}" data-fk="sw-${a.id}" aria-label="Switch to ${esc(a.name)}">Switch</button>`}</li>`}).join('')}</ul>
 <div style="border-top:1px solid var(--hairline);margin-top:8px;padding-top:16px"><label class="f" for="ac-draft">Draft to Sam, as ${esc(cur.name)}</label><textarea id="ac-draft" data-draft="1" placeholder="Message">${esc(A.drafts[A.cur])}</textarea>
 <div class="fhint" id="ac-saved">${A.drafts[A.cur]?'Saved on this device.':'Nothing to save yet.'}</div></div></div>`+notes([
  ['e','Only the selected account is online per install. Each account has its own storage and passphrase; switching drops the earlier account\'s secrets.'],
  ['e','Adding an account never replaces an existing one.'],
  ['p','Drafts are saved per account on this device, return when you switch back, and are not synced to other devices.'],
  ['p','Switching during a call asks you to end the call first. The earlier boards left reject-vs-end open.'],
  ['p','Calls to an offline-here account still ring its other linked devices; this follows the device-list model but isn\'t shown anywhere yet.']]);
};

/* ---------- timers ---------- */
function qrTick(){const l=S.link;l.remaining--;
 if(l.remaining===60)say('One minute left on this QR code.');
 if(l.remaining<=0){clearInterval(timers.qr);say('The QR code expired.');render('#panel h2');return}
 const t=$('#qr-time b');if(t)t.textContent=mmss(l.remaining);const bar=$('#qr-bar');if(bar)bar.style.width=l.remaining/3+'%'}
function rvTick(){const s=S.setup;s.left--;if(s.left<=0){s.revealed=false;say('Recovery words hidden.');render('#rv-focus-fallback');const b=$('[data-fk=reveal]');if(b)b.focus();return}const e=$('#rv-left');if(e)e.textContent=s.left}
function lockTick(){const u=S.unlock;u.wait--;if(u.wait<=0){say('You can try your passphrase again.');render('#u-pass');return}const e=$('#lock-left');if(e)e.textContent=u.wait}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.setup.revealed){S.setup.revealed=false;if(S.tab==='setup')render(null,true)}});

/* ---------- link flow helpers ---------- */
function failLink(reason){const l=S.link;l.run++;l.reason=reason;l.step='failed';render();say({expired:'That code expired.',used:'That code was already used.',mismatch:"Codes didn't match. Linking stopped.",declined:'Not approved. Nothing was copied.',dropped:'Connection lost.',cancelled:'Linking stopped.'}[reason])}
function startQr(){const l=S.link;l.step='qr';l.err='';l.showManual=false;l.manual='';l.remaining=300;l.seed=(l.seed*31+7)%997;render()}
function scanOutcome(){const o=S.sim.scan;if(o==='good'){S.link.step='verify';render();say('Connected. Check the 6-digit codes match.');}else if(o==='expired'){if(S.link.method==='show'){S.link.remaining=0;render('#panel h2');say('The QR code expired.')}else failLink('expired')}else failLink('used')}
function startTransfer(){const l=S.link,id=++l.run;l.step='transfer';l.t=0;render();const tick=()=>{if(l.run!==id||l.step!=='transfer')return;
  if(l.t===2&&S.sim.net==='drop'){failLink('dropped');return}
  l.t++;if(l.t>=XFER.length){finishLink();return}
  const x=$('#xfer');if(x)x.innerHTML=xferList();setTimeout(tick,1000)};
 setTimeout(tick,1000)}
function finishLink(){const l=S.link;l.step='done';l.run++;
 if(l.role==='existing'&&!S.devices.some(d=>d.name===l.label))S.devices.push({id:'n'+Date.now(),name:l.label,kind:'tablet',online:true,seen:'Online now'});
 render();say(l.label+' linked (simulated).')}
function cancelLink(){const l=S.link;
 const sent=l.step==='transfer'&&l.t>=1;
 dlg({title:'Stop linking?',body:sent?`<p>Your account may already be on the other device. If you stop now it can still end up in your list. Check <b>My devices</b> afterwards and unlink it if you didn't want it.</p>`:`<p>Nothing has been copied yet. You can start again any time; the current code won't work a second time.</p>`,
  actions:[{label:'Keep linking'},{label:'Stop linking',cls:'out-dng',run:()=>{l.run++;l.reason='cancelled';if(sent){l.step='failed'}else{l.step='choose';l.err=''}render();say(sent?'Linking stopped. Check My devices.':'Linking cancelled. Nothing was copied.')}}],focus:'button[data-i="0"]'});
}

/* ---------- actions ---------- */
const A={
 tab:b=>go(b.dataset.v),
 /* setup */
 's-path':b=>{S.setup.path=b.dataset.v;S.setup.step='name';S.setup.err=null;render()},
 's-link':()=>{S.link.role='new';S.link.step='choose';go('link')},
 's-back':()=>{const s=S.setup,o=s.path==='restore'?['welcome','name','enter','protect','done']:['welcome','name','phrase','check','protect','done'];s.step=o[Math.max(0,o.indexOf(s.step)-1)];s.revealed=false;s.err=null;render()},
 's-suggest':b=>{S.setup.device=b.dataset.v;render('#f-setup-device')},
 's-reveal':()=>{const s=S.setup;s.revealed=!s.revealed;s.left=30;render('[data-fk=reveal]');say(s.revealed?'Recovery words shown. They hide in 30 seconds.':'Recovery words hidden.')},
 's-again':()=>{S.setup.step='phrase';S.setup.err=null;render()},
 's-fill':()=>{S.setup.restore=WORDS.join(' ');render('#f-restore');say('Example words filled in.')},
 's-tolink':()=>{S.link.role=S.setup.path==='restore'?'new':'existing';S.link.step='choose';go('link')},

 's-next':()=>{
  const s=S.setup;s.err=null;
  if(s.step==='name'){const e={};if(!s.acct.trim())e.acct='Enter the name contacts will see.';else if(s.acct.length>32)e.acct='Keep it under 32 characters.';if(!s.device.trim())e.device='Name this device so you can recognise it later.';else if(s.device.length>32)e.device='Keep it under 32 characters.';
   if(e.acct||e.device){s.err=e;render(e.acct?'#f-setup-acct':'#f-setup-device');return}
   s.step=s.path==='restore'?'enter':'phrase';render();return}
  if(s.step==='phrase'){if(!s.saved){s.err={phrase:'Tick the box once you have written the words down.'};render('[data-bind-check="setup.saved"]');return}s.revealed=false;s.step='check';render();return}
  if(s.step==='check'){const e={};const ok=[s.a,s.b].map((v,i)=>v.trim().toLowerCase()===WORDS[CHK[i]]);
   if(!ok[0]||!ok[1]){e.a=!ok[0];e.b=!ok[1];e.msg=`${!ok[0]&&!ok[1]?'Neither word matches':'Word #'+(CHK[!ok[0]?0:1]+1)+" doesn't match"}. Check your paper copy, or show the words again. You can try as many times as you like.`;s.err=e;render(!ok[0]?'#f-setup-a':'#f-setup-b');return}
   s.step='protect';render();return}
  if(s.step==='enter'){const w=s.restore.trim().split(/\s+/).filter(Boolean);let m='';
   if(!w.length)m='Enter your 24 words.';else if(w.length!==24)m=`You entered ${w.length} word${w.length===1?'':'s'}. A recovery phrase has 24.`;else if(w.some(x=>!/^[a-z]+$/i.test(x)))m='Words contain only letters. Check for stray punctuation or numbers.';else if(w.join(' ').toLowerCase()!==WORDS.join(' '))m="These words don't make a valid phrase (the built-in check failed). Check the spelling and order. In this prototype only the example words pass.";
   if(m){s.err={msg:m};render('#f-restore');return}
   s.step='protect';render();return}
  if(s.step==='protect'){if(s.mode==='pass'){const e={};if(s.p1.length<8){e.p1=true;e.msg='Use at least 8 characters.'}else if(s.p1!==s.p2){e.p2=true;e.msg="The two passphrases don't match.";}
    if(e.msg){s.err=e;render(e.p1?'#f-setup-p1':'#f-setup-p2');return}}
   s.step='done';render();say(s.path==='restore'?'Identity restored (simulated).':'Account created (simulated).')}
 },
 /* unlock */
 'u-show':()=>{S.unlock.show=!S.unlock.show;render('[data-fk=u-show]')},

 'u-device':()=>dlg({title:'Unlock Tinline',body:'<p>Touch the fingerprint sensor, look at the screen, or enter your screen lock.</p>',actions:[{label:'Cancel',run:()=>{say('Device lock cancelled. Your passphrase still works.')}},{label:'Confirm',cls:'pri',run:()=>{S.unlock.open=true;S.unlock.via='device lock';render();say('Unlocked (simulated).');}}]}),
 'u-forgot':()=>dlg({title:'Forgot your passphrase?',body:`<p>It can't be reset: there's no server that holds it, and that's what keeps your account private.</p><ul><li><b>Device lock</b>, if you set it up, opens the app without it.</li><li><b>Your recovery phrase</b> brings back your identity on this device. Chats come from another linked device; if none exists, they can't be restored.</li></ul><p>Nothing is erased unless you choose to.</p>`,actions:[{label:'Close'},{label:'Restore from phrase',cls:'pri',run:()=>{S.setup.path='restore';S.setup.step='name';go('setup');}}]}),

 'l-settings':()=>dlg({title:'Tinline app settings',body:'<p>Turn on Camera, then come back.</p>',actions:[{label:'Stay off'},{label:'Turn camera on',cls:'pri',run:()=>{S.sim.cam='granted';render('#panel h2');say('Camera allowed (simulated).')}}]}),

 /* devices */
 'dv-link':()=>{S.link.step='choose';S.link.role='existing';go('link')},
 'dv-restore':()=>{S.removedHere=false;render();say('Demo restored.')},
 'dv-phrase':()=>{S.setup=fresh().setup;S.setup.path='restore';S.setup.step='name';go('setup')},
 'dv-rename':b=>{const d=S.devices.find(x=>x.id===b.dataset.id);
  dlg({title:'Rename device',body:`<label class="f" for="rn-in">Device name</label><input id="rn-in" type="text" value="${esc(d.name)}" maxlength="40" autocomplete="off"><div class="fhint">Only your own devices see this.</div>`,focus:'#rn-in',
   actions:[{label:'Cancel'},{label:'Save',cls:'pri',run:dd=>{const i=dd.querySelector('#rn-in'),v=i.value.trim();
    if(!v){dErr(dd,'Enter a name.',i);return false}
    if(S.devices.some(x=>x.id!==d.id&&x.name.toLowerCase()===v.toLowerCase())){dErr(dd,'Another device already has that name.',i);return false}
    d.name=v;render(null,true);say('Renamed to '+v+'.')}}]});
  dlgFocusSelect();},
 'dv-unlink':b=>{const d=S.devices.find(x=>x.id===b.dataset.id);
  if(d.here){const lastOne=S.devices.length===1;
   dlg({title:'Remove this account from this device?',body:`<ul><li>${lastOne?'This is your <b>only</b> device with this account. Your chats and contacts are not stored anywhere else.':'Chats and contacts stay on your other devices.'}</li><li>Unsent drafts and anything not yet synced are deleted here.</li><li>You can restore the identity later with your recovery phrase.</li></ul>${passField('rm-pass')}${lastOne?'<label class="opt" style="margin-top:12px"><input type="checkbox" id="rm-ack"><span><b>I have my recovery phrase</b><span class="d">Without it or another device, this account is gone.</span></span></label>':''}`,
    focus:'button[data-i="0"]',actions:[{label:'Keep it'},{label:'Remove account',cls:'dng',run:dd=>{const p=dd.querySelector('#rm-pass');
     if(p.value!==PASS){dErr(dd,'That passphrase is not right. Try again.',p);return false}
     const ack=dd.querySelector('#rm-ack');if(ack&&!ack.checked){dErr(dd,'Confirm you have your recovery phrase first.');ack.focus();return false}
     dd.dataset.keep=1;S.removedHere=true;render();say('Account removed from this device (simulated).')}}]});return}
  dlg({title:`Unlink ${esc(d.name)}?`,body:`<p><b>What happens</b></p><ul><li>It stops syncing and stops ringing.</li><li>Contacts stop dialing it once they get your updated device list.</li>${d.online?'<li>It appears online. Tinline will ask it to lock and delete this account\'s data. The request may not arrive, and a modified app can ignore it.</li>':'<li>It is offline, so it can\'t be told yet. It keeps your account and data until it reconnects, and a device someone controls can ignore the request.</li>'}</ul><div class="warn" style="margin:0 0 4px">${ic('alert')}<p><b>This is not a lock.</b> Anyone with your recovery phrase, or this device's unlock, can still act as you. If it was lost or stolen, the only complete fix is moving to a new identity.</p></div>${passField('ul-pass','Your passphrase to confirm')}`,
   focus:'button[data-i="0"]',actions:[{label:'Cancel'},{label:'Unlink',cls:'dng',run:dd=>{const p=dd.querySelector('#ul-pass');
    if(p.value!==PASS){dErr(dd,'That passphrase is not right. Nothing was unlinked. Try again.',p);return false}
    dd.dataset.keep=1;S.devices=S.devices.filter(x=>x.id!==d.id);render();say(d.name+' unlinked (simulated).')}}]})},
 /* accounts */
 'ac-add':()=>dlg({title:'Add an account',body:'<p>Adding an account never replaces the ones you have. Each has its own passphrase and storage.</p>',focus:'button[data-i="0"]',actions:[{label:'Cancel'},{label:'Restore or create',run:()=>{S.setup=fresh().setup;go('setup')}},{label:'Link from a device',cls:'pri',run:()=>{S.link.role='new';S.link.step='choose';go('link')}}]}),
 'ac-switch':b=>{const A2=S.acct,to=A2.list.find(a=>a.id===b.dataset.id),from=A2.list.find(a=>a.id===A2.cur),dr=A2.drafts[A2.cur];
  const call=A2.call;
  dlg({title:`Switch to ${esc(to.name)}?`,body:`${call?`<div class="warn" style="margin-bottom:12px">${ic('alert')}<p>You're on a call as ${esc(from.name)}. Switching ends it for everyone on the call.</p></div>`:''}<ul><li><b>Only one account is online here.</b> While ${esc(to.name)} is active, calls to ${esc(from.name)} won't ring this device.</li><li><b>Your draft is kept.</b> ${dr?'The message to Sam is saved for '+esc(from.name)+' and is waiting here when you switch back.':'Drafts you start are saved per account and wait for you here.'} Drafts stay on this device.</li><li>${esc(to.name)} has its own passphrase.</li></ul>${passField('sw-pass',esc(to.name)+' passphrase')}`,
   focus:'#sw-pass',actions:[{label:'Stay on '+esc(from.name)},{label:call?'End call and switch':'Switch',cls:call?'dng':'pri',run:dd=>{const p=dd.querySelector('#sw-pass');
    if(p.value!==PASS){dErr(dd,'That passphrase is not right. You are still on '+from.name+'. Try again.',p);return false}
    A2.cur=to.id;A2.call=false;dd.dataset.keep=1;render();say(`Switched to ${to.name}.${dr?' '+from.name+"'s draft is saved.":''}`)}}]})}
};
function dlgFocusSelect(){const i=document.querySelector('dialog #rn-in');if(i)i.select()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(b.closest('#drawer')&&!docked())setDrawer(false);const f=A[b.dataset.act];if(f)f(b,e)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.bind)bindVal(t.dataset.bind,t.value);
 if(t.dataset.draft){S.acct.drafts[S.acct.cur]=t.value;const s=$('#ac-saved');if(s)s.textContent=t.value?'Saved on this device.':'Nothing to save yet.'}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.bindCheck){bindVal(t.dataset.bindCheck,t.checked);if(t.dataset.bindCheck==='acct.call')say(t.checked?'Simulating a call in progress.':'Call ended.')}
 const c=t.dataset.change;if(!c)return;
 if(c==='s-mode'){S.setup.mode=t.value;render('input[name=mode]:checked')}
 if(c==='l-role'){S.link.role=t.value;S.link.err='';render('#role-'+t.value)}
 if(c==='l-method'){S.link.method=t.value;S.link.err='';render('#method-'+t.value)}
 if(c==='sim'){S.sim[t.dataset.k]=t.value;render(`input[name="sim-${t.dataset.k}"]:checked`)}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;
 if(f==='u-submit'){const u=S.unlock;if(u.pass===PASS){u.open=true;u.via='';u.tries=0;u.err='';u.pass='';render();say('Unlocked (simulated).');return}
  u.tries++;u.pass='';
  if(u.tries>=3){u.wait=30;u.err='';render('#u-pass');say('Too many tries. Wait 30 seconds before trying again.');return}
  u.err=`That passphrase isn't right. ${3-u.tries} ${3-u.tries===1?'try':'tries'} left before a short wait.`;u.shake=true;render('#u-pass');u.shake=false;say('Wrong passphrase.')}
 if(f==='l-start'){const l=S.link;
  if(!l.role){l.err='Choose which device you are holding first.';render('#role-existing');return}
  if(!l.method){l.err='Choose which device has the camera.';render('#method-show');return}
  if(l.role==='new'&&!l.label.trim()){l.err='Name this device so your existing device can show it.';render('#f-link-label');return}
  l.err='';startQr();}
 if(f==='l-code'){const l=S.link,v=l.manual.trim().toUpperCase();
  if(!v){l.err='Enter the code shown under the QR.';render('#f-link-manual');return}
  if(!/^OSVL1-[A-Z0-9-]{4,}$/.test(v)){l.err="That doesn't look like a link code. It starts with OSVL1- and has no spaces.";render('#f-link-manual');return}
  l.err='';l.showManual=false;
  if(v.includes('EXPIRED')){failLink('expired')}else if(v.includes('USED')){failLink('used')}else{l.step='verify';render();say('Connected. Check the 6-digit codes match.')}}
 if(f==='l-approve'){const l=S.link;if(l.pass!==PASS){l.bad++;l.err='That passphrase is not right. Nothing was shared. Try again.';render('#f-link-pass');return}l.err='';l.pass='';startTransfer()}
});
$('#reset').onclick=()=>{if(!docked())setDrawer(false);S=fresh();go('setup');say('Demo reset.')};
/* simulation drawer: docked beside the page on wide screens, overlay below */
function docked(){return matchMedia('(min-width:1100px)').matches}
function setDrawer(open,focus){const d=$('#drawer');d.hidden=!open;$('#scrim').hidden=!open||docked();$('#simtog').setAttribute('aria-expanded',String(open));document.body.classList.toggle('dr-open',open);if(focus)(open?$('#drawer-x'):$('#simtog')).focus()}
$('#simtog').onclick=()=>setDrawer($('#drawer').hidden,true);
$('#drawer-x').onclick=()=>setDrawer(false,true);
$('#scrim').onclick=()=>setDrawer(false,true);
document.addEventListener('keydown',e=>{const d=$('#drawer');if(e.key!=='Escape'||d.hidden||document.querySelector('dialog[open]'))return;if(d.contains(e.target)||!docked()){e.preventDefault();setDrawer(false,true)}});
function simStep(){
 const t=S.tab,s=S.setup,u=S.unlock,l=S.link;let h='';
 const B=(a,lab)=>`<button type="button" class="btn" data-act="${a}" data-fk="${a}">${lab}</button>`;
 if(t==='setup'){
  if(s.step==='phrase')h='<p>Example words only, not a real phrase.</p>';
  else if(s.step==='check')h=`<p>Word #${CHK[0]+1} is <code>${WORDS[CHK[0]]}</code>, word #${CHK[1]+1} is <code>${WORDS[CHK[1]]}</code>. Try a wrong one first.</p>`;
  else if(s.step==='enter')h=`<p>Only the example words pass the check. Nothing is read from your clipboard.</p><div class="row">${B('s-fill','Fill with the example words')}</div>`;
 }else if(t==='unlock'&&!u.open){h='<p>Try a wrong passphrase to see the retry state. After 3 misses a short wait starts.</p>'+(u.wait>0?`<div class="row">${B('u-skip','Skip the wait')}</div>`:'')}
 else if(t==='link'){
  if(l.step==='qr'&&l.method==='show'&&l.remaining>0)h=`<div class="row">${B('l-simscan','The other device scans now')}${B('l-expire','Let this QR expire')}</div>`;
  else if(l.step==='qr'&&l.method!=='show'){if(S.sim.cam==='granted')h=`<div class="row">${B('l-simscan','A QR is read')}</div>`;if(l.showManual||l.err)h+=`<p>Codes containing EXPIRED or USED fail that way.</p><div class="row">${B('l-example','Fill example code')}</div>`}
  else if(l.step==='verify'){const o=S.sim.codes==='match'?'483 291':'917 204';h=`<p>${l.role==='existing'?esc(l.label):'Your existing device'} shows:</p><p class="dr-code" role="img" aria-label="Other device code: ${o.replace(/\D/g,'').split('').join(', ')}">${o}</p>`}
  else if(l.step==='waiting')h=`<div class="row">${B('l-approved','Existing device approves')}${B('l-declined','Existing device refuses')}</div>`;
 }else if(t==='devices'&&S.removedHere)h=`<div class="row">${B('dv-restore','Restore the demo')}</div>`;
 else if(t==='accounts'){const cur=S.acct.list.find(a=>a.id===S.acct.cur);h=`<p>Type a draft, switch accounts and back: the draft is kept.</p><label class="opt"><input type="checkbox" data-bind-check="acct.call" ${S.acct.call?'checked':''}><span><b>On a call as ${esc(cur.name)}</b><span class="d">Switching during a call must be handled, not silently dropped.</span></span></label>`}
 return h?'<h3>This screen</h3>'+h:'';
}
const root=document.documentElement,tb=$('#theme');
function paintTheme(){const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches,l=dark?'Light theme':'Dark theme';tb.setAttribute('aria-pressed',String(dark));tb.setAttribute('aria-label',l);tb.title=l}
tb.onclick=()=>{const dark=tb.getAttribute('aria-pressed')==='true';root.dataset.theme=dark?'light':'dark';paintTheme()};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(!root.dataset.theme)paintTheme()});
paintTheme();
const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))S.tab=h;
render(null,true);
</script></body></html>
