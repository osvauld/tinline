# One shared integration binary; each module remains independently runnable.
# Explicit --peer nixos on suite run also supports coordinators without step placement.
version = 1

[suites.core-it]
notes = "Build once, then run every core integration test module on nixos."
tools = ["cargo"]

[[suites.core-it.steps]]
name = "build"
command = ["cargo", "test", "--profile", "fasttest", "-p", "p2pcore", "--features", "dev-tools", "--test", "it", "--no-run"]
placement = "nixos"
timeout_secs = 7200

[[suites.core-it.steps]]
name = "accounts"
command = ["cargo", "test", "--profile", "fasttest", "-p", "p2pcore", "--features", "dev-tools", "--test", "it", "--no-fail-fast", "--", "accounts::"]
after = ["build"]
placement = "nixos"
timeout_secs = 3600

[[suites.core-it.steps]]
name = "blocking_acceptance"
command = ["cargo", "test", "--profile", "fasttest", "-p", "p2pcore", "--features", "dev-tools", "--test", "it", "--no-fail-fast", "--", "blocking_acceptance::"]
after = ["build"]
placement = "nixos"
timeout_secs = 3600

[[suites.core-it.steps]]
name = "call_tokens_acceptance"
command = ["cargo", "test", "--profile", "fasttest", "-p", "p2pcore", "--features", "dev-tools", "--test", "it", "--no-fail-fast", "--", "call_tokens_acceptance::"]
after = ["build"]
placement = "nixos"
timeout_secs = 3600

[[suites.core-it.steps]]
name = "calls"
command = ["cargo", "test", "--profile", "fasttest", "-p", "p2pcore", "--features", "dev-tools", "--test", "it", "--no-fail-fast", "--", "calls::", "--skip", "video_calls::"]
after = ["build"]
placement = "nixos"
timeout_secs = 3600
long = true
light = true
retry_alone = true

[[suites.core-it.steps]]
name = "chat_shards"
command = ["cargo", "test", "--profile", "fasttest", "-p", "p2pcore", "--features", "dev-tools", "--test", "it", "--no-fail-fast", "--", "chat_shards::"]
after = ["build"]
placement = "nixos"
timeout_secs = 3600
retry_alone = true

[[suites.core-it.steps]]
# The long-running 1:1 simulation (crates/core/tests/it/chat_longrun.rs); `CHAT_LONGRUN_DAYS`
# (default 30) sets its length. `--nocapture` keeps its `LONGRUN ...` measurement lines in the log.
name = "chat_longrun"
command = ["cargo", "test", "--profile", "fasttest", "-p", "p2pcore", "--features", "dev-tools", "--test", "it", "--no-fail-fast", "--", "chat_longrun::", "--nocapture"]
after = ["build"]
placement = "nixos"
timeout_secs = 3600
long = true
retry_alone = true

