name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake meson ninja-build clang libclang-dev \
            libgtk-3-dev libasound2-dev libssl-dev libdbus-1-dev libabsl-dev \
            libxkbcommon-dev libxcb1-dev nasm
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/build-cache/p2p_chat/libaom
          key: libaom-${{ runner.os }}-${{ hashFiles('scripts/build_libaom.py') }}
      # Static libaom from the pinned, sha256-verified release tarball (same as release builds).
      - name: Build libaom
        run: |
          prefix="$(python3 scripts/build_libaom.py --target host | tail -n1)"
          echo "AOM_DIR=$prefix" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/build-cache/p2p_chat/libvpx
          key: libvpx-${{ runner.os }}-${{ hashFiles('scripts/build_libvpx.py') }}
      # Static libvpx for the desktop's VP8 (feature vp8, on by default on linux), same pinned source as releases.
      - name: Build libvpx
        run: |
          prefix="$(python3 scripts/build_libvpx.py | tail -n1)"
          echo "VPX_DIR=$prefix" >> "$GITHUB_ENV"
      # The core integration tests start real iroh nodes and use n0's public relays.
      - name: Rust tests
        run: cargo test --workspace --locked --no-fail-fast
      # Tests that count frames per second or mix twelve live calls skip in debug builds (too slow);
      # they run here. Runs even when the debug step failed, so one CI run reports both.
      - name: Timing tests (release)
        if: success() || failure()
        run: cargo test --release --locked -p p2pcore --test video_calls --test group_call
      - name: Group burst (release)
        if: success() || failure()
        run: cargo test --release --locked -p p2pcore --test group_shards a_burst_of_200
      - name: Release upload safeguards
        run: python3 scripts/test_r2_upload.py
