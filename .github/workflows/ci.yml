name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  choose-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.choose.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: choose
        with:
          script: |
            // A PR whose head already passed CI on its push, and whose merge is a fast-forward (the base
            // has nothing of its own), would test the same tree again: skip it. Any other PR is tested.
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              try {
                const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                  ...context.repo, basehead: `${pr.base.sha}...${pr.head.sha}`,
                });
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  ...context.repo, workflow_id: 'ci.yml', event: 'push', head_sha: pr.head.sha,
                  status: 'success', per_page: 100,
                });
                const passed = runs.some(r => r.id !== context.runId);
                const fastForward = cmp.behind_by === 0;
                core.info(`push run passed: ${passed}, fast-forward: ${fastForward}`);
                return !(passed && fastForward);
              } catch (error) {
                core.warning(`Could not check earlier runs; running tests: ${error.message}`);
                return true;
              }
            }
            // Pushes without a matching open PR test the branch.
            if (context.eventName !== 'push') return true;
            try {
              const prs = await github.paginate(github.rest.pulls.list, {
                ...context.repo,
                state: 'open',
                head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
                per_page: 100,
              });
              const covered = prs.some(pr =>
                pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                pr.head.sha === context.sha);
              core.info(covered ? 'Matching open PR: its CI run covers this push.' : 'No matching PR: test this push.');
              return !covered;
            } catch (error) {
              // API trouble must not silently remove test coverage.
              core.warning(`Could not check open PRs; running tests: ${error.message}`);
              return true;
            }

  test:
    needs: choose-tests
    if: needs.choose-tests.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake meson ninja-build clang libclang-dev \
            libgtk-3-dev libasound2-dev libssl-dev libdbus-1-dev libabsl-dev \
            libxkbcommon-dev libxcb1-dev nasm
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/fasttest
          # Refresh the cache when dependencies, profiles, or CI feature selection change.
          key: cargo-workspace-fasttest-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.github/workflows/ci.yml') }}
          restore-keys: cargo-workspace-fasttest-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/build-cache/p2p_chat/libaom
          key: libaom-${{ runner.os }}-${{ hashFiles('scripts/build_libaom.py') }}
      # Static libaom from the pinned, sha256-verified release tarball (same as release builds).
      - name: Build libaom
        run: |
          prefix="$(python3 scripts/build_libaom.py --target host | tail -n1)"
          echo "AOM_DIR=$prefix" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/build-cache/p2p_chat/libvpx
          key: libvpx-${{ runner.os }}-${{ hashFiles('scripts/build_libvpx.py') }}
      # Static libvpx for the desktop's VP8 (feature vp8, on by default on linux), same pinned source as releases.
      - name: Build libvpx
        run: |
          prefix="$(python3 scripts/build_libvpx.py | tail -n1)"
          echo "VPX_DIR=$prefix" >> "$GITHUB_ENV"
      # One profile for all unit, binary, integration, and doc tests avoids a second build tree.
      # This includes timing/capacity/burst tests; debug-only assertions are not enabled.
      # Core integration tests start real iroh nodes and use n0's public relays.
      - name: Rust workspace tests (fasttest)
        run: cargo test --workspace --profile fasttest --locked --no-fail-fast --features p2pcore/dev-tools
      - name: Release upload safeguards
        run: python3 scripts/test_r2_upload.py
