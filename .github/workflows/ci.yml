name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake meson ninja-build clang libclang-dev \
            libgtk-3-dev libasound2-dev libssl-dev libdbus-1-dev libabsl-dev \
            libxkbcommon-dev libxcb1-dev nasm
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # Profile changes must produce a new cache entry, not an immutable hit on the old layout.
          key: cargo-test-fasttest-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: cargo-test-fasttest-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/build-cache/p2p_chat/libaom
          key: libaom-${{ runner.os }}-${{ hashFiles('scripts/build_libaom.py') }}
      # Static libaom from the pinned, sha256-verified release tarball (same as release builds).
      - name: Build libaom
        run: |
          prefix="$(python3 scripts/build_libaom.py --target host | tail -n1)"
          echo "AOM_DIR=$prefix" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/build-cache/p2p_chat/libvpx
          key: libvpx-${{ runner.os }}-${{ hashFiles('scripts/build_libvpx.py') }}
      # Static libvpx for the desktop's VP8 (feature vp8, on by default on linux), same pinned source as releases.
      - name: Build libvpx
        run: |
          prefix="$(python3 scripts/build_libvpx.py | tail -n1)"
          echo "VPX_DIR=$prefix" >> "$GITHUB_ENV"
      # One optimized integration run includes timing/capacity/burst tests that skip in debug.
      # These tests start real iroh nodes and use n0's public relays.
      - name: Core integration tests (fasttest)
        run: cargo test --profile fasttest --locked --no-fail-fast -p p2pcore --features dev-tools --test it
      # Keep ordinary debug-mode coverage without building/running core's integration target again.
      - name: Other workspace tests (debug)
        if: success() || failure()
        run: cargo test --workspace --exclude p2pcore --locked --no-fail-fast
      - name: Core unit and binary tests (debug)
        if: success() || failure()
        run: cargo test --locked --no-fail-fast -p p2pcore --features dev-tools --lib --bins
      - name: Core doc tests (debug)
        if: success() || failure()
        run: cargo test --locked --no-fail-fast -p p2pcore --features dev-tools --doc
      - name: Release upload safeguards
        run: python3 scripts/test_r2_upload.py
