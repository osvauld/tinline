name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake meson ninja-build clang libclang-dev \
            libgtk-3-dev libasound2-dev libssl-dev libdbus-1-dev libabsl-dev \
            libxkbcommon-dev libxcb1-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-
      # The core integration tests start real iroh nodes and use n0's public relays.
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Release upload safeguards
        run: python3 scripts/test_r2_upload.py
