name: Release builds

on:
  workflow_dispatch:
  # Production is the prod branch: every merge to prod builds the release and drafts it as v<workspace version>.
  push:
    branches: [prod]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Validate release version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, subprocess, tomllib
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['workspace']['package']['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Only stable X.Y.Z versions supported by this workflow')
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Tag must match Cargo workspace version')
          if os.environ['GITHUB_REF'] == 'refs/heads/prod':
              # A prod merge without a version bump would re-release an existing tag: refuse early.
              tagged = subprocess.run(['git', 'rev-list', '-n1', f'v{version}'], capture_output=True, text=True)
              if tagged.returncode == 0 and tagged.stdout.strip() != os.environ['GITHUB_SHA']:
                  raise SystemExit(f'v{version} already exists on another commit: bump the workspace version before merging to prod')
          code = subprocess.check_output(['git', 'rev-list', '--count', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={version}\ncode={code}\n')
          PY

  linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake meson ninja-build clang libclang-dev \
            libgtk-3-dev libasound2-dev libssl-dev libdbus-1-dev libabsl-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb1-dev libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libx11-xcb1 libxcursor1 libxi6 libxrandr2 \
            dpkg-dev desktop-file-utils nasm curl
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build tarball, Debian package and AppImage
        run: |
          desktop-file-validate packaging/linux/tinline.desktop
          ./scripts/package_linux_tarball.sh
          ./scripts/package_deb.sh
          ./scripts/package_appimage.sh
      - name: Inspect AppImage without FUSE
        run: |
          IMAGE="$(realpath dist/releases/v${VERSION}/*.AppImage)"
          (cd "$(dirname "$IMAGE")" && sha256sum --check "$(basename "$IMAGE").sha256")
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          cd "$WORK"
          "$IMAGE" --appimage-extract
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/tinline
          test -f squashfs-root/usr/share/doc/tinline/copyright
          LD_LIBRARY_PATH="$WORK/squashfs-root/usr/lib" ldd squashfs-root/usr/bin/tinline | tee "$WORK/libraries.txt"
          ! grep -q 'not found' "$WORK/libraries.txt"
          ! grep -q 'libaom' "$WORK/libraries.txt"
      - name: Inspect and install Debian package on build runner
        run: |
          dpkg-deb --info dist/deb/*.deb
          dpkg-deb --contents dist/deb/*.deb
          sudo apt-get install -y ./dist/deb/*.deb
          ldd /usr/bin/tinline | tee dist/linux-libraries.txt
          ! grep -q 'not found' dist/linux-libraries.txt
          ! grep -q 'libaom' dist/linux-libraries.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/deb/*
            dist/releases/**/*
            dist/linux-libraries.txt
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-24.04
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install native build dependencies and Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang libclang-dev nasm
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Install Rust and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build static libaom per ABI (pinned, sha256-verified source)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          python3 scripts/build_libaom.py --target aarch64-linux-android
          python3 scripts/build_libaom.py --target x86_64-linux-android
          # :app:uniffiBindgen builds p2pcore for the runner itself, which needs a host libaom too.
          prefix="$(python3 scripts/build_libaom.py --target host | tail -n1)"
          echo "AOM_DIR_x86_64_unknown_linux_gnu=$prefix" >> "$GITHUB_ENV"
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing Android release keystore secret'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tinline-release.jks"
      # Two editions (docs/push.md "Editions"): Liberum (no Google code) is the APK on GitHub Releases and the site;
      # Play is the bundle for the Play Store, with the Firebase settings from secrets (optional: without them the
      # Play build is always-on only, so set them before a Play upload).
      - name: Build signed release APK (Liberum) and bundle (Play)
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_GCM_SENDER_ID: ${{ secrets.FIREBASE_GCM_SENDER_ID }}
        run: |
          export ORG_GRADLE_PROJECT_RELEASE_STORE_FILE="$RUNNER_TEMP/tinline-release.jks"
          ./gradlew --no-daemon --console=plain :app:assembleLiberumRelease :app:bundlePlayRelease \
            -PrequireReleaseSigning=true -PversionName="$VERSION" -PversionCode="$VERSION_CODE" \
            -Pabis=x86_64,arm64-v8a
      - name: Verify the Liberum APK has no Google code
        run: python3 scripts/check_no_google.py android/app/build/outputs/apk/liberum/release/app-liberum-release.apk
      - name: Verify APK signature and collect artifacts
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            android/app/build/outputs/apk/liberum/release/app-liberum-release.apk
          mkdir -p dist/android
          cp android/app/build/outputs/apk/liberum/release/app-liberum-release.apk "dist/android/tinline-liberum-v${VERSION}.apk"
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab "dist/android/tinline-play-v${VERSION}.aab"
          cd dist/android
          sha256sum *.apk *.aab > SHA256SUMS
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/tinline-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/android/*
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/prod'
    needs: [version, linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || {
              echo 'Refusing to replace artifacts on a published release'; exit 1;
            }
          else
            # A tag push already has the tag; a prod merge gets it on this commit when the draft is published.
            if [ "$GITHUB_REF_TYPE" = tag ]; then from=(--verify-tag); else from=(--target "$GITHUB_SHA"); fi
            # The release's own notes when docs/releases/<tag>.md exists, else a generic candidate note.
            if [ -f "docs/releases/$TAG.md" ]; then notes=(--notes-file "docs/releases/$TAG.md"); else
              notes=(--notes 'Candidate Linux tarball, Debian package, AppImage, signed Android APK (Tinline Liberum) and Play bundle. Test before publishing. Linux build baseline: Ubuntu 24.04; older distros are not verified.'); fi
            gh release create "$TAG" "${from[@]}" --draft --title "Tinline $TAG" "${notes[@]}"
          fi
          mapfile -d '' files < <(find artifacts -type f -print0)
          gh release upload "$TAG" "${files[@]}" --clobber
