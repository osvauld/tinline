name: Tinline
options:
  bundleIdPrefix: com.osvauld
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # set on the Mac; signing is not configured here
    # The Rust core is built for arm64 only (device + Apple-silicon simulator).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  Tinline:
    type: application
    platform: iOS
    sources:
      - Tinline
      - path: build/generated/p2pcore.swift
      - path: build/generated/present.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osvauld.tinline
        INFOPLIST_FILE: Tinline/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tinline/Tinline.entitlements
    # P2pCore.xcframework + generated Swift come from ios/scripts/build_core.sh (not in Git).
    dependencies:
      - framework: build/P2pCore.xcframework
        embed: false
      # System frameworks the static Rust core links against (security-framework, system-configuration).
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
  TinlineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TinlineTests
    dependencies:
      - target: Tinline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osvauld.tinline.tests
        GENERATE_INFOPLIST_FILE: YES
  TinlineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TinlineUITests
    dependencies:
      - target: Tinline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osvauld.tinline.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tinline
schemes:
  Tinline:
    build:
      targets:
        Tinline: all
  # UI tests only (ios/scripts/run_ui.sh), so the unit-test target is not built with them.
  TinlineUI:
    build:
      targets:
        Tinline: all
        TinlineUITests: [test]
    test:
      config: Debug
      targets:
        - TinlineUITests
