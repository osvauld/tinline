name: Tinline
options:
  bundleIdPrefix: com.osvauld
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # set on the Mac; signing is not configured here
targets:
  Tinline:
    type: application
    platform: iOS
    sources:
      - Tinline
      - path: build/generated/p2pcore.swift
      - path: build/generated/present.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osvauld.tinline
        INFOPLIST_FILE: Tinline/Info.plist
    # P2pCore.xcframework + generated Swift come from ios/scripts/build_core.sh (not in Git).
    dependencies:
      - framework: build/P2pCore.xcframework
        embed: false
