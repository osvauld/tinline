[workspace]
resolver = "2"
members = ["crates/identity", "crates/cryptography", "crates/proto", "crates/audio", "crates/core", "crates/peer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
# Copied from osvauld2 (identity, cryptography @ abcae3d); keep in sync by hand for now.
identity = { path = "crates/identity" }
proto = { path = "crates/proto" }
audio = { path = "crates/audio" }

[profile.release]
lto = "thin"
codegen-units = 4
