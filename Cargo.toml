[workspace]
resolver = "2"
members = ["crates/identity", "crates/cryptography", "crates/proto", "crates/audio", "crates/video", "crates/storage", "crates/gcall-bench", "crates/gcall-core", "crates/crdt", "crates/search-core", "crates/receipts-core", "crates/group-core", "crates/account-model", "crates/video-call-core", "crates/transfer", "crates/core", "crates/peer", "crates/desktop", "crates/tin-icons", "crates/present"]

[workspace.package]
version = "0.1.38"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.23"
# One version of each crypto crate across the workspace (aligned with iroh).
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
aes-gcm = "0.11"
argon2 = "0.6"
ed25519-dalek = "3"
x25519-dalek = { version = "3", features = ["static_secrets"] }
bip39 = "3"
zeroize = { version = "1", features = ["derive"] }
# Copied from osvauld2 (identity, cryptography @ abcae3d); keep in sync by hand for now.
identity = { path = "crates/identity" }
cryptography = { path = "crates/cryptography" }
proto = { path = "crates/proto" }
audio = { path = "crates/audio" }
storage = { path = "crates/storage" }
gcall-core = { path = "crates/gcall-core" }
crdt = { path = "crates/crdt" }
search-core = { path = "crates/search-core" }
receipts-core = { path = "crates/receipts-core" }
group-core = { path = "crates/group-core" }
account-model = { path = "crates/account-model" }
video-call-core = { path = "crates/video-call-core" }
transfer = { path = "crates/transfer" }

# Full debug info made every test binary ~0.5 GB and filled the build-cache disk with a dozen
# agents building at once; line tables still give file:line in panics and backtraces.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4

# Argon2id with the real (64 MiB, t=3, p=4) parameters is unusably slow unoptimised; tests
# and debug runs keep the real parameters and just compile the KDF with optimisations.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
