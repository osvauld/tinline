[workspace]
resolver = "2"
members = ["crates/proto", "crates/audio", "crates/core", "crates/peer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
rand = "0.8"
# Absolute so git worktrees (under .claude/worktrees/) resolve it too.
identity = { path = "/home/abe/osvauld2/identity" }
proto = { path = "crates/proto" }
audio = { path = "crates/audio" }

[profile.release]
lto = "thin"
codegen-units = 4
