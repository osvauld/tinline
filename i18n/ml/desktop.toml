[group_hosts_store_the_group_admin]
text = "ഹോസ്റ്റുകൾ ഗ്രൂപ്പ് സൂക്ഷിക്കുകയും മറ്റുള്ളവർ ഓഫ്‌ലൈനായിരിക്കുമ്പോൾ പോസ്റ്റുകൾ കൈമാറുകയും ചെയ്യുന്നു. അവർ നിങ്ങൾ വിശ്വസിക്കുന്ന അംഗങ്ങളാണ്: ഈ ഗ്രൂപ്പിൽ പോസ്റ്റ് ചെയ്യുന്നതെല്ലാം ഒരു ഹോസ്റ്റിന് വായിക്കാം. ഒരു അംഗത്തിന്റെ മെനുവിൽ നിന്ന് ഹോസ്റ്റിനെ നിയമിക്കാം; അവർ അത് സ്വീകരിക്കണം. ഒരു ഹോസ്റ്റിനെ നീക്കം ചെയ്താൽ 2 ദിവസത്തിനുള്ളിൽ ഗ്രൂപ്പിന്റെ വിലാസം മാറും, അതോടെ ആ ഉപകരണത്തിന് ഗ്രൂപ്പിലേക്ക് എത്താൻ കഴിയില്ല."

[group_a_call_host_carries_admin]
text = "കോൾ ഹോസ്റ്റാണ് കോൾ നടത്തുന്നത്. കോളിലുള്ള എല്ലാവരും അതിലേക്ക് കണക്റ്റ് ചെയ്യുന്നു, അത് ഓഡിയോ കൈമാറുന്നു, അതിനാൽ അതിന് കോൾ കേൾക്കാൻ കഴിയും. ഇത് ചാറ്റ് ഹോസ്റ്റിംഗിൽ നിന്ന് വ്യത്യസ്തമാണ്: നിങ്ങൾ കോൾ ഹോസ്റ്റായും നിയമിക്കാത്തിടത്തോളം ഒരു ചാറ്റ് ഹോസ്റ്റ് കോൾ ഹോസ്റ്റല്ല. കോൾ ഹോസ്റ്റുകൾ നിങ്ങൾ വിശ്വസിക്കുന്ന അംഗങ്ങളാണ്, ഓരോരുത്തരും സ്വയം സമ്മതിച്ചാണ് അത് ഏറ്റെടുക്കുന്നത്. ഒരു അംഗത്തിന്റെ മെനുവിൽ നിന്ന് ഒരാളെ നിയമിക്കാം, അല്ലെങ്കിൽ ഈ കമ്പ്യൂട്ടറിൽ കോളുകൾ ഹോസ്റ്റ് ചെയ്യാം."

