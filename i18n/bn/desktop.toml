text = "আগে একটি হোস্ট সেট করুন। একটি লিঙ্কে একটিই হোস্ট থাকে।"

[group_it_starts_hosting_once]
text = "কোনো অ্যাডমিন অনুমতি দিলে এটি হোস্টিং শুরু করে (আগেই দিয়ে থাকলে সঙ্গে সঙ্গে)। হোস্টিং করলে আপনি অ্যাডমিন হয়ে যান না; যেকোনো সময় থামাতে পারেন।"

[group_this_group_has_no_host]
text = "এই গ্রুপের কোনো হোস্ট নেই। কোনো অ্যাডমিন একটি হোস্টকে অনুমতি না দেওয়া পর্যন্ত পোস্টগুলো অপেক্ষা করবে।"

[profile_on_wi_fi_and]
text = "প্রতিটি ছবি আসামাত্র ডাউনলোড হয়"

[signup_couldnt_reach_s_tinline]
text = "{name}-এর Tinline-এ পৌঁছানো যায়নি। কিছুক্ষণ পরে আবার চেষ্টা করুন, কিংবা {name} কাছাকাছি থাকলে।"

[signup_still_trying_s_tinline]
text = "এখনও চেষ্টা চলছে। {name}-এর ফোন ঘুমিয়ে থাকলে Tinline সেটিকে জাগিয়ে তুলছে।"

[signup_that_doesnt_look_like]
text = "এটা Tinline-এর কোড বলে মনে হচ্ছে না। পুরোনো সংস্করণের কোড কাজ করে না, তাই ওঁর কাছে নতুন একটা চেয়ে নিন।"
