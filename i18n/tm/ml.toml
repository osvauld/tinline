[t_4b3dcfea10]
en = "**Your other device** carries this call. Everyone in the call connects to it, and it passes the audio on and chooses who is heard when several people speak."
where = [
  "ios call_group_about_your_other: Group call details card, first sentence. The host’s name at the start is bold (markdown stars, keep them around the same words); the whole sentence is one string so the verb can agree with it. Another device of the user’s is the call host.",
]
text = "**നിങ്ങളുടെ മറ്റേ ഉപകരണം** ആണ് ഈ കോൾ നടത്തുന്നത്. കോളിലുള്ള എല്ലാവരും അതിലേക്ക് കണക്റ്റ് ചെയ്യുന്നു, അത് ഓഡിയോ കൈമാറുകയും ഒരേസമയം പലരും സംസാരിക്കുമ്പോൾ ആരെ കേൾക്കണമെന്ന് തീരുമാനിക്കുകയും ചെയ്യുന്നു."

[t_5431505ef8]
en = "**A member’s device** carries this call. Everyone in the call connects to it, and it passes the audio on and chooses who is heard when several people speak."
where = [
  "ios call_group_about_someone: Group call details card, first sentence. The host’s name at the start is bold (markdown stars, keep them around the same words); the whole sentence is one string so the verb can agree with it. A member whose name is not known hosts the call.",
]
text = "**ഒരു അംഗത്തിന്റെ ഉപകരണം** ആണ് ഈ കോൾ നടത്തുന്നത്. കോളിലുള്ള എല്ലാവരും അതിലേക്ക് കണക്റ്റ് ചെയ്യുന്നു, അത് ഓഡിയോ കൈമാറുകയും ഒരേസമയം പലരും സംസാരിക്കുമ്പോൾ ആരെ കേൾക്കണമെന്ന് തീരുമാനിക്കുകയും ചെയ്യുന്നു."

