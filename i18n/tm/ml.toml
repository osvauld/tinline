text = "ഫ്ലാഗുകൾ പിൻവലിക്കാൻ കഴിയില്ല, ഗ്രൂപ്പിൽ നിന്നുള്ള നീക്കം ചെയ്യൽ സ്ഥിരമാണ്. ഒരേ അഡ്മിന് ഒന്നിലധികം തവണ ഫ്ലാഗ് ചെയ്യാം; ഓരോ ഫ്ലാഗും എണ്ണപ്പെടും."

