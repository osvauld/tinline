  "android devices_unlink_warn: Warning card in the unlink dialog, after the bold lead-in Lost or stolen?",
  "ios devices_unlink_warn: Warning card in the unlink dialog.",
  "desktop link_unlinking_cant_lock_it: Desktop, linking devices (in link_view.rs, unlink_confirm).",
