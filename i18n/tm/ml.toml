]
text = "നിങ്ങളുടെ കോൺടാക്റ്റുകൾക്ക് നിങ്ങളുടെ പേരും ഫോട്ടോയും പ്രൊഫൈലും കാണാം. നിങ്ങൾ ആരോടാണ് സംസാരിക്കുന്നതെന്ന് Tinline മറയ്ക്കുന്നില്ല, നിങ്ങളുടെ അക്കൗണ്ടിലേക്ക് ലിങ്ക് ചെയ്ത ഓരോ ഉപകരണത്തിനും നിങ്ങളുടെ ചാറ്റുകൾ വായിക്കാം."

