[t_cbbecd7414]
en = "This phone no longer has the key that opens your account. That happens after a screen-lock reset or a restored backup. Once you restore, your calls come through again."
where = [
  "android unlock_keylost_lead: Explanation under the key-lost heading.",
  "ios unlock_lost_lead: Explanation under the lost-key title.",
]
text = "നിങ്ങളുടെ അക്കൗണ്ട് തുറക്കുന്ന കീ ഇപ്പോൾ ഈ ഫോണിൽ ഇല്ല. സ്ക്രീൻ ലോക്ക് റീസെറ്റ് ചെയ്തതിനു ശേഷമോ ഒരു ബാക്കപ്പ് പുനഃസ്ഥാപിച്ചതിനു ശേഷമോ ഇങ്ങനെ സംഭവിക്കാം. അക്കൗണ്ട് പുനഃസ്ഥാപിച്ചുകഴിഞ്ഞാൽ നിങ്ങളുടെ കോളുകൾ വീണ്ടും എത്തും."

