text = "ലിങ്ക് ഒഴിവാക്കിയാലും ഇവിടെ നിന്ന് അത് ലോക്ക് ചെയ്യാൻ കഴിയില്ല. അത് അൺലോക്ക് ചെയ്യാൻ കഴിയുന്ന ആർക്കും നിങ്ങളുടെ അക്കൗണ്ട് തുടർന്നും ഉപയോഗിക്കാം. പൂർണ്ണമായി ബന്ധം മുറിക്കാനുള്ള ഒരേയൊരു വഴി പുതിയൊരു അക്കൗണ്ടാണ്."

