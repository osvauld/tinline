]
text = "അവർ ഓഫ്‌ലൈനായിരിക്കാം, സിഗ്നൽ ഇല്ലാത്തിടത്തായിരിക്കാം, അല്ലെങ്കിൽ ഇപ്പോൾ കോളുകൾ എടുക്കുന്നില്ലായിരിക്കാം. Tinline-ന് സന്ദേശങ്ങൾ ഇട്ടുവയ്ക്കാൻ കഴിയില്ല."

