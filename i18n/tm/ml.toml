text = "നിങ്ങളുടെ മറ്റ് ഉപകരണങ്ങളിൽ എല്ലാം സുരക്ഷിതമായിരിക്കും."

[t_cac1a71b2b]
en = "It stops syncing and stops ringing for your calls. If it’s online, it removes your account from itself."
where = [
  "android devices_unlink_body: Body of the dialog for unlinking another device. It means the other device.",
  "ios devices_unlink_body: Body of the unlink dialog.",
  "desktop link_it_stops_syncing_and: Desktop, linking devices (in link_view.rs, unlink_confirm).",
]
text = "അത് സിങ്ക് ചെയ്യുന്നതും നിങ്ങളുടെ കോളുകൾക്ക് റിംഗ് ചെയ്യുന്നതും നിർത്തും. അത് ഓൺലൈനിലാണെങ്കിൽ, നിങ്ങളുടെ അക്കൗണ്ട് സ്വയം നീക്കം ചെയ്യും."

[t_04c6ed465e]
en = "Unlinking can’t lock it from here. Anyone who can unlock it can still use your account. The only full cut-off is a new account."
