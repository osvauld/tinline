[t_f76352b5f0]
en = "Hosts store the group and pass posts on when others are offline. They are members you trust: a host can read everything posted in this group. Appoint a host from a member’s menu; they have to accept. Removing a host changes the group’s address within 2 days, so that device can no longer reach it."
where = [
  "ios group_hosts_note_admin: Explanation under the host list, for admins (replaces the plain one).",
  "desktop group_hosts_store_the_group_admin: Desktop, group info, hosts section note, for admins.",
]
text = "ഹോസ്റ്റുകൾ ഗ്രൂപ്പ് സൂക്ഷിക്കുകയും മറ്റുള്ളവർ ഓഫ്‌ലൈനായിരിക്കുമ്പോൾ പോസ്റ്റുകൾ കൈമാറുകയും ചെയ്യുന്നു. അവർ നിങ്ങൾ വിശ്വസിക്കുന്ന അംഗങ്ങളാണ്: ഈ ഗ്രൂപ്പിൽ പോസ്റ്റ് ചെയ്യുന്നതെല്ലാം ഒരു ഹോസ്റ്റിന് വായിക്കാം. ഒരു അംഗത്തിന്റെ മെനുവിൽ നിന്ന് ഹോസ്റ്റിനെ നിയമിക്കാം; അവർ അത് സ്വീകരിക്കണം. ഒരു ഹോസ്റ്റിനെ നീക്കം ചെയ്താൽ 2 ദിവസത്തിനുള്ളിൽ ഗ്രൂപ്പിന്റെ വിലാസം മാറും, അതോടെ ആ ഉപകരണത്തിന് ഗ്രൂപ്പിലേക്ക് എത്താൻ കഴിയില്ല."

[t_8bae39c7cf]
en = "A call host carries the call. Everyone in a call connects to it, and it passes the audio on, so it can hear the call. That is separate from chat hosting: a chat host is not a call host unless you also appoint it as one. Call hosts are members you trust, and each one chooses to accept. Appoint one from a member’s menu, or host calls on this phone. A phone only hosts calls that its owner starts."
where = [
  "ios group_callhosts_note_admin: Explanation under the call host list, for admins.",
]
text = "കോൾ ഹോസ്റ്റാണ് കോൾ നടത്തുന്നത്. കോളിലുള്ള എല്ലാവരും അതിലേക്ക് കണക്റ്റ് ചെയ്യുന്നു, അത് ഓഡിയോ കൈമാറുന്നു, അതിനാൽ അതിന് കോൾ കേൾക്കാൻ കഴിയും. ഇത് ചാറ്റ് ഹോസ്റ്റിംഗിൽ നിന്ന് വ്യത്യസ്തമാണ്: നിങ്ങൾ കോൾ ഹോസ്റ്റായും നിയമിക്കാത്തിടത്തോളം ഒരു ചാറ്റ് ഹോസ്റ്റ് കോൾ ഹോസ്റ്റല്ല. കോൾ ഹോസ്റ്റുകൾ നിങ്ങൾ വിശ്വസിക്കുന്ന അംഗങ്ങളാണ്, ഓരോരുത്തരും സ്വയം സമ്മതിച്ചാണ് അത് ഏറ്റെടുക്കുന്നത്. ഒരു അംഗത്തിന്റെ മെനുവിൽ നിന്ന് ഒരാളെ നിയമിക്കാം, അല്ലെങ്കിൽ ഈ ഫോണിൽ കോളുകൾ ഹോസ്റ്റ് ചെയ്യാം. ഒരു ഫോൺ അതിന്റെ ഉടമ ആരംഭിക്കുന്ന കോളുകൾ മാത്രമേ ഹോസ്റ്റ് ചെയ്യൂ."

