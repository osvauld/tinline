[t_ae23a1918a]
en = "A host keeps a full copy of a group and passes messages on while members’ phones sleep. Members connect to hosts, not to each other; only hosts learn members’ group addresses. Tinline keeps hosting while the window is closed (it stays in the tray)."
where = [
  "desktop group_a_host_keeps_a: Desktop, groups (in group_live_view.rs, live_hosting_page).",
]
text = "ഹോസ്റ്റ് ഗ്രൂപ്പിന്റെ പൂർണ്ണമായ ഒരു പകർപ്പ് സൂക്ഷിക്കുകയും അംഗങ്ങളുടെ ഫോണുകൾ ഉറങ്ങുമ്പോൾ സന്ദേശങ്ങൾ കൈമാറുകയും ചെയ്യുന്നു. അംഗങ്ങൾ പരസ്പരമല്ല, ഹോസ്റ്റുകളുമായാണ് കണക്റ്റ് ചെയ്യുന്നത്; അംഗങ്ങളുടെ ഗ്രൂപ്പ് വിലാസങ്ങൾ ഹോസ്റ്റുകൾ മാത്രമേ അറിയൂ. വിൻഡോ അടച്ചാലും Tinline ഹോസ്റ്റിംഗ് തുടരും (അത് ട്രേയിൽ ഉണ്ടാകും)."

[t_0803302453]
en = "A host keeps a full copy of the group, passes messages on while members’ phones sleep and learns members’ group addresses. It needs to stay running. Hosting doesn’t make you an admin; you can stop any time."
where = [
  "desktop group_a_host_keeps_a_full: Desktop, groups (in group_live_view.rs, live_pane).",
]
text = "ഹോസ്റ്റ് ഗ്രൂപ്പിന്റെ പൂർണ്ണമായ ഒരു പകർപ്പ് സൂക്ഷിക്കുന്നു, അംഗങ്ങളുടെ ഫോണുകൾ ഉറങ്ങുമ്പോൾ സന്ദേശങ്ങൾ കൈമാറുന്നു, അംഗങ്ങളുടെ ഗ്രൂപ്പ് വിലാസങ്ങൾ അറിയുകയും ചെയ്യുന്നു. അത് പ്രവർത്തിച്ചുകൊണ്ടിരിക്കണം. ഹോസ്റ്റ് ചെയ്യുന്നതുകൊണ്ട് നിങ്ങൾ അഡ്മിൻ ആകുന്നില്ല; എപ്പോൾ വേണമെങ്കിലും നിർത്താം."

