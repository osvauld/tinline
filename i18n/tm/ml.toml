[t_adb8ec2424]
en = "Anyone with this link or QR can join {name} for 7 days. Share it over an app you trust; you see who joined and can flag them out. To invite your contacts directly, use Add members."
where = [
  "android groupsb_link_note: Hint on the invite link page. {name} is the group's name. 'Add members' is the title of another page.",
]
text = "ഈ ലിങ്കോ QR-ഓ ഉള്ള ആർക്കും 7 ദിവസത്തേക്ക് {name} ഗ്രൂപ്പിൽ ചേരാം. നിങ്ങൾ വിശ്വസിക്കുന്ന ഒരു ആപ്പ് വഴി ഇത് പങ്കിടുക; ആരൊക്കെ ചേർന്നുവെന്ന് നിങ്ങൾക്ക് കാണാം, അവരെ ഫ്ലാഗ് ചെയ്ത് പുറത്താക്കാനും കഴിയും. നിങ്ങളുടെ കോൺടാക്റ്റുകളെ നേരിട്ട് ക്ഷണിക്കാൻ, അംഗങ്ങളെ ചേർക്കുക ഉപയോഗിക്കുക."

