[t_4fd34ee091]
en = "You keep the posts already on this device, and you can read them. You can’t post, and the group’s hosts no longer accept anything from you. Removal is final: to come back, an admin has to invite you again."
where = [
  "android groupsb_removal_body: Explanation on the removal page.",
  "ios group_removal_text: Explanation on the removal page.",
]
text = "ഈ ഉപകരണത്തിൽ ഇതിനകമുള്ള പോസ്റ്റുകൾ നിങ്ങൾക്കൊപ്പമുണ്ടാകും, അവ വായിക്കാം. നിങ്ങൾക്ക് പോസ്റ്റ് ചെയ്യാൻ കഴിയില്ല, ഗ്രൂപ്പിന്റെ ഹോസ്റ്റുകൾ ഇനി നിങ്ങളിൽ നിന്ന് ഒന്നും സ്വീകരിക്കില്ല. ഈ നീക്കം ചെയ്യൽ സ്ഥിരമാണ്: തിരികെ വരാൻ, ഒരു അഡ്മിൻ നിങ്ങളെ വീണ്ടും ക്ഷണിക്കണം."

