  "ios devices_remove_body: Body of the remove-account dialog.",
]
text = "ഈ ഫോൺ സിങ്ക് ചെയ്യുന്നതും റിംഗ് ചെയ്യുന്നതും നിർത്തും, നിങ്ങളുടെ അക്കൗണ്ട്, കോൺടാക്റ്റുകൾ, ചാറ്റുകൾ, കോൾ ചരിത്രം എന്നിവ ഇതിൽ നിന്ന് ഇല്ലാതാക്കും."

[t_617985c94e]
en = "This is the only device with your account. Without your recovery phrase nothing can bring it back."
where = [
  "android devices_remove_only: Warning card in the remove dialog when no other device has the account.",
  "ios devices_only_device: Warning card in the remove-account dialog.",
]
text = "നിങ്ങളുടെ അക്കൗണ്ടുള്ള ഒരേയൊരു ഉപകരണം ഇതാണ്. വീണ്ടെടുക്കൽ വാക്കുകളില്ലാതെ അത് തിരികെ കൊണ്ടുവരാൻ ഒരു വഴിയുമില്ല."

[t_7bd075ae97]
en = "Your other devices keep everything."
