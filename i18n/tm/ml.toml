]
one = "ഏതെങ്കിലും അഡ്മിനിൽ നിന്ന് ഒരു ഫ്ലാഗ് കൂടി വന്നാൽ നിങ്ങളെ ഗ്രൂപ്പിൽ നിന്ന് നീക്കം ചെയ്യും. ഫ്ലാഗുകൾ പിൻവലിക്കാൻ കഴിയില്ല. അതുവരെ നിങ്ങൾക്ക് വായിക്കാനും പോസ്റ്റ് ചെയ്യാനും കഴിയും."
other = "ഏതെങ്കിലും അഡ്മിനിൽ നിന്ന് {count} ഫ്ലാഗുകൾ കൂടി വന്നാൽ നിങ്ങളെ ഗ്രൂപ്പിൽ നിന്ന് നീക്കം ചെയ്യും. ഫ്ലാഗുകൾ പിൻവലിക്കാൻ കഴിയില്ല. അതുവരെ നിങ്ങൾക്ക് വായിക്കാനും പോസ്റ്റ് ചെയ്യാനും കഴിയും."

