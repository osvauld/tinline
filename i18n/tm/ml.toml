text = "രണ്ട് ഉപകരണങ്ങൾ ഒരേസമയം ഓൺലൈനിലാകുമ്പോഴെല്ലാം അവ നേരിട്ട് സിങ്ക് ചെയ്യും. ലിങ്ക് ഒഴിവാക്കിയാൽ സിങ്കും റിംഗിംഗും നിൽക്കും; നഷ്ടപ്പെട്ട ഉപകരണം ദൂരെ നിന്ന് ലോക്ക് ചെയ്യാൻ അതിന് കഴിയില്ല."

