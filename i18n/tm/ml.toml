[t_c49fb39b57]
en = "Carries the calls you start here. A computer that stays on can carry everyone’s."
where = [
  "android groupsb_host_calls_phone_sub: Second line of the Host calls on this phone row.",
  "ios group_callhost_here_sub: Sub line under Host calls on this phone.",
]
text = "ഇവിടെ നിങ്ങൾ ആരംഭിക്കുന്ന കോളുകൾ നടത്തും. ഓണായിരിക്കുന്ന ഒരു കമ്പ്യൂട്ടറിന് എല്ലാവരുടെയും കോളുകൾ നടത്താം."

[t_bffce84c57]
en = "A call host carries the call. Everyone in a call connects to it, and it passes the audio on, so it can hear the call. That is separate from chat hosting: a chat host is not a call host unless you also appoint it as one. Call hosts are members you trust, and each one chooses to accept."
where = [
  "android groupsb_callhosts_note: Explanation under the Call hosts section.",
  "ios group_callhosts_note_base: Explanation under the call host list.",
  "desktop group_a_call_host_carries: Desktop, group info, call hosts section note, for members.",
]
text = "കോൾ ഹോസ്റ്റാണ് കോൾ നടത്തുന്നത്. കോളിലുള്ള എല്ലാവരും അതിലേക്ക് കണക്റ്റ് ചെയ്യുന്നു, അത് ഓഡിയോ കൈമാറുന്നു, അതിനാൽ അതിന് കോൾ കേൾക്കാൻ കഴിയും. ഇത് ചാറ്റ് ഹോസ്റ്റിംഗിൽ നിന്ന് വ്യത്യസ്തമാണ്: നിങ്ങൾ കോൾ ഹോസ്റ്റായും നിയമിക്കാത്തിടത്തോളം ഒരു ചാറ്റ് ഹോസ്റ്റ് കോൾ ഹോസ്റ്റല്ല. കോൾ ഹോസ്റ്റുകൾ നിങ്ങൾ വിശ്വസിക്കുന്ന അംഗങ്ങളാണ്, ഓരോരുത്തരും സ്വയം സമ്മതിച്ചാണ് അത് ഏറ്റെടുക്കുന്നത്."

[t_4e4a80a8ec]
en = "Appoint one from a member’s menu, or host calls on this phone. A phone only hosts calls that its owner starts."
where = [
  "android groupsb_callhosts_note_admin: Extra sentences added after the Call hosts explanation for admins (a space is put before them).",
]
text = "ഒരു അംഗത്തിന്റെ മെനുവിൽ നിന്ന് ഒരാളെ നിയമിക്കാം, അല്ലെങ്കിൽ ഈ ഫോണിൽ കോളുകൾ ഹോസ്റ്റ് ചെയ്യാം. ഒരു ഫോൺ അതിന്റെ ഉടമ ആരംഭിക്കുന്ന കോളുകൾ മാത്രമേ ഹോസ്റ്റ് ചെയ്യൂ."

