[t_4c02b33d24]
en = "**This phone** is carrying this call. Everyone in the call connects to it, and it passes the audio on and chooses who is heard when several people speak."
where = [
  "android gcall_about_this_phone: First paragraph of the group call About sheet, when this phone is the call host. The ** marks make 'This phone' bold; keep them around the host.",
  "ios call_group_about_this_phone: Group call details card, first sentence. The host’s name at the start is bold (markdown stars, keep them around the same words); the whole sentence is one string so the verb can agree with it. This phone is the call host.",
]
text = "**ഈ ഫോൺ** ആണ് ഈ കോൾ നടത്തുന്നത്. കോളിലുള്ള എല്ലാവരും ഇതിലേക്ക് കണക്റ്റ് ചെയ്യുന്നു, ഇത് ഓഡിയോ കൈമാറുകയും ഒരേസമയം പലരും സംസാരിക്കുമ്പോൾ ആരെ കേൾക്കണമെന്ന് തീരുമാനിക്കുകയും ചെയ്യുന്നു."

[t_5ddff93ea5]
en = "**{name}’s device** carries this call. Everyone in the call connects to it, and it passes the audio on and chooses who is heard when several people speak."
where = [
