]
text = "ഒരു അഡ്മിൻ നിയമിക്കുമ്പോൾ ഇത് ഹോസ്റ്റ് ചെയ്തുതുടങ്ങും (ഇതിനകം നിയമിച്ചിട്ടുണ്ടെങ്കിൽ, ഉടൻ). ഹോസ്റ്റ് ചെയ്യുന്നതുകൊണ്ട് നിങ്ങൾ അഡ്മിൻ ആകുന്നില്ല; എപ്പോൾ വേണമെങ്കിലും നിർത്താം."

[t_ecbb1b9328]
en = "Joining connects this computer to the group’s hosts. Members see your name; only hosts learn how to reach this computer. It can take up to a minute."
where = [
  "desktop group_joining_connects_this_computer: Desktop, groups (in group_live_view.rs, live_overlay).",
]
text = "ചേരുമ്പോൾ ഈ കമ്പ്യൂട്ടർ ഗ്രൂപ്പിന്റെ ഹോസ്റ്റുകളുമായി കണക്റ്റ് ചെയ്യും. അംഗങ്ങൾക്ക് നിങ്ങളുടെ പേര് കാണാം; ഈ കമ്പ്യൂട്ടറിലേക്ക് എങ്ങനെ എത്താമെന്ന് ഹോസ്റ്റുകൾക്ക് മാത്രമേ അറിയൂ. ഇതിന് ഒരു മിനിറ്റ് വരെ എടുത്തേക്കാം."

[t_c3fc51db22]
en = "• keep a full copy of the group\n• pass messages on for members while their phones sleep\n• learn members’ group addresses (only hosts do)\n• need to stay running to be useful"
