  "desktop group_keep_a_full_copy: Desktop, groups (in group_live_view.rs, live_overlay).",
]
text = "• ഗ്രൂപ്പിന്റെ പൂർണ്ണമായ ഒരു പകർപ്പ് സൂക്ഷിക്കും\n• അംഗങ്ങളുടെ ഫോണുകൾ ഉറങ്ങുമ്പോൾ അവർക്കായി സന്ദേശങ്ങൾ കൈമാറും\n• അംഗങ്ങളുടെ ഗ്രൂപ്പ് വിലാസങ്ങൾ അറിയും (ഹോസ്റ്റുകൾ മാത്രം)\n• ഉപകാരപ്പെടാൻ പ്രവർത്തിച്ചുകൊണ്ടിരിക്കണം"

