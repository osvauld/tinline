]
text = "थेट लाइन शक्य नसेल तेव्हा, एन्क्रिप्टेड रिले कॉल पुढे पोहोचवतो. तो कॉल ऐकू शकत नाही."

[t_07e63c57a9]
en = "Your account is yours."
