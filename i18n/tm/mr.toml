[t_0f88da7d0c]
en = "A host keeps a full copy of the group, passes messages on while members’ phones sleep and learns members’ group addresses. It needs to stay online and uses battery: a computer that stays on is a better host. Hosting doesn’t make you an admin."
where = [
  "android groups_host_ask_body: Explanation under the host request card in a group chat.",
  "ios group_host_asked_text: Notice text explaining what hosting means.",
]
text = "होस्ट ग्रुपची पूर्ण प्रत ठेवतो, सदस्यांचे फोन स्लीपमध्ये असताना संदेश पुढे पाठवतो आणि सदस्यांचे ग्रुप पत्ते जाणतो. त्याला ऑनलाइन राहावे लागते आणि त्यात बॅटरी खर्च होते: सतत चालू राहणारा कॉम्प्युटर अधिक चांगला होस्ट असतो. होस्ट केल्याने तुम्ही ॲडमिन होत नाही."

