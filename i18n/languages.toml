# Every language Tinline ships. `tag` is the BCP-47 tag used by Android
# (values-b+...), iOS (String Catalog) and the desktop table.
# `rtl` languages need mirrored layouts; `font` names a script the OS may not
# carry, so the app bundles a Noto font for it.
# `review` = machine draft that a native speaker has not checked yet.

[[language]]
tag = "en"
name = "English"
source = true

[[language]]
tag = "fi"
name = "Suomi"

[[language]]
tag = "fr"
name = "Français"

[[language]]
tag = "de"
name = "Deutsch"

[[language]]
tag = "ar"
name = "العربية"
rtl = true

