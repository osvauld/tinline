text = "A call host carries the call. Everyone in a call connects to it, and it passes the audio on, so it can hear the call. That is separate from chat hosting: a chat host is not a call host unless you also appoint it as one. Call hosts are members you trust, and each one chooses to accept."
note = "Desktop, group info, call hosts section note, for members."

[group_a_call_host_is]
text = "A call host is a member’s computer or phone that carries the call. An admin can appoint one in Group info."
note = "Desktop, groups (in group_live_view.rs, live_pane)."

[group_a_call_host_is_a]
text = "A call host is a member’s computer or phone that carries the call. You can host calls on this computer, or appoint a member in Group info."
note = "Desktop, groups (in group_live_view.rs, live_pane)."

[group_a_call_needs_a]
text = "A call needs a call host"
note = "Desktop, groups (in group_live_view.rs, live_pane)."

[group_a_flag_is_signed]
text = "A flag is signed by you and can’t be taken back. {name} can see who flagged them and when. Messages {name} wrote before the removal still show, marked."
note = "Desktop, groups (in group_live_view.rs, live_overlay). {name} is a person's name (usually the first word of their chosen name)."

[group_a_host_keeps_a]
text = "A host keeps a full copy of a group and passes messages on while members’ phones sleep. Members connect to hosts, not to each other; only hosts learn members’ group addresses. Tinline keeps hosting while the window is closed (it stays in the tray)."
note = "Desktop, groups (in group_live_view.rs, live_hosting_page)."

[group_a_host_keeps_a_full]
text = "A host keeps a full copy of the group, passes messages on while members’ phones sleep and learns members’ group addresses. It needs to stay running. Hosting doesn’t make you an admin; you can stop any time."
note = "Desktop, groups (in group_live_view.rs, live_pane)."

