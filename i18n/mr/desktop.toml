text = "होस्ट ग्रुप साठवतात आणि इतर ऑफलाइन असताना पोस्ट पुढे पाठवतात. ते तुमच्या विश्वासातले सदस्य असतात: होस्ट या ग्रुपमध्ये पोस्ट केलेले सर्व काही वाचू शकतो. सदस्याच्या मेनूमधून होस्ट नेमा; त्यांना ते स्वीकारावे लागेल. होस्ट काढल्यावर 2 दिवसांत ग्रुपचा पत्ता बदलतो, त्यामुळे ते डिव्हाइस ग्रुपपर्यंत पोहोचू शकत नाही."

[group_a_call_host_carries_admin]
text = "कॉल होस्ट कॉल चालवतो. कॉलमधील सर्व जण त्याच्याशी जोडले जातात आणि तो आवाज पुढे पाठवतो, त्यामुळे तो कॉल ऐकू शकतो. हे चॅट होस्टिंगपेक्षा वेगळे आहे: चॅट होस्टला तुम्ही कॉल होस्ट म्हणूनही नेमल्याशिवाय तो कॉल होस्ट होत नाही. कॉल होस्ट हे तुमच्या विश्वासातले सदस्य असतात, आणि स्वीकारायचे की नाही हे प्रत्येकाच्या हातात असते. सदस्याच्या मेनूमधून एखादा नेमा, किंवा या कॉम्प्युटरवर कॉल होस्ट करा."

