text = "இப்போது {name} இந்த ஃபோனில் திறந்துள்ளது. உங்கள் மற்றொரு கணக்கு இங்கே இன்னும் ஒலிக்கும், புதிய செய்திகளையும் தெரிவிக்கும். அமைப்புகளில் மாறலாம்."

[onboarding_restored_lead_adding_push_unnamed]
text = "இப்போது இந்தக் கணக்கு இந்த ஃபோனில் திறந்துள்ளது. உங்கள் மற்றொரு கணக்கு இங்கே இன்னும் ஒலிக்கும், புதிய செய்திகளையும் தெரிவிக்கும். அமைப்புகளில் மாறலாம்."
