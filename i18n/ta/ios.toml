[group_callhosts_note_base]
text = "அழைப்பு ஹோஸ்ட் அழைப்பை நடத்துகிறது. அழைப்பில் உள்ள அனைவரும் அதனுடன் இணைகிறார்கள், அது ஒலியைக் கடத்துகிறது, எனவே அதனால் அழைப்பைக் கேட்க முடியும். இது குழு ஹோஸ்டிங்கிலிருந்து தனி: ஒரு குழு ஹோஸ்ட்டை அழைப்பு ஹோஸ்ட்டாகவும் நீங்கள் நியமித்தால் மட்டுமே அது அழைப்பு ஹோஸ்ட் ஆகும். அழைப்பு ஹோஸ்ட்கள் நீங்கள் நம்பும் உறுப்பினர்கள், ஒவ்வொருவரும் ஏற்பதா என்பதைத் தாங்களே முடிவு செய்கிறார்கள்."

[group_callhosts_note_admin]
