[group_hosts_note_base]
text = "மற்றவர்கள் ஆஃப்லைனில் இருக்கும்போது, ஹோஸ்ட்கள் குழுவைச் சேமித்து இடுகைகளைக் கடத்தும். அவர்கள் நீங்கள் நம்பும் உறுப்பினர்கள்: இந்தக் குழுவில் இடப்படும் அனைத்தையும் ஒரு ஹோஸ்ட் படிக்க முடியும்."

[group_hosts_note_admin]
text = "மற்றவர்கள் ஆஃப்லைனில் இருக்கும்போது, ஹோஸ்ட்கள் குழுவைச் சேமித்து இடுகைகளைக் கடத்தும். அவர்கள் நீங்கள் நம்பும் உறுப்பினர்கள்: இந்தக் குழுவில் இடப்படும் அனைத்தையும் ஒரு ஹோஸ்ட் படிக்க முடியும். உறுப்பினரின் மெனுவிலிருந்து ஒரு ஹோஸ்ட்டை நியமியுங்கள்; அவர் ஏற்க வேண்டும். ஒரு ஹோஸ்ட்டை அகற்றினால், 2 நாட்களுக்குள் குழுவின் முகவரி மாறும், அதனால் அந்தச் சாதனம் இனி குழுவை அடைய முடியாது."

