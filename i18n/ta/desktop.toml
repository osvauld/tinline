[group_hosts_store_the_group_admin]
text = "மற்றவர்கள் ஆஃப்லைனில் இருக்கும்போது, ஹோஸ்ட்கள் குழுவைச் சேமித்து இடுகைகளைக் கடத்தும். அவர்கள் நீங்கள் நம்பும் உறுப்பினர்கள்: இந்தக் குழுவில் இடப்படும் அனைத்தையும் ஒரு ஹோஸ்ட் படிக்க முடியும். உறுப்பினரின் மெனுவிலிருந்து ஒரு ஹோஸ்ட்டை நியமியுங்கள்; அவர் ஏற்க வேண்டும். ஒரு ஹோஸ்ட்டை அகற்றினால், 2 நாட்களுக்குள் குழுவின் முகவரி மாறும், அதனால் அந்தச் சாதனம் இனி குழுவை அடைய முடியாது."

[group_a_call_host_carries_admin]
text = "அழைப்பு ஹோஸ்ட் அழைப்பை நடத்துகிறது. அழைப்பில் உள்ள அனைவரும் அதனுடன் இணைகிறார்கள், அது ஒலியைக் கடத்துகிறது, எனவே அதனால் அழைப்பைக் கேட்க முடியும். இது குழு ஹோஸ்டிங்கிலிருந்து தனி: ஒரு குழு ஹோஸ்ட்டை அழைப்பு ஹோஸ்ட்டாகவும் நீங்கள் நியமித்தால் மட்டுமே அது அழைப்பு ஹோஸ்ட் ஆகும். அழைப்பு ஹோஸ்ட்கள் நீங்கள் நம்பும் உறுப்பினர்கள், ஒவ்வொருவரும் ஏற்பதா என்பதைத் தாங்களே முடிவு செய்கிறார்கள். உறுப்பினரின் மெனுவிலிருந்து ஒன்றை நியமியுங்கள், அல்லது இந்தக் கணினியிலேயே அழைப்புகளை ஹோஸ்ட் செய்யுங்கள்."

